name: orvix
description: A modern desktop media discovery and streaming client focused on PikPak and debrid workflows.
publish_to: "none"
version: 0.6.1+31

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  window_manager: ^0.4.3
  url_launcher: ^6.3.0
  path_provider: ^2.1.4
  path: ^1.9.0
  collection: ^1.18.0
  supabase_flutter: ^2.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
