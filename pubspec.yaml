name: pikora
description: PikPak-first cinematic media hub for Windows and Android.
publish_to: 'none'
version: 0.3.4+9

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  media_kit: ^1.1.11
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.5
  file_picker: ^11.0.3
  window_manager: ^0.5.2

flutter:
  uses-material-design: true
