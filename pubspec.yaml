name: orvix
description: Multi-platform cinematic media hub for Windows, Android mobile, Android TV and macOS.
publish_to: 'none'
version: 0.7.6-beta.35+126

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  archive: ^4.3.0
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  flutter_secure_storage: ^11.2.0
  http: ^1.2.2
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  media_kit: ^1.1.11
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.5
  file_picker: ^13.1.0
  # Cross-platform embedded subtitle extraction from HTTPS/debrid/local streams.
  # Pin the reviewed LGPL HTTPS build so Android/TV/Windows/macOS use one API.
  ffmpeg_kit_flutter_new_https: 2.6.2
  path_provider: ^2.1.5
  window_manager: ^0.5.2
  video_player: ^2.14.0
  supabase_flutter: 2.15.4

# Debrify carries two media_kit fixes that matter for desktop stability:
# safer NativeCallable ownership/disposal and waiting for native render-context
# teardown before libmpv destruction on Windows/Apple. Pin the exact reviewed
# Debrify commit so a future upstream change cannot silently alter Orvix.
dev_dependencies:
  flutter_test:
    sdk: flutter

dependency_overrides:
  media_kit:
    git:
      url: https://github.com/varunsalian/debrify.git
      ref: 709eca3a0828f2b5bfdaf153ab6a0c00a89c5f2d
      path: packages/media_kit_patched
  media_kit_video:
    git:
      url: https://github.com/varunsalian/debrify.git
      ref: 709eca3a0828f2b5bfdaf153ab6a0c00a89c5f2d
      path: packages/media_kit_video_patched

flutter:
  uses-material-design: true
  assets:
    - assets/branding/orvix_icon.png
    - assets/branding/orvix_tv_banner.jpg
