name: Finalize Orvix v0.5 Source Priority

on:
  push:
    branches:
      - orvix-v0.5.0-dev
    paths:
      - '.github/workflows/orvix-v050-final-touch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: orvix-v0.5.0-dev

      - name: Apply requested default priority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/services/source_provider_service.dart')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              "static const _priorityKey = 'orvix_source_priority_v3';",
              "static const _priorityKey = 'orvix_source_priority_v4';",
          )
          old = """  static const defaultPriority = <SourceSortCriterion>[\n    SourceSortCriterion.resolution,\n    SourceSortCriterion.releaseQuality,\n    SourceSortCriterion.seeders,\n    SourceSortCriterion.fileSize,\n  ];"""
          new = """  static const defaultPriority = <SourceSortCriterion>[\n    SourceSortCriterion.releaseQuality,\n    SourceSortCriterion.resolution,\n    SourceSortCriterion.seeders,\n    SourceSortCriterion.fileSize,\n  ];"""
          if old not in text:
              raise SystemExit('defaultPriority block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          Path('.github/workflows/orvix-v050-final-touch.yml').unlink()
          PY

      - name: Commit final patch
        shell: bash
        run: |
          git config user.name "Ishara Lakshan"
          git config user.email "ishara@tuta.io"
          git add -A
          git commit -m "fix: use requested Orvix source priority by default"
          git push origin HEAD:orvix-v0.5.0-dev
