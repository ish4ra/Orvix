name: Validate committed Pikora v0.3.7 source picker

on:
  push:
    branches:
      - v0.3.7-source-browser
    paths:
      - '.github/workflows/patch-v037b.yml'

permissions:
  contents: write

jobs:
  patch-commit-validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v0.3.7-source-browser

      - name: Patch source picker and release metadata
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          details = Path('lib/screens/details_screen.dart')
          text = details.read_text(encoding='utf-8')
          start = text.index('  Future<SourceResult?> _chooseSource(')
          end = text.index('  Future<PikPakFile?> _findInPikPak(', start)
          picker = r'''  Future<SourceResult?> _chooseSource(List<SourceResult> results) async {
            var activeSort = await widget.sources.getSortMode();
            if (!mounted) return null;

            int score(SourceResult result, SourceSortMode mode) {
              final seederRank = (result.seeders ?? -1).clamp(-1, 999999).toInt() + 1;
              final sizeMb = ((result.sizeBytes ?? 0) ~/ (1024 * 1024))
                  .clamp(0, 999999)
                  .toInt();
              switch (mode) {
                case SourceSortMode.quality:
                  return result.qualityRank * 1000000000000 +
                      seederRank * 1000000 +
                      sizeMb;
                case SourceSortMode.seeders:
                  return seederRank * 1000000000000 +
                      result.qualityRank * 1000000 +
                      sizeMb;
                case SourceSortMode.fileSize:
                  return sizeMb * 1000000000 +
                      result.qualityRank * 1000000 +
                      seederRank;
              }
            }

            return showModalBottomSheet<SourceResult>(
              context: context,
              backgroundColor: const Color(0xFF11141C),
              showDragHandle: true,
              isScrollControlled: true,
              constraints: const BoxConstraints(maxWidth: 920),
              builder: (sheetContext) => StatefulBuilder(
                builder: (context, setSheetState) {
                  final sorted = [...results]
                    ..sort((a, b) => score(b, activeSort).compareTo(score(a, activeSort)));
                  final best = sorted.isEmpty ? null : sorted.first;
                  final color = Theme.of(context).colorScheme;

                  return SafeArea(
                    child: SizedBox(
                      height: MediaQuery.sizeOf(context).height * .82,
                      child: Padding(
                        padding: const EdgeInsets.fromLTRB(22, 4, 22, 24),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Row(
                              children: [
                                Expanded(
                                  child: Column(
                                    crossAxisAlignment: CrossAxisAlignment.start,
                                    children: [
                                      Text(
                                        'Choose source',
                                        style: Theme.of(context)
                                            .textTheme
                                            .titleLarge
                                            ?.copyWith(fontWeight: FontWeight.w900),
                                      ),
                                      const SizedBox(height: 4),
                                      Text(
                                        '${results.length} result${results.length == 1 ? '' : 's'} returned • showing all',
                                        style: TextStyle(color: color.onSurfaceVariant),
                                      ),
                                    ],
                                  ),
                                ),
                                if (best != null)
                                  FilledButton.icon(
                                    onPressed: () => Navigator.pop(sheetContext, best),
                                    icon: const Icon(Icons.bolt_rounded),
                                    label: Text('Quick Play ${best.quality ?? ''}'.trim()),
                                  ),
                              ],
                            ),
                            const SizedBox(height: 15),
                            Row(
                              children: [
                                Text(
                                  'Sort by',
                                  style: TextStyle(
                                    color: color.onSurfaceVariant,
                                    fontWeight: FontWeight.w700,
                                  ),
                                ),
                                const SizedBox(width: 12),
                                Expanded(
                                  child: SegmentedButton<SourceSortMode>(
                                    showSelectedIcon: true,
                                    segments: const [
                                      ButtonSegment(
                                        value: SourceSortMode.quality,
                                        icon: Icon(Icons.high_quality_rounded),
                                        label: Text('Quality'),
                                      ),
                                      ButtonSegment(
                                        value: SourceSortMode.seeders,
                                        icon: Icon(Icons.people_alt_rounded),
                                        label: Text('Seeders'),
                                      ),
                                      ButtonSegment(
                                        value: SourceSortMode.fileSize,
                                        icon: Icon(Icons.storage_rounded),
                                        label: Text('File size'),
                                      ),
                                    ],
                                    selected: {activeSort},
                                    onSelectionChanged: (selection) {
                                      if (selection.isEmpty) return;
                                      final next = selection.first;
                                      setSheetState(() => activeSort = next);
                                      widget.sources.setSortMode(next);
                                    },
                                  ),
                                ),
                              ],
                            ),
                            const SizedBox(height: 9),
                            Text(
                              activeSort == SourceSortMode.quality
                                  ? 'Priority: quality → seeders → file size'
                                  : activeSort == SourceSortMode.seeders
                                      ? 'Priority: seeders → quality → file size'
                                      : 'Priority: file size → quality → seeders',
                              style: TextStyle(
                                color: color.primary,
                                fontSize: 12,
                                fontWeight: FontWeight.w700,
                              ),
                            ),
                            const SizedBox(height: 12),
                            const Divider(height: 1),
                            Expanded(
                              child: ListView.separated(
                                itemCount: sorted.length,
                                separatorBuilder: (_, __) => const Divider(height: 1),
                                itemBuilder: (context, index) {
                                  final result = sorted[index];
                                  return ListTile(
                                    contentPadding: const EdgeInsets.symmetric(
                                      horizontal: 8,
                                      vertical: 7,
                                    ),
                                    leading: CircleAvatar(
                                      radius: 25,
                                      child: Text(
                                        result.quality?.replaceAll('P', '') ?? '—',
                                        style: const TextStyle(
                                          fontSize: 12,
                                          fontWeight: FontWeight.w900,
                                        ),
                                      ),
                                    ),
                                    title: Text(
                                      result.title,
                                      maxLines: 2,
                                      overflow: TextOverflow.ellipsis,
                                      style: const TextStyle(height: 1.38),
                                    ),
                                    subtitle: Padding(
                                      padding: const EdgeInsets.only(top: 4),
                                      child: Text(
                                        '${result.provider}${result.isMagnet ? ' • PikPak cloud source' : ' • direct URL'}',
                                      ),
                                    ),
                                    trailing: index == 0
                                        ? const Chip(label: Text('Best'))
                                        : const Icon(Icons.chevron_right_rounded),
                                    onTap: () => Navigator.pop(sheetContext, result),
                                  );
                                },
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
                  );
                },
              ),
            );
          }

          '''
          details.write_text(text[:start] + picker + text[end:], encoding='utf-8')

          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text(encoding='utf-8')
          text = text.replace('version: 0.3.6+14', 'version: 0.3.7+15', 1)
          pubspec.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = 'This file tracks user-visible changes to Pikora. GitHub Releases are published automatically for new packaged versions starting with v0.3.2.\n\n'
          section = '''## v0.3.7 — richer source browser & quality-first ranking

          - Source cards now surface parsed seeder counts and file sizes before the release name.
          - Default ranking is strict `quality → seeders → file size` priority.
          - Added live Quality / Seeders / File size sorting directly inside the source picker; the selected mode is remembered.
          - Removed the 30-row source display cap; every unique result returned by configured providers is shown.
          - Expanded Stremio/Torrentio parsing for seed-count variants, GiB/TiB sizes, comma decimals, behavior hints, and alternate size fields.
          - Keeps identical resources from different configured providers as separate rows so provider-specific metadata is preserved.

          '''
          if '## v0.3.7 — richer source browser' not in text:
              text = text.replace(marker, marker + section, 1)
          changelog.write_text(text, encoding='utf-8')
          '@ | Set-Content -Encoding UTF8 patch_v037b.py
          python patch_v037b.py
          Remove-Item patch_v037b.py

      - name: Commit patched files before validation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/details_screen.dart pubspec.yaml CHANGELOG.md
          git commit -m "feat: finish v0.3.7 source picker"
          git push origin HEAD:v0.3.7-source-browser

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner
        shell: pwsh
        run: flutter create --platforms=windows --project-name pikora .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app sources
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Build Windows release
        run: flutter build windows --release
