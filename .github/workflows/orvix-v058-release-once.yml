name: Validate and Tag Orvix v0.5.8 Once

on:
  push:
    branches:
      - orvix-v0.5.8-aiometadata
    paths:
      - '.github/workflows/orvix-v058-release-once.yml'

permissions:
  contents: write

jobs:
  validate-and-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app sources
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Tag v0.5.8
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin refs/tags/v0.5.8 >/dev/null 2>&1; then
            echo 'v0.5.8 already exists; nothing to do.'
            exit 0
          fi
          git tag v0.5.8
          git push origin v0.5.8
