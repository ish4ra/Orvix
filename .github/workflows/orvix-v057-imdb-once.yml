name: Validate and Tag Orvix v0.5.7 IMDb Fix Once

on:
  push:
    branches:
      - orvix-v0.5.7-imdb-top
    paths:
      - '.github/workflows/orvix-v057-imdb-once.yml'

permissions:
  contents: write

jobs:
  validate-and-tag:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Smoke test live IMDb charts
        shell: pwsh
        run: |
          function Test-ImdbChart([string]$chartType) {
            $query = "{ chartTitles(chart: {chartType: $chartType}, first: 10) { edges { node { id titleText { text } ratingsSummary { aggregateRating voteCount } } } } }"
            $payload = @{ query = $query } | ConvertTo-Json -Compress
            $headers = @{
              Accept = 'application/json'
              Origin = 'https://www.imdb.com'
              Referer = 'https://www.imdb.com/'
              'x-imdb-client-name' = 'imdb-web-next'
            }
            $response = Invoke-RestMethod -Uri 'https://caching.graphql.imdb.com/' -Method Post -ContentType 'application/json' -Headers $headers -Body $payload -TimeoutSec 30
            $edges = @($response.data.chartTitles.edges)
            if ($edges.Count -lt 5) { throw "IMDb $chartType returned too few rows: $($edges.Count)" }
            foreach ($edge in $edges) {
              if ($edge.node.id -notmatch '^tt\d{7,10}$') { throw "Invalid IMDb id: $($edge.node.id)" }
              if (-not $edge.node.titleText.text) { throw 'IMDb chart row is missing a title.' }
              if (-not $edge.node.ratingsSummary.aggregateRating) { throw "IMDb chart row $($edge.node.id) is missing a rating." }
            }
            Write-Host "$chartType OK: $($edges[0].node.id) $($edges[0].node.titleText.text) rating=$($edges[0].node.ratingsSummary.aggregateRating)"
          }
          Test-ImdbChart 'TOP_RATED_MOVIES'
          Test-ImdbChart 'TOP_RATED_TV_SHOWS'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preserve manually fixed Windows icon hash
        shell: pwsh
        run: |
          $icon = 'windows\runner\resources\app_icon.ico'
          if (-not (Test-Path $icon)) { throw 'Pinned Orvix app icon is missing.' }
          $hash = (Get-FileHash $icon -Algorithm SHA256).Hash
          "ORVIX_ICON_HASH=$hash" >> $env:GITHUB_ENV

      - name: Format changed Dart file
        run: dart format lib/services/catalog_service.dart

      - name: Generate Windows runner
        shell: pwsh
        run: flutter create --platforms=windows --project-name orvix .

      - name: Restore exact pinned Orvix icon
        shell: pwsh
        run: |
          git checkout HEAD -- windows/runner/resources/app_icon.ico
          $hash = (Get-FileHash 'windows\runner\resources\app_icon.ico' -Algorithm SHA256).Hash
          if ($hash -ne $env:ORVIX_ICON_HASH) { throw 'Orvix icon changed during Flutter runner generation.' }

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app sources
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Build Windows release
        run: flutter build windows --release

      - name: Verify icon stayed byte-identical
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'windows\runner\resources\app_icon.ico' -Algorithm SHA256).Hash
          if ($hash -ne $env:ORVIX_ICON_HASH) { throw 'Orvix icon changed during validation.' }

      - name: Finalize changelog and remove helper
        shell: pwsh
        run: |
          git restore windows
          $existing = Get-Content CHANGELOG.md -Raw
          if ($existing -notmatch '## v0\.5\.7') {
            $rest = $existing -replace '^# Orvix Changelog\r?\n+', ''
            $section = @"
          # Orvix Changelog

          ## v0.5.7 — live IMDb top-rated catalogs

          - Fixed the Home Top Rated Movies and Top Rated TV shelves so they use IMDb's live ranked charts instead of Cinemeta's misleading `imdbRating` catalog order.
          - Reads current IMDb chart order, ratings, vote-backed titles, posters, release years and runtimes from IMDb GraphQL, then enriches each IMDb ID with Cinemeta descriptions, backgrounds, genres and episode metadata.
          - The optional IMDb Top 250 shelves now use the same live chart source instead of HTML scraping, which had become unreliable behind IMDb's web protections.
          - Falls back to the previous Cinemeta catalog if the live IMDb chart endpoint is temporarily unavailable.
          - Preserved the v0.5.6 source count, pinning, Smooth ranking, buffering and manually fixed Windows icon behavior.

          "@
            $section = ($section -split "`r?`n" | ForEach-Object { $_ -replace '^          ', '' }) -join "`n"
            Set-Content CHANGELOG.md -Value ($section + $rest) -Encoding utf8NoBOM
          }
          Remove-Item '.github/workflows/orvix-v057-imdb-once.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/catalog_service.dart CHANGELOG.md .github/workflows/orvix-v057-imdb-once.yml
          if (-not (git diff --cached --quiet)) {
            git commit -m 'feat: finalize live IMDb top-rated catalogs'
            git push origin HEAD:orvix-v0.5.7-imdb-top
          }

      - name: Tag v0.5.7
        shell: pwsh
        run: |
          git fetch origin orvix-v0.5.7-imdb-top
          git checkout orvix-v0.5.7-imdb-top
          if (git ls-remote --exit-code --tags origin refs/tags/v0.5.7) { throw 'v0.5.7 tag already exists.' }
          git tag v0.5.7
          git push origin v0.5.7
