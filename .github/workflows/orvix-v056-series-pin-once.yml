name: Refine Orvix v0.5.6 Series Pin Once

on:
  push:
    branches:
      - orvix-v0.5.6-source-customize
    paths:
      - '.github/workflows/orvix-v056-series-pin-once.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: orvix-v0.5.6-source-customize
          fetch-depth: 0

      - name: Preserve manually fixed Windows icon hash
        shell: pwsh
        run: |
          $icon = 'windows\runner\resources\app_icon.ico'
          $hash = (Get-FileHash $icon -Algorithm SHA256).Hash
          "ORVIX_ICON_HASH=$hash" >> $env:GITHUB_ENV

      - name: Apply series pin refinement
        run: python .github/scripts/patch_v056_series_pin.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app sources
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Build Windows release
        run: flutter build windows --release

      - name: Verify manually fixed icon stayed byte-identical
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'windows\runner\resources\app_icon.ico' -Algorithm SHA256).Hash
          if ($hash -ne $env:ORVIX_ICON_HASH) { throw 'Windows icon changed during source-pin refinement.' }

      - name: Commit validated refinement and remove helpers
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/patch_v056_series_pin.py .github/workflows/orvix-v056-series-pin-once.yml
          git add lib/services/source_provider_service.dart lib/screens/details_screen.dart CHANGELOG.md
          git commit -m "feat: bind pinned TV sources across episodes"
          git push origin HEAD:orvix-v0.5.6-source-customize
