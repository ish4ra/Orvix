name: Diagnose Orvix Android release APKs

on:
  push:
    branches:
      - orvix-v0.7.3-alpha.9-fixes
    paths:
      - '.github/workflows/diagnose-android-apks.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download alpha.7 and alpha.8 mobile APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p apks
          gh release download v0.7.3-alpha.7 --pattern '*Android-Mobile.apk' --dir apks/alpha7
          gh release download v0.7.3-alpha.8 --pattern '*Android-Mobile.apk' --dir apks/alpha8
      - name: Verify APK structure, signatures and package metadata
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f \( -name aapt2 -o -name aapt \) | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          echo "APKSIGNER=$APKSIGNER"
          echo "AAPT=$AAPT"
          echo "ZIPALIGN=$ZIPALIGN"
          for apk in apks/alpha7/*.apk apks/alpha8/*.apk; do
            echo "===== $apk ====="
            sha256sum "$apk"
            unzip -t "$apk" >/dev/null
            "$ZIPALIGN" -c -P 16 -v 4 "$apk" | tail -20
            "$APKSIGNER" verify --verbose --print-certs "$apk"
            "$AAPT" dump badging "$apk" | head -20
          done
