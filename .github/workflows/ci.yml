name: Orvix CI

on:
  push:
    branches:
      - develop
    paths:
      - 'lib/**'
      - 'test/**'
      - 'tools/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'store.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/prerelease.yml'
      - '.coderabbit.yaml'
      - 'AGENTS.md'
      - 'renovate.json'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orvix-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze + regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze Dart
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos
      - name: Run Flutter regression suite
        run: flutter test
      - name: Test standalone media engine
        shell: bash
        run: |
          set -euo pipefail
          cd tools/orvix-media-engine
          go test ./...
      - name: Validate build helper syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile             tools/configure_android_build.py             tools/configure_android_mobile_compat.py             tools/configure_android_mobile_media_kit.py             tools/configure_android_signing.py             tools/generate_desktop_branding.py             tools/configure_ios_build.py             tools/update_altstore_source.py             tools/verify_android_apk.py
          bash -n tools/publish_orvix_release.sh
          bash -n tools/prepare_android_native.sh
          bash -n tools/build_ios_ipa.sh
          bash -n tools/verify_ios_ipa.sh
          bash -n tools/android_install_smoke_test.sh
      - name: Test Android APK installability gate
        run: python3 -m unittest discover -s tools/tests -v
      - name: Guard canonical maintenance rules
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/ci.yml
          test -f .github/workflows/prerelease.yml
          test "$(find .github/workflows -maxdepth 1 -type f -name '*.yml' | wc -l)" -eq 2
          grep -q '^jobs:' .github/workflows/prerelease.yml
          grep -q '^  metadata:' .github/workflows/prerelease.yml
          grep -q '^  validate:' .github/workflows/prerelease.yml
          grep -q '^  release:' .github/workflows/prerelease.yml
          grep -q 'tools/publish_orvix_release.sh' .github/workflows/prerelease.yml
          ! grep --line-number --fixed-strings 'feature/tv-qr-login' .github/workflows/prerelease.yml
          ! grep --line-number --fixed-strings 'IntroDB skip button fix' .github/workflows/prerelease.yml

  windows:
    name: Build Windows
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Build Windows app
        run: flutter build windows --release
      - name: Build media engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location 'tools\orvix-media-engine'
          try {
            go test ./...
            go build -trimpath -ldflags '-s -w' -o '..\..\build\windows\x64\runner\Release\orvix-media-engine.exe' .
          } finally {
            Pop-Location
          }
          if (-not (Test-Path 'build\windows\x64\runner\Release\orvix-media-engine.exe')) {
            throw 'Orvix media engine was not built.'
          }

  android-mobile:
    name: Build Android Mobile
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android --org com.orvix --project-name orvix .
      - name: Prepare Android native dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash tools/prepare_android_native.sh android-native
          mkdir -p android/app/src/main/jniLibs android/app/libs
          cp -R android-native/jniLibs/. android/app/src/main/jniLibs/
          cp android-native/libs/rustls-platform-verifier-0.1.1.aar android/app/libs/

      - name: Configure Android mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          python3 tools/configure_android_build.py
          python3 tools/configure_android_mobile_compat.py
      - name: Get dependencies
        run: flutter pub get
      - name: Enable full Android Mobile libmpv codecs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/configure_android_mobile_media_kit.py
      # Same APK set as prerelease.yml, signed with the debug key because
      # pull requests do not get the release keystore.
      - name: Build Android mobile release APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi \
            --android-project-arg=force-version-code-ignoring-abi=true
      - name: Verify Android mobile APK installability
        shell: bash
        run: |
          set -euo pipefail
          OUT=build/app/outputs/flutter-apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          python3 tools/verify_android_apk.py \
            --build-tools "$(dirname "$APKSIGNER")" \
            --flavor mobile \
            "$OUT/app-release.apk=arm64-v8a,armeabi-v7a,x86_64" \
            "$OUT/app-arm64-v8a-release.apk=arm64-v8a" \
            "$OUT/app-armeabi-v7a-release.apk=armeabi-v7a" \
            "$OUT/app-x86_64-release.apk=x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: android-mobile-ci-apks
          retention-days: 1
          if-no-files-found: error
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk

  android-mobile-install:
    name: Install Android Mobile on emulator
    needs: android-mobile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-mobile-ci-apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Android 11 Google APIs image: a typical phone OS for the supported
      # range, and it can translate arm64-v8a code for the ABI APK install.
      - name: Install APKs with Package Manager
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/android_install_smoke_test.sh apks/app-release.apk apks/app-x86_64-release.apk apks/app-arm64-v8a-release.apk

  android-tv:
    name: Build Android TV
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform
        run: flutter create --platforms=android --org com.orvix --project-name orvix .
      - name: Prepare Android native dependencies
        shell: bash
        run: |
          set -euo pipefail
          bash tools/prepare_android_native.sh android-native
          mkdir -p android/app/src/main/jniLibs android/app/libs
          cp -R android-native/jniLibs/. android/app/src/main/jniLibs/
          cp android-native/libs/rustls-platform-verifier-0.1.1.aar android/app/libs/

      - name: Configure Android TV
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          python3 tools/configure_android_build.py --tv
          python3 tools/configure_android_mobile_compat.py
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' android/app/src/main/AndroidManifest.xml
      - name: Get dependencies
        run: flutter pub get
      - name: Compile Android TV
        run: flutter build apk --debug --dart-define=ORVIX_TV=true
      - name: Verify APK
        shell: bash
        run: test -s build/app/outputs/flutter-apk/app-debug.apk

  macos:
    name: Build macOS
    needs: quality
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate macOS platform
        run: flutter create --platforms=macos --org com.orvix --project-name orvix .
      - name: Get dependencies
        run: flutter pub get
      - name: Build macOS app
        run: flutter build macos --release
      - name: Verify app bundle
        shell: bash
        run: test -d build/macos/Build/Products/Release/Orvix.app

  ios:
    name: Build iOS sideload IPA
    needs: quality
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare iOS build tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/orvix-ios-venv"
          "$RUNNER_TEMP/orvix-ios-venv/bin/python" -m pip install --disable-pip-version-check pillow
          echo "$RUNNER_TEMP/orvix-ios-venv/bin" >> "$GITHUB_PATH"
      - name: Build unsigned iOS IPA
        shell: bash
        run: bash tools/build_ios_ipa.sh
      - name: Verify sideload package
        shell: bash
        run: |
          set -euo pipefail
          PUBSPEC_VERSION="$(awk '$1 == "version:" {print $2}' pubspec.yaml)"
          V="${PUBSPEC_VERSION%%+*}"
          bash tools/verify_ios_ipa.sh "Orvix-v$V-iOS.ipa" "$V" "${PUBSPEC_VERSION#*+}"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ci-ipa
          retention-days: 1
          if-no-files-found: error
          path: Orvix-v*-iOS.ipa
