name: Orvix Android Mobile beta.48 release

on:
  push:
    branches:
      - 'release/mobile-v0.7.9-beta.48'
    paths:
      - 'pubspec.yaml'

permissions:
  contents: write

concurrency:
  group: orvix-mobile-beta48-release
  cancel-in-progress: true

jobs:
  android-mobile:
    name: Build and publish Android Mobile only
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          FULL_VERSION="$(awk '$1 == "version:" {print $2}' pubspec.yaml)"
          VERSION="${FULL_VERSION%%+*}"
          test "$VERSION" = "0.7.9-beta.48"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Run regression tests
        run: flutter test

      - name: Guard mobile subtitle and aspect-ratio contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'libass: PlatformProfile.isAndroidMobile' lib/services/playback_service.dart
          grep -q "assets/fonts/NotoSansSinhala-Regular.ttf" lib/services/playback_service.dart
          grep -q "libassAndroidFontName:" lib/services/playback_service.dart
          grep -q "nativeStyledSubtitles: PlatformProfile.isAndroidMobile" lib/screens/player_screen.dart
          grep -q "width: double.infinity" lib/screens/player_screen.dart
          grep -q "height: double.infinity" lib/screens/player_screen.dart
          grep -q "fallback: PlayerResizeMode.fit" lib/screens/player_screen.dart
          ! grep -q "aspectRatio: PlatformProfile.isAndroidMobile" lib/screens/player_screen.dart
          test -s assets/fonts/NotoSansSinhala-Regular.ttf
          test -s assets/fonts/OFL.txt

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.orvix --project-name orvix .

      - name: Prepare Android native dependencies
        shell: bash
        run: bash tools/prepare_android_native.sh native

      - name: Configure Android mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          mkdir -p android/app/src/main/jniLibs android/app/libs
          cp -R native/jniLibs/. android/app/src/main/jniLibs/
          cp native/libs/rustls-platform-verifier-0.1.1.aar android/app/libs/
          python3 tools/configure_android_build.py
          python3 tools/configure_android_mobile_compat.py
          grep -q 'android:extractNativeLibs="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'useLegacyPackaging = true' android/app/build.gradle.kts
          grep -q 'orvix/torrent_engine' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt

      - name: Configure release signing
        env:
          ORVIX_ANDROID_KEYSTORE_B64: ${{ secrets.ORVIX_ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ORVIX_ANDROID_KEYSTORE_B64:-}"
          printf '%s' "$ORVIX_ANDROID_KEYSTORE_B64" | base64 --decode > android/app/orvix-release.jks
          test -s android/app/orvix-release.jks
          python3 tools/configure_android_signing.py

      - name: Build Android mobile APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Verify signed Android mobile APK and subtitle font
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" > /tmp/orvix-apk-list.txt
          grep -q 'lib/arm64-v8a/libstream_server.so' /tmp/orvix-apk-list.txt
          grep -q 'lib/armeabi-v7a/libstream_server.so' /tmp/orvix-apk-list.txt
          grep -q 'assets/flutter_assets/assets/fonts/NotoSansSinhala-Regular.ttf' /tmp/orvix-apk-list.txt
          grep -q 'assets/flutter_assets/assets/fonts/OFL.txt' /tmp/orvix-apk-list.txt

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          curl --fail --location --retry 4             "https://github.com/ish4ra/Orvix/releases/download/v0.7.9-beta.47/Orvix-v0.7.9-beta.47-Android-Mobile.apk"             -o /tmp/orvix-previous.apk
          "$APKSIGNER" verify --verbose --print-certs /tmp/orvix-previous.apk > /tmp/previous-cert.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" > /tmp/current-cert.txt
          PREVIOUS_CERT="$(grep -m1 'certificate SHA-256 digest:' /tmp/previous-cert.txt | sed 's/.*: //')"
          CURRENT_CERT="$(grep -m1 'certificate SHA-256 digest:' /tmp/current-cert.txt | sed 's/.*: //')"
          test -n "$PREVIOUS_CERT"
          test -n "$CURRENT_CERT"
          test "$PREVIOUS_CERT" = "$CURRENT_CERT"

      - name: Rename APKs
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp build/app/outputs/flutter-apk/app-release.apk "Orvix-v$VERSION-Android-Mobile.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "Orvix-v$VERSION-Android-Mobile-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "Orvix-v$VERSION-Android-Mobile-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "Orvix-v$VERSION-Android-Mobile-x86_64.apk"

      - name: Publish Android Mobile prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          cat > /tmp/release-notes.md <<'EOF'
          Android Mobile only.

          - Embedded subtitles now use Android Mobile's correctly configured native libass renderer.
          - Embedded ASS/SSA source styling, size, positioning and font attachments are preserved where provided by the source.
          - A bundled Noto Sans Sinhala fallback font is included for Android libass initialization and Sinhala coverage.
          - Default video sizing is source-preserving Fit using the video's own display aspect ratio.
          - The player viewport fills the full mobile player surface without overriding the source aspect ratio.
          - The beta.47 resize preference generation is reset so the corrected Fit default is applied once; users can still choose Fit, Fill or Zoom.

          No Windows, macOS, or Android TV packages are published in this release.
          EOF

          gh release create "$TAG"             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "Orvix v$VERSION Android Mobile"             --notes-file /tmp/release-notes.md             --prerelease             "Orvix-v$VERSION-Android-Mobile.apk"             "Orvix-v$VERSION-Android-Mobile-arm64-v8a.apk"             "Orvix-v$VERSION-Android-Mobile-armeabi-v7a.apk"             "Orvix-v$VERSION-Android-Mobile-x86_64.apk"
