name: Reserve Orvix alpha.10 tag

on:
  push:
    branches:
      - orvix-v0.7.3-alpha.10
    paths:
      - '.github/workflows/reserve-alpha10-tag.yml'

permissions:
  contents: write

jobs:
  reserve-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reserve release tag at latest tested source
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.7.3-alpha.10 >/dev/null 2>&1; then
            echo "v0.7.3-alpha.10 already exists; leaving it unchanged."
            exit 0
          fi
          git tag -a v0.7.3-alpha.10 -m "Orvix v0.7.3-alpha.10"
          git push origin refs/tags/v0.7.3-alpha.10
