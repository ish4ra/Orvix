name: Release Orvix v0.7.3-alpha.7 Full Feature Parity

on:
  push:
    branches:
      - orvix-v0.7.3-alpha.7
    paths:
      - '.github/workflows/orvix-v073-alpha7-parity.yml'

permissions:
  contents: write

jobs:
  android-native:
    name: Prepare Android P2P engine
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned native stream-server builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/jniLibs/{armeabi-v7a,arm64-v8a,x86,x86_64} native/libs tmp

          download_extract() {
            abi="$1"
            file="$2"
            sha="$3"
            url="https://github.com/stremio-native/stremio-android/releases/download/v1.2.4/$file"
            curl --fail --location --retry 4 --retry-delay 2 "$url" -o "tmp/$file"
            echo "$sha  tmp/$file" | sha256sum -c -
            unzip -p "tmp/$file" "lib/$abi/libstream_server.so" > "native/jniLibs/$abi/libstream_server.so"
            test -s "native/jniLibs/$abi/libstream_server.so"
          }

          download_extract arm64-v8a \
            StremioMobile-v1.2.4-arm64-v8a-release.apk \
            3ffd96e6c6f0b23845f7ee6ab721d52ba1534055304959ed84c9589aac8bc97e

          download_extract armeabi-v7a \
            StremioMobile-v1.2.4-armeabi-v7a-release.apk \
            519ab54a8a57e93c5a2f2a70cced18673063cffcb88cfdcd0ec6c9a7e5f5570e

          download_extract x86 \
            StremioMobile-v1.2.4-x86-release.apk \
            201012b229914b533665f4c477140f174d7b933fdc27c1fae6a2fb3a1f232058

          download_extract x86_64 \
            StremioMobile-v1.2.4-x86_64-release.apk \
            bee94497864d46a3b7c1905848e161da03179ca4ff85c6808710cdd435cafc94

          curl --fail --location --retry 4 \
            "https://raw.githubusercontent.com/stremio-native/stremio-android/4bdef3b6be1186d9aa22acd8b3ec391c22f0e083/app/libs/rustls-platform-verifier-0.1.1.aar" \
            -o native/libs/rustls-platform-verifier-0.1.1.aar
          test -s native/libs/rustls-platform-verifier-0.1.1.aar

      - name: Inspect native libraries
        shell: bash
        run: |
          set -euo pipefail
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            echo "=== $abi ==="
            file "native/jniLibs/$abi/libstream_server.so"
            readelf -d "native/jniLibs/$abi/libstream_server.so" | grep NEEDED || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android-native-engine
          path: native/
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build transparent Orvix branding
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          python tools/make_logo_mark.py
          @'
          from PIL import Image
          src = Image.open(r"assets/branding/orvix_icon.png").convert("RGBA")
          src.save(
              r"windows/runner/resources/app_icon.ico",
              format="ICO",
              sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)],
          )
          '@ | Set-Content -Encoding UTF8 make_windows_icon.py
          python make_windows_icon.py
          Remove-Item make_windows_icon.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Build Windows
        run: flutter build windows --release

      - name: Bundle local P2P engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = 'build\windows\x64\runner\Release'
          $url = 'https://github.com/stremio-native/stream-server/releases/download/v0.1.8/stream-server-windows-amd64.exe'
          $dest = Join-Path $releaseDir 'orvix-stream-server.exe'
          Invoke-WebRequest -Uri $url -OutFile $dest
          $expected = '90B7A14B282A9E649FBA5ADB6112C2C191DBA884EC762F8650F45CCF06E17E09'
          $actual = (Get-FileHash $dest -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "stream-server checksum mismatch: $actual" }

          $licenseDir = Join-Path $releaseDir 'licenses\stream-server'
          New-Item -ItemType Directory -Force -Path $licenseDir | Out-Null
          Copy-Item 'licenses\stream-server\LICENSE' (Join-Path $licenseDir 'LICENSE.txt')
          Copy-Item 'licenses\stream-server\NOTICE.md' (Join-Path $licenseDir 'NOTICE.md')

      - name: Smoke test Windows P2P engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Resolve-Path 'build\windows\x64\runner\Release\orvix-stream-server.exe'
          $work = Join-Path $env:RUNNER_TEMP 'orvix-stream-server-smoke'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $proc = Start-Process -FilePath $exe -ArgumentList '--no-tray' -WorkingDirectory $work -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $r = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:11470/heartbeat' -TimeoutSec 2
                if ($r.StatusCode -ge 200 -and $r.StatusCode -lt 300) { $ready = $true; break }
              } catch {}
              if ($proc.HasExited) { throw "stream-server exited early with code $($proc.ExitCode)" }
            }
            if (-not $ready) { throw 'stream-server heartbeat did not become ready' }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Pack portable build
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath 'Orvix-v0.7.3-alpha.7-Windows-x64.zip' -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler was not found.' }
          & $iscc '/DMyAppVersion=0.7.3-alpha.7' 'installer\orvix.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Orvix-v0.7.3-alpha.7-Windows-x64.zip
            installer-output/Orvix-Setup-v0.7.3-alpha.7-Windows-x64.exe

  android-mobile:
    runs-on: ubuntu-latest
    needs: android-native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.orvix --project-name orvix .

      - uses: actions/download-artifact@v4
        with:
          name: android-native-engine
          path: android-native

      - name: Configure Android mobile with native P2P
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          python3 tools/make_logo_mark.py

          mkdir -p android/app/src/main/jniLibs android/app/libs
          cp -R android-native/jniLibs/. android/app/src/main/jniLibs/
          cp android-native/libs/rustls-platform-verifier-0.1.1.aar android/app/libs/
          python3 tools/configure_android_build.py

          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -s "android/app/src/main/jniLibs/$abi/libstream_server.so"
          done
          grep -q 'orvix/torrent_engine' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android mobile APK
        run: flutter build apk --release

      - name: Verify P2P engine packaged
        shell: bash
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          unzip -l "$APK" | grep 'lib/arm64-v8a/libstream_server.so'
          unzip -l "$APK" | grep 'lib/armeabi-v7a/libstream_server.so'

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Orvix-v0.7.3-alpha.7-Android-Mobile.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-mobile
          path: Orvix-v0.7.3-alpha.7-Android-Mobile.apk

  android-tv:
    runs-on: ubuntu-latest
    needs: android-native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.orvix --project-name orvix .

      - uses: actions/download-artifact@v4
        with:
          name: android-native-engine
          path: android-native

      - name: Configure Android TV with native P2P
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          python3 tools/make_logo_mark.py

          mkdir -p android/app/src/main/jniLibs android/app/libs
          cp -R android-native/jniLibs/. android/app/src/main/jniLibs/
          cp android-native/libs/rustls-platform-verifier-0.1.1.aar android/app/libs/
          python3 tools/configure_android_build.py --tv

          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -s "android/app/src/main/jniLibs/$abi/libstream_server.so"
          done
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' android/app/src/main/AndroidManifest.xml
          grep -q 'orvix/torrent_engine' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android TV APK
        run: flutter build apk --release

      - name: Verify P2P engine packaged
        shell: bash
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          unzip -l "$APK" | grep 'lib/arm64-v8a/libstream_server.so'
          unzip -l "$APK" | grep 'lib/armeabi-v7a/libstream_server.so'

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Orvix-v0.7.3-alpha.7-Android-TV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-tv
          path: Orvix-v0.7.3-alpha.7-Android-TV.apk

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare transparent Orvix branding
        run: |
          python3 -m venv .logo-venv
          .logo-venv/bin/python -m pip install --disable-pip-version-check pillow
          .logo-venv/bin/python tools/make_logo_mark.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable and generate macOS platform
        run: |
          flutter config --enable-macos-desktop
          flutter create --platforms=macos --org com.orvix --project-name orvix .

      - name: Configure macOS branding and networking
        run: |
          sed -i '' 's/PRODUCT_NAME = orvix/PRODUCT_NAME = Orvix/' macos/Runner/Configs/AppInfo.xcconfig

          ICON_DIR='macos/Runner/Assets.xcassets/AppIcon.appiconset'
          SRC='assets/branding/orvix_icon.png'
          sips -z 16 16 "$SRC" --out "$ICON_DIR/app_icon_16.png" >/dev/null
          sips -z 32 32 "$SRC" --out "$ICON_DIR/app_icon_32.png" >/dev/null
          sips -z 64 64 "$SRC" --out "$ICON_DIR/app_icon_64.png" >/dev/null
          sips -z 128 128 "$SRC" --out "$ICON_DIR/app_icon_128.png" >/dev/null
          sips -z 256 256 "$SRC" --out "$ICON_DIR/app_icon_256.png" >/dev/null
          sips -z 512 512 "$SRC" --out "$ICON_DIR/app_icon_512.png" >/dev/null
          sips -z 1024 1024 "$SRC" --out "$ICON_DIR/app_icon_1024.png" >/dev/null

          for f in macos/Runner/Release.entitlements macos/Runner/DebugProfile.entitlements; do
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.network.client bool true" "$f" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Set :com.apple.security.network.client true" "$f"
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.network.server bool true" "$f" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Set :com.apple.security.network.server true" "$f"
          done

      - name: Build macOS P2P engine
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.1.8 https://github.com/stremio-native/stream-server.git stream-server
          cd stream-server

          # stream-server's server crate depends on enginefs without disabling
          # enginefs' default libtorrent feature. On macOS that unnecessarily
          # pulls libtorrent-sys even when we explicitly build the librqbit
          # backend, and the hosted runner does not ship libtorrent-rasterbar.
          # Keep the build pure-librqbit so Orvix has the same local P2P engine
          # behavior without an unrelated system libtorrent dependency.
          python3 - <<'PY'
          from pathlib import Path

          cargo = Path("server/Cargo.toml")
          text = cargo.read_text()
          old = 'enginefs = { path = "../enginefs" }'
          new = 'enginefs = { path = "../enginefs", default-features = false }'
          if old not in text:
              raise SystemExit("Expected enginefs dependency declaration was not found")
          cargo.write_text(text.replace(old, new, 1))

          # v0.1.8 has one rqbit-only compile typo: EngineCacheConfig is used
          # unqualified while its import is only present on the libtorrent path.
          # Qualify it locally so the pure rqbit backend compiles unchanged.
          enginefs = Path("enginefs/src/lib.rs")
          enginefs_text = enginefs.read_text()
          old_type = '_cache_config: EngineCacheConfig,'
          new_type = '_cache_config: crate::backend::priorities::EngineCacheConfig,'
          if old_type not in enginefs_text:
              raise SystemExit("Expected rqbit EngineCacheConfig signature was not found")
          enginefs.write_text(enginefs_text.replace(old_type, new_type, 1))

          # The v0.1.8 server startup is written against libtorrent-only
          # constructors (new_disk_backed/new_with_storage). For the rqbit
          # feature path use the rqbit constructor that exists on EngineFS.
          server = Path("server/src/lib.rs")
          server_text = server.read_text()
          import re
          pattern = r'    let \\(download_engine, download_engine_disk_backed\\) = match EngineFS::new_disk_backed\\(.*?\\n    \\};\\n'
          new_init = '    let engine_fs = EngineFS::new(\\n        cache_dir.clone(),\\n        backend_config.cache.clone(),\\n    )\\n    .await?;\\n    let download_engine = Arc::new(engine_fs);\\n    let download_engine_disk_backed = false;\\n'
          server_text, replacements = re.subn(pattern, new_init, server_text, count=1, flags=re.S)
          if replacements != 1:
              raise SystemExit("Expected libtorrent startup block was not found")
          server.write_text(server_text)
          PY

          cargo build --release --package server --bin server --no-default-features --features librqbit

      - name: Smoke test macOS P2P engine
        shell: bash
        run: |
          set -euo pipefail
          ENGINE="$PWD/stream-server/target/release/server"
          test -x "$ENGINE"
          WORK="$RUNNER_TEMP/orvix-stream-server-smoke"
          mkdir -p "$WORK"
          (cd "$WORK" && "$ENGINE" --no-tray >server.log 2>&1) &
          PID=$!
          cleanup() { kill "$PID" 2>/dev/null || true; }
          trap cleanup EXIT

          ready=0
          for i in $(seq 1 100); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:11470/heartbeat >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat "$WORK/server.log" || true
              exit 1
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            cat "$WORK/server.log" || true
            exit 1
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Bundle P2P engine and create DMG
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "macOS .app not found" >&2
            exit 1
          fi

          mkdir -p "$APP/Contents/Resources/licenses/stream-server"
          cp stream-server/target/release/server "$APP/Contents/Resources/orvix-stream-server"
          chmod +x "$APP/Contents/Resources/orvix-stream-server"
          cp licenses/stream-server/LICENSE "$APP/Contents/Resources/licenses/stream-server/LICENSE.txt"
          cp licenses/stream-server/NOTICE.md "$APP/Contents/Resources/licenses/stream-server/NOTICE.md"

          codesign --force --deep --sign - "$APP"
          mkdir -p dmg-root
          cp -R "$APP" dmg-root/Orvix.app
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Orvix" -srcfolder dmg-root -ov -format UDZO Orvix-v0.7.3-alpha.7-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Orvix-v0.7.3-alpha.7-macOS.dmg

  release:
    runs-on: ubuntu-latest
    needs: [windows, android-mobile, android-tv, macos]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.7.3-alpha.7 \
            --target '${{ github.sha }}' \
            --title 'Orvix v0.7.3-alpha.7 — Cross-platform P2P Test' \
            --prerelease \
            --notes "Orvix alpha.7 is the cross-platform feature-parity test build.

          - Removes the baked black square/boxed chrome around the Orvix mark in app and launcher branding.
          - Windows keeps the bundled local P2P torrent engine.
          - Android Mobile and Android TV now package the native stream-server engine and start it through an Android JNI bridge.
          - macOS now bundles a native local stream-server and starts it on localhost for the same free P2P playback path.
          - Direct streams, PikPak, TorBox, source ranking, subtitles, AI Sinhala, library, sync and account features continue to use the shared Flutter codebase on every platform.
          - Android TV remains a real-device test build for D-pad/focus behaviour.
          - macOS remains ad-hoc signed/not notarized, so Gatekeeper may require Open Anyway." \
            dist/Orvix-v0.7.3-alpha.7-Windows-x64.zip \
            dist/installer-output/Orvix-Setup-v0.7.3-alpha.7-Windows-x64.exe \
            dist/Orvix-v0.7.3-alpha.7-Android-Mobile.apk \
            dist/Orvix-v0.7.3-alpha.7-Android-TV.apk \
            dist/Orvix-v0.7.3-alpha.7-macOS.dmg
