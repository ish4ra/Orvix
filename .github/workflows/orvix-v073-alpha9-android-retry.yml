name: Retry Orvix v0.7.3-alpha.9 Android + Publish

on:
  push:
    branches:
      - orvix-v0.7.3-alpha.9
    paths:
      - '.github/workflows/orvix-v073-alpha9-android-retry.yml'

permissions:
  contents: write
  actions: read

jobs:
  android-native:
    name: Prepare Android P2P engine
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned native stream-server builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/jniLibs/{armeabi-v7a,arm64-v8a,x86,x86_64} native/libs tmp

          download_extract() {
            abi="$1"
            file="$2"
            sha="$3"
            url="https://github.com/stremio-native/stremio-android/releases/download/v1.2.4/$file"
            curl --fail --location --retry 4 --retry-delay 2 "$url" -o "tmp/$file"
            echo "$sha  tmp/$file" | sha256sum -c -
            unzip -p "tmp/$file" "lib/$abi/libstream_server.so" > "native/jniLibs/$abi/libstream_server.so"
            unzip -p "tmp/$file" "lib/$abi/libc++_shared.so" > "native/jniLibs/$abi/libc++_shared.so"
            test -s "native/jniLibs/$abi/libstream_server.so"
            test -s "native/jniLibs/$abi/libc++_shared.so"
          }

          download_extract arm64-v8a \
            StremioMobile-v1.2.4-arm64-v8a-release.apk \
            3ffd96e6c6f0b23845f7ee6ab721d52ba1534055304959ed84c9589aac8bc97e

          download_extract armeabi-v7a \
            StremioMobile-v1.2.4-armeabi-v7a-release.apk \
            519ab54a8a57e93c5a2f2a70cced18673063cffcb88cfdcd0ec6c9a7e5f5570e

          download_extract x86 \
            StremioMobile-v1.2.4-x86-release.apk \
            201012b229914b533665f4c477140f174d7b933fdc27c1fae6a2fb3a1f232058

          download_extract x86_64 \
            StremioMobile-v1.2.4-x86_64-release.apk \
            bee94497864d46a3b7c1905848e161da03179ca4ff85c6808710cdd435cafc94

          curl --fail --location --retry 4 \
            "https://raw.githubusercontent.com/stremio-native/stremio-android/4bdef3b6be1186d9aa22acd8b3ec391c22f0e083/app/libs/rustls-platform-verifier-0.1.1.aar" \
            -o native/libs/rustls-platform-verifier-0.1.1.aar
          test -s native/libs/rustls-platform-verifier-0.1.1.aar

      - name: Inspect native libraries
        shell: bash
        run: |
          set -euo pipefail
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            echo "=== $abi ==="
            file "native/jniLibs/$abi/libstream_server.so"
            file "native/jniLibs/$abi/libc++_shared.so"
            readelf -d "native/jniLibs/$abi/libstream_server.so" | grep NEEDED
            readelf -d "native/jniLibs/$abi/libstream_server.so" | grep -q 'libc++_shared.so'
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android-native-engine
          path: native/
          if-no-files-found: error

  android-mobile:
    runs-on: ubuntu-latest
    needs: android-native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.orvix --project-name orvix .

      - uses: actions/download-artifact@v4
        with:
          name: android-native-engine
          path: android-native

      - name: Configure Android mobile with native P2P
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow

          mkdir -p android/app/src/main/jniLibs android/app/libs
          cp -R android-native/jniLibs/. android/app/src/main/jniLibs/
          cp android-native/libs/rustls-platform-verifier-0.1.1.aar android/app/libs/
          python3 tools/configure_android_build.py

          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -s "android/app/src/main/jniLibs/$abi/libstream_server.so"
            test -s "android/app/src/main/jniLibs/$abi/libc++_shared.so"
          done
          grep -q 'orvix/torrent_engine' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt

      - name: Restore stable Android signing key
        env:
          ORVIX_ANDROID_KEYSTORE_B64: ${{ secrets.ORVIX_ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ORVIX_ANDROID_KEYSTORE_B64:-}" ]; then
            echo "::error::ORVIX_ANDROID_KEYSTORE_B64 repository secret is missing."
            exit 1
          fi
          printf '%s' "$ORVIX_ANDROID_KEYSTORE_B64" | base64 --decode > android/app/orvix-release.jks
          test -s android/app/orvix-release.jks
          keytool -list -keystore android/app/orvix-release.jks \
            -storepass 'OrvixAlpha-2026-Sign!' -alias orvix >/dev/null
          python3 tools/configure_android_signing.py

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android mobile APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Verify P2P engine packaged
        shell: bash
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          unzip -l "$APK" | grep 'lib/arm64-v8a/libstream_server.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libc++_shared.so'
          unzip -l "$APK" | grep 'lib/armeabi-v7a/libstream_server.so'
          unzip -l "$APK" | grep 'lib/armeabi-v7a/libc++_shared.so'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/orvix-apksigner.txt
          grep -qi 'c86153a3a0d3f49192b37c6574e23c41716c2b9935fdbcf38d6902a3e60fa4ab' /tmp/orvix-apksigner.txt

      - name: Rename APKs
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Orvix-v0.7.3-alpha.9-Android-Mobile.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Orvix-v0.7.3-alpha.9-Android-Mobile-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk Orvix-v0.7.3-alpha.9-Android-Mobile-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk Orvix-v0.7.3-alpha.9-Android-Mobile-x86_64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-mobile
          path: |
            Orvix-v0.7.3-alpha.9-Android-Mobile.apk
            Orvix-v0.7.3-alpha.9-Android-Mobile-arm64-v8a.apk
            Orvix-v0.7.3-alpha.9-Android-Mobile-armeabi-v7a.apk
            Orvix-v0.7.3-alpha.9-Android-Mobile-x86_64.apk

  android-tv:
    runs-on: ubuntu-latest
    needs: android-native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.orvix --project-name orvix .

      - uses: actions/download-artifact@v4
        with:
          name: android-native-engine
          path: android-native

      - name: Configure Android TV with native P2P
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow

          mkdir -p android/app/src/main/jniLibs android/app/libs
          cp -R android-native/jniLibs/. android/app/src/main/jniLibs/
          cp android-native/libs/rustls-platform-verifier-0.1.1.aar android/app/libs/
          python3 tools/configure_android_build.py --tv

          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -s "android/app/src/main/jniLibs/$abi/libstream_server.so"
            test -s "android/app/src/main/jniLibs/$abi/libc++_shared.so"
          done
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' android/app/src/main/AndroidManifest.xml
          grep -q 'orvix/torrent_engine' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt

      - name: Restore stable Android signing key
        env:
          ORVIX_ANDROID_KEYSTORE_B64: ${{ secrets.ORVIX_ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ORVIX_ANDROID_KEYSTORE_B64:-}" ]; then
            echo "::error::ORVIX_ANDROID_KEYSTORE_B64 repository secret is missing."
            exit 1
          fi
          printf '%s' "$ORVIX_ANDROID_KEYSTORE_B64" | base64 --decode > android/app/orvix-release.jks
          test -s android/app/orvix-release.jks
          keytool -list -keystore android/app/orvix-release.jks \
            -storepass 'OrvixAlpha-2026-Sign!' -alias orvix >/dev/null
          python3 tools/configure_android_signing.py

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android TV APK
        run: flutter build apk --release

      - name: Verify P2P engine packaged
        shell: bash
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          unzip -l "$APK" | grep 'lib/arm64-v8a/libstream_server.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libc++_shared.so'
          unzip -l "$APK" | grep 'lib/armeabi-v7a/libstream_server.so'
          unzip -l "$APK" | grep 'lib/armeabi-v7a/libc++_shared.so'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/orvix-apksigner.txt
          grep -qi 'c86153a3a0d3f49192b37c6574e23c41716c2b9935fdbcf38d6902a3e60fa4ab' /tmp/orvix-apksigner.txt

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Orvix-v0.7.3-alpha.9-Android-TV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-tv
          path: Orvix-v0.7.3-alpha.9-Android-TV.apk

  release:
    runs-on: ubuntu-latest
    needs: [android-mobile, android-tv]
    steps:
      - uses: actions/checkout@v4

      - name: Wait for matching Windows and macOS artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_RUN=35314541675
          ready=0
          for i in $(seq 1 120); do
            names="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN}/artifacts" --jq '.artifacts[].name' || true)"
            if printf '%s\n' "$names" | grep -qx 'windows' && printf '%s\n' "$names" | grep -qx 'macos'; then
              ready=1
              break
            fi
            echo "Waiting for Windows/macOS artifacts from run ${SOURCE_RUN} (attempt ${i}/120)..."
            sleep 15
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Timed out waiting for Windows/macOS artifacts from run ${SOURCE_RUN}."
            exit 1
          fi

      - name: Download Windows artifact from platform-fix run
        uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
          github-token: ${{ github.token }}
          run-id: 35314541675

      - name: Download macOS artifact from platform-fix run
        uses: actions/download-artifact@v4
        with:
          name: macos
          path: dist
          github-token: ${{ github.token }}
          run-id: 35314541675

      - name: Download Android mobile artifact
        uses: actions/download-artifact@v4
        with:
          name: android-mobile
          path: dist

      - name: Download Android TV artifact
        uses: actions/download-artifact@v4
        with:
          name: android-tv
          path: dist

      - name: Publish alpha.9 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          find dist -maxdepth 4 -type f -print
          mapfile -t files < <(find dist -type f \( -name 'Orvix-v0.7.3-alpha.9-Windows-x64.zip' -o -name 'Orvix-Setup-v0.7.3-alpha.9-Windows-x64.exe' -o -name 'Orvix-v0.7.3-alpha.9-Android-Mobile*.apk' -o -name 'Orvix-v0.7.3-alpha.9-Android-TV.apk' -o -name 'Orvix-v0.7.3-alpha.9-macOS.dmg' \) -print)
          if [ "${#files[@]}" -lt 5 ]; then
            echo "::error::Expected release assets are missing."
            exit 1
          fi

          notes="$(cat <<'EOF'
Orvix alpha.9 fixes the platform-specific issues found during device testing.

- macOS: fixes PikPak/TorBox secure-storage error -34018 in the ad-hoc DMG build.
- Android: uses one persistent Orvix signing identity with v1+v2 signatures and publishes smaller per-ABI mobile APKs alongside the universal APK.
- Android/TV P2P: packages and explicitly loads libc++_shared.so before libstream_server.so, addressing the JNI controller initialization failure seen during local torrent playback.
- Android TV: launcher label is Orvix, TV artwork is edge-cropped to avoid the double dark frame, and remote-focused buttons get a clear white focus ring.
- Windows: alpha.9 installer version metadata is corrected.
- Retains the alpha.8 playback-start recovery, branding, source, cloud, subtitle, library and account fixes.
- macOS remains ad-hoc signed/not notarized, so Gatekeeper may require Open Anyway.
EOF
)"

          if gh release view v0.7.3-alpha.9 >/dev/null 2>&1; then
            gh release upload v0.7.3-alpha.9 --clobber "${files[@]}"
          else
            gh release create v0.7.3-alpha.9 \
              --target '${{ github.sha }}' \
              --title 'Orvix v0.7.3-alpha.9 — Platform Fixes' \
              --prerelease \
              --notes "$notes" \
              "${files[@]}"
          fi
