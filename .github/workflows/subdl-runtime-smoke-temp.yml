name: Temporary SubDL Runtime Smoke Test

on:
  push:
    branches:
      - orvix-v0.7.4-alpha.23
    paths:
      - '.github/workflows/subdl-runtime-smoke-temp.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Call deployed SubDL Edge Function
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(python3 - <<'PY'
          import re
          text = open("lib/services/subdl_transcript_service.dart", encoding="utf-8").read()
          match = re.search(r"static const _guestFunctionJwt\s*=\s*'([^']+)'", text, re.S)
          if not match:
              raise SystemExit("guest function JWT not found")
          print(match.group(1))
          PY
          )"

          endpoint='https://kpjuisxofwqxhbnnsyzf.supabase.co/functions/v1/subdl-transcript'
          total=0

          check() {
            name="$1"
            payload="$2"
            out="/tmp/subdl-$(echo "$name" | tr ' ' '-' | tr '[:upper:]' '[:lower:]').json"
            status="$(curl --fail-with-body --silent --show-error               --output "$out"               --write-out '%{http_code}'               --request POST               --url "$endpoint"               --header "Authorization: Bearer $TOKEN"               --header "apikey: $TOKEN"               --header 'Content-Type: application/json'               --data "$payload" || true)"

            echo "$name HTTP $status"
            python3 - "$out" "$name" <<'PY'
          import json, sys
          path, name = sys.argv[1], sys.argv[2]
          try:
              data = json.load(open(path, encoding="utf-8"))
          except Exception as exc:
              raise SystemExit(f"{name}: invalid JSON response: {exc}")
          print(json.dumps({
              "status": data.get("status"),
              "error": data.get("error"),
              "candidate_count": len(data.get("candidates") or []),
              "first_labels": [x.get("label") for x in (data.get("candidates") or [])[:3]],
          }, ensure_ascii=False))
          if data.get("error"):
              raise SystemExit(f"{name}: backend error: {data.get('error')} - {data.get('message')}")
          if data.get("status") is not True:
              raise SystemExit(f"{name}: unexpected response: {data}")
          PY

            count="$(python3 - "$out" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          print(len(data.get("candidates") or []))
          PY
          )"
            total=$((total + count))
          }

          check "The Matrix" '{"imdb_id":"tt0133093","type":"movie","year":1999,"file_name":"The.Matrix.1999.1080p.BluRay.x264"}'
          check "Inception" '{"imdb_id":"tt1375666","type":"movie","year":2010,"file_name":"Inception.2010.1080p.BluRay.x264"}'
          check "Breaking Bad S01E01" '{"imdb_id":"tt0903747","type":"tv","season":1,"episode":1,"year":2008,"file_name":"Breaking.Bad.S01E01.1080p.BluRay.x264"}'

          echo "Total candidates across smoke tests: $total"
          if [ "$total" -lt 1 ]; then
            echo "SubDL backend returned zero candidates for all three well-known titles." >&2
            echo "This usually means the server-side key is invalid/rejected or the SubDL API contract has changed." >&2
            exit 1
          fi

          echo "SubDL runtime smoke test passed."
