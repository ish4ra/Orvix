name: Release Orvix v0.7.3-alpha.4 Once

on:
  push:
    branches:
      - orvix-v0.7.3-alpha.4
    paths:
      - '.github/workflows/orvix-v073-alpha4-release-once.yml'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate alpha version
        shell: pwsh
        run: |
          $line = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1
          if (-not $line) { throw 'Version not found in pubspec.yaml' }
          $version = (($line -replace '^version:\s*', '').Split('+')[0]).Trim()
          if ($version -ne '0.7.3-alpha.4') { throw "Expected 0.7.3-alpha.4 but found $version" }

      - name: Verify OpenSubtitles v3 addon
        shell: pwsh
        run: |
          $manifest = Invoke-RestMethod -Uri 'https://opensubtitles-v3.strem.io/manifest.json' -TimeoutSec 20
          if ($manifest.id -ne 'org.stremio.opensubtitlesv3') {
            throw "Unexpected OpenSubtitles addon id: $($manifest.id)"
          }

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preserve pinned Orvix icon hash
        shell: pwsh
        run: |
          $icon = 'windows\runner\resources\app_icon.ico'
          if (-not (Test-Path $icon)) { throw 'Pinned Orvix app icon is missing.' }
          $hash = (Get-FileHash $icon -Algorithm SHA256).Hash
          "ORVIX_ICON_HASH=$hash" >> $env:GITHUB_ENV

      - name: Validate in-app Orvix logo
        shell: pwsh
        run: |
          $logo = 'assets\branding\orvix_icon.png'
          if (-not (Test-Path $logo)) { throw 'In-app Orvix logo is missing.' }
          if ((Get-Item $logo).Length -lt 10000) { throw 'In-app Orvix logo looks unexpectedly small.' }

      - name: Generate Windows runner
        shell: pwsh
        run: flutter create --platforms=windows --project-name orvix .

      - name: Restore exact pinned Orvix icon
        shell: pwsh
        run: |
          git checkout HEAD -- windows/runner/resources/app_icon.ico
          $hash = (Get-FileHash 'windows\runner\resources\app_icon.ico' -Algorithm SHA256).Hash
          if ($hash -ne $env:ORVIX_ICON_HASH) { throw 'Orvix icon changed during Flutter runner generation.' }

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app sources
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Build Windows release
        run: flutter build windows --release

      - name: Bundle pinned local torrent engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = 'build\windows\x64\runner\Release'
          $url = 'https://github.com/stremio-native/stream-server/releases/download/v0.1.8/stream-server-windows-amd64.exe'
          $dest = Join-Path $releaseDir 'orvix-stream-server.exe'
          Invoke-WebRequest -Uri $url -OutFile $dest
          $expected = '90B7A14B282A9E649FBA5ADB6112C2C191DBA884EC762F8650F45CCF06E17E09'
          $actual = (Get-FileHash $dest -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "stream-server checksum mismatch: $actual" }
          $licenseDir = Join-Path $releaseDir 'licenses\stream-server'
          New-Item -ItemType Directory -Force -Path $licenseDir | Out-Null
          Copy-Item 'licenses\stream-server\LICENSE' (Join-Path $licenseDir 'LICENSE.txt')
          Copy-Item 'licenses\stream-server\NOTICE.md' (Join-Path $licenseDir 'NOTICE.md')

      - name: Smoke test bundled torrent engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Resolve-Path 'build\windows\x64\runner\Release\orvix-stream-server.exe'
          $work = Join-Path $env:RUNNER_TEMP 'orvix-stream-server-smoke'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $proc = Start-Process -FilePath $exe -ArgumentList '--no-tray' -WorkingDirectory $work -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $r = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:11470/heartbeat' -TimeoutSec 2
                if ($r.StatusCode -ge 200 -and $r.StatusCode -lt 300) { $ready = $true; break }
              } catch {}
              if ($proc.HasExited) { throw "stream-server exited early with code $($proc.ExitCode)" }
            }
            if (-not $ready) { throw 'stream-server heartbeat did not become ready' }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Pack portable Windows build
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath 'Orvix-v0.7.3-alpha.4-Windows-x64.zip' -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler was not found.' }
          & $iscc '/DMyAppVersion=0.7.3-alpha.4' 'installer\orvix.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Publish GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'v0.7.3-alpha.4'
          $zip = 'Orvix-v0.7.3-alpha.4-Windows-x64.zip'
          $exe = 'installer-output/Orvix-Setup-v0.7.3-alpha.4-Windows-x64.exe'
          $notes = @(
            'Orvix v0.7.3-alpha.4 is the combined test build requested after alpha.1.',
            '',
            '- Includes all alpha.2/alpha.3 fixes: built-in non-debrid local P2P, AI Sinhala playback decoupling, stronger release-aware subtitle matching, extended auto-sync, actionable pinned releases, and playback error handling.',
            '- Debrid/cloud users keep the cloud path for torrent sources; local P2P is used only when no PikPak/TorBox connection is available.',
            '- Adds the official OpenSubtitles v3 addon directly in the player with multi-language browsing and a remembered preferred language.',
            '- Adds subtitle sync controls for embedded, local and OpenSubtitles tracks: earlier/later by 0.5 seconds with reset.',
            '- Adds subtitle appearance controls: font size, background on/off, background opacity, vertical position and reset.',
            '- AI Sinhala remains selectable and no longer overrides a subtitle track the user manually chooses while AI preparation is running.',
            '- Cinemeta v3 remains the built-in metadata fallback behind AIO Metadata.',
            '- Default source stack remains curated: Torrentio-compatible engine plus Comet and MediaFusion, with AIOStreams optional.',
            '- Rebuilds the in-app ORVIX sidebar logo from the exact known-good Windows app icon and displays it larger with a runtime fallback icon.'
          ) -join "`n"
          gh release create $tag --target '${{ github.sha }}' --title 'Orvix v0.7.3-alpha.4' --notes $notes --prerelease $zip $exe

      - name: Clean one-time release workflow from branch
        if: success()
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/orvix-v073-alpha4-release-once.yml
          git commit -m 'chore: clean alpha.4 release workflow'
          git push origin HEAD:orvix-v0.7.3-alpha.4
