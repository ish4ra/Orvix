name: Validate Orvix beta.34 AI audio fallback

on:
  push:
    branches:
      - orvix-v0.7.6-beta.34-ai-audio
    paths:
      - '.github/workflows/orvix-v076-beta34-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: Analyze + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib --no-fatal-warnings --no-fatal-infos
      - run: flutter test

  windows:
    name: Windows release compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
