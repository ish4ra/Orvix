name: Apply Orvix v0.5.3 PikPak Fix Once

on:
  push:
    branches:
      - orvix-v0.5.3-pikpak-magnet-fix
    paths:
      - '.github/workflows/orvix-v053-pikpak-fix-once.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: orvix-v0.5.3-pikpak-magnet-fix
          fetch-depth: 0

      - name: Apply patch
        run: python tools/patch_v053.py

      - name: Remove tracked generated Flutter metadata
        shell: pwsh
        run: git rm -r --cached --ignore-unmatch .dart_tool

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner
        shell: pwsh
        run: flutter create --platforms=windows --project-name orvix .

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Orvix Windows icon
        run: dart run flutter_launcher_icons

      - name: Analyze app sources
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Build Windows release
        run: flutter build windows --release

      - name: Commit validated v0.5.3 fix and remove helpers
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/orvix-v053-pikpak-fix-once.yml
          git rm tools/patch_v053.py
          git add -A
          git commit -m "fix: reliable PikPak magnets and source ordering"
          git push origin HEAD:orvix-v0.5.3-pikpak-magnet-fix
