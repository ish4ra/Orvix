name: Apply Orvix alpha.3 reliability fixes once

on:
  push:
    branches:
      - orvix-v0.7.3-alpha.3
    paths:
      - '.github/workflows/alpha3-reliability-patch-once.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: orvix-v0.7.3-alpha.3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply reliability fixes
        run: python tools/patch_alpha3_reliability.py

      - name: Get dependencies
        run: flutter pub get

      - name: Format changed Dart
        run: dart format lib/app.dart lib/screens/details_screen.dart lib/screens/player_screen.dart lib/services/source_provider_service.dart lib/services/ai_sinhala_preferences_service.dart lib/services/ai_sinhala_subtitle_service.dart

      - name: Analyze app sources
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Build Windows release
        run: flutter build windows --release

      - name: Commit validated source and clean patch helpers
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib pubspec.yaml
          git commit -m 'fix: decouple AI subtitles and make pinned releases actionable' || echo 'No source changes to commit'
          git rm tools/patch_alpha3_reliability.py .github/workflows/alpha3-reliability-patch-once.yml
          git commit -m 'chore: clean alpha.3 one-time patch helpers'
          git push origin HEAD:orvix-v0.7.3-alpha.3
