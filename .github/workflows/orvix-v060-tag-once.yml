name: Tag Orvix v0.6.0 Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/orvix-v060-tag-once.yml'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'supabase/migrations/**'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version and tag v0.6.0
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep '^version:' pubspec.yaml | head -n1 | sed -E 's/^version:[[:space:]]*//' | cut -d'+' -f1)
          if [ "$version" != "0.6.0" ]; then
            echo "Unexpected version: $version"
            exit 1
          fi
          git fetch --tags
          if git rev-parse v0.6.0 >/dev/null 2>&1; then
            echo "v0.6.0 already exists; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag v0.6.0 HEAD
          git push origin v0.6.0
