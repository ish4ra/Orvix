name: Prepare Orvix v0.5.0

on:
  workflow_dispatch:
  push:
    branches:
      - orvix-v0.5.0-dev
    paths:
      - 'tool/orvix_upgrade.part*'
      - '.github/workflows/orvix-v050-dev.yml'

permissions:
  contents: write

concurrency:
  group: orvix-v050-dev
  cancel-in-progress: false

jobs:
  upgrade-validate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and apply upgrade patch
        shell: pwsh
        run: |
          $parts = Get-ChildItem tool/orvix_upgrade.part* | Sort-Object Name
          if (-not $parts) { throw 'Orvix upgrade patch parts were not found.' }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('tool/orvix_upgrade.py.gz', [Convert]::FromBase64String($b64))
          python -c "import gzip,pathlib; p=pathlib.Path('tool/orvix_upgrade.py.gz'); pathlib.Path('tool/orvix_upgrade.py').write_bytes(gzip.decompress(p.read_bytes()))"
          python tool/orvix_upgrade.py

      - name: Keep workflow files unchanged for bot push
        shell: pwsh
        run: |
          Remove-Item tool/orvix_upgrade.part* -Force
          Remove-Item tool/orvix_upgrade.py -Force
          Remove-Item tool/orvix_upgrade.py.gz -Force
          git checkout HEAD -- .github/workflows/build-flutter-windows.yml
          git checkout HEAD -- .github/workflows/orvix-v050-dev.yml

      - name: Commit upgraded source
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: Orvix v0.5 multi-cloud redesign"
          git push origin HEAD:orvix-v0.5.0-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner
        run: flutter create --platforms=windows --project-name orvix .

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Orvix icons
        run: dart run flutter_launcher_icons

      - name: Analyze app sources
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Build Windows release
        run: flutter build windows --release
