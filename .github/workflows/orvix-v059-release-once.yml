name: Build and Publish Orvix v0.5.9 Once

on:
  push:
    branches:
      - orvix-v0.5.9-free-streaming
    paths:
      - '.github/workflows/orvix-v059-release-once.yml'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Free Streaming patch
        shell: pwsh
        run: python tool/v059_patch.py

      - name: Commit patched sources
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Free Streaming source mode"
          git push origin HEAD:orvix-v0.5.9-free-streaming

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $line = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1
          if (-not $line) { throw 'Version not found in pubspec.yaml' }
          $version = (($line -replace '^version:\s*', '').Split('+')[0]).Trim()
          if ($version -ne '0.5.9') { throw "Unexpected version: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preserve pinned Orvix icon hash
        shell: pwsh
        run: |
          $icon = 'windows\runner\resources\app_icon.ico'
          if (-not (Test-Path $icon)) { throw 'Pinned Orvix app icon is missing.' }
          $hash = (Get-FileHash $icon -Algorithm SHA256).Hash
          "ORVIX_ICON_HASH=$hash" >> $env:GITHUB_ENV

      - name: Generate Windows runner
        shell: pwsh
        run: flutter create --platforms=windows --project-name orvix .

      - name: Restore exact pinned Orvix icon
        shell: pwsh
        run: |
          git checkout HEAD -- windows/runner/resources/app_icon.ico
          $hash = (Get-FileHash 'windows\runner\resources\app_icon.ico' -Algorithm SHA256).Hash
          if ($hash -ne $env:ORVIX_ICON_HASH) { throw 'Orvix icon changed during Flutter runner generation.' }

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app sources
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Build Windows release
        run: flutter build windows --release

      - name: Verify icon stayed byte-identical
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'windows\runner\resources\app_icon.ico' -Algorithm SHA256).Hash
          if ($hash -ne $env:ORVIX_ICON_HASH) { throw 'Pinned Orvix icon was modified.' }

      - name: Pack portable Windows build
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "Orvix-v$version-Windows-x64.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler was not found.' }
          & $iscc "/DMyAppVersion=$version" "installer\orvix.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Tag v0.5.9
        shell: pwsh
        run: |
          git fetch --tags
          if (-not (git tag -l 'v0.5.9')) {
            git tag v0.5.9 HEAD
            git push origin v0.5.9
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $zip = "Orvix-v$version-Windows-x64.zip"
          $exe = "installer-output/Orvix-Setup-v$version-Windows-x64.exe"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $exe --clobber
          } else {
            gh release create $tag $zip $exe --target HEAD --title "Orvix $tag" --notes "Moves source result-count control to Settings and adds Free Streaming ranking for non-debrid users, prioritizing healthy seed swarms while preserving quality and resolution." 
          }
