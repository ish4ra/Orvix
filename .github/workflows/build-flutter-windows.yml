name: Build Pikora Flutter Windows

on:
  workflow_dispatch:
  push:
    branches:
      - v0.3-flutter
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'installer/**'
      - 'CHANGELOG.md'
      - '.github/workflows/build-flutter-windows.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $line = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1
          if (-not $line) { throw "Version not found in pubspec.yaml" }
          $version = (($line -replace '^version:\s*', '').Split('+')[0]).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner
        shell: pwsh
        run: flutter create --platforms=windows --project-name pikora .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app sources
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Build Windows release
        run: flutter build windows --release

      - name: Pack portable Windows build
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "Pikora-v$version-Windows-x64.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler was not found." }
          & $iscc "installer\pikora.iss"

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: Pikora-v${{ steps.version.outputs.version }}-Windows-x64
          path: Pikora-v${{ steps.version.outputs.version }}-Windows-x64.zip

      - name: Upload setup exe
        uses: actions/upload-artifact@v4
        with:
          name: Pikora-v${{ steps.version.outputs.version }}-Setup-Windows-x64
          path: installer-output/Pikora-Setup-v${{ steps.version.outputs.version }}-Windows-x64.exe

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $zip = "Pikora-v$version-Windows-x64.zip"
          $exe = "installer-output/Pikora-Setup-v$version-Windows-x64.exe"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $exe --clobber
          } else {
            gh release create $tag $zip $exe `
              --target "${{ github.sha }}" `
              --title "Pikora $tag" `
              --generate-notes
          }
