name: Build Orvix Flutter Windows

on:
  workflow_dispatch:
  push:
    branches:
      - orvix-v0.5.0-dev
      - orvix-v0.6.0-cloud-sync
    tags:
      - 'v*'
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'windows/**'
      - 'pubspec.yaml'
      - 'installer/**'
      - 'CHANGELOG.md'
      - '.github/workflows/build-flutter-windows.yml'

permissions:
  contents: write

concurrency:
  group: orvix-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $line = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1
          if (-not $line) { throw 'Version not found in pubspec.yaml' }
          $version = (($line -replace '^version:\s*', '').Split('+')[0]).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $expected = "v${{ steps.version.outputs.version }}"
          $actual = "${{ github.ref_name }}"
          if ($actual -ne $expected) {
            throw "Release tag $actual does not match pubspec version $expected"
          }

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preserve pinned Orvix icon hash
        shell: pwsh
        run: |
          $icon = 'windows\runner\resources\app_icon.ico'
          if (-not (Test-Path $icon)) { throw 'Pinned Orvix app icon is missing.' }
          $hash = (Get-FileHash $icon -Algorithm SHA256).Hash
          "ORVIX_ICON_HASH=$hash" >> $env:GITHUB_ENV

      - name: Generate Windows runner
        shell: pwsh
        run: flutter create --platforms=windows --project-name orvix .

      - name: Restore exact pinned Orvix icon
        shell: pwsh
        run: |
          git checkout HEAD -- windows/runner/resources/app_icon.ico
          $hash = (Get-FileHash 'windows\runner\resources\app_icon.ico' -Algorithm SHA256).Hash
          if ($hash -ne $env:ORVIX_ICON_HASH) { throw 'Orvix icon changed during Flutter runner generation.' }

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app sources
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Build Windows release
        run: flutter build windows --release

      - name: Pack portable Windows build
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "Orvix-v$version-Windows-x64.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler was not found.' }
          & $iscc "/DMyAppVersion=$version" "installer\orvix.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: Orvix-v${{ steps.version.outputs.version }}-Windows-x64
          path: Orvix-v${{ steps.version.outputs.version }}-Windows-x64.zip

      - name: Upload setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: Orvix-v${{ steps.version.outputs.version }}-Setup-Windows-x64
          path: installer-output/Orvix-Setup-v${{ steps.version.outputs.version }}-Windows-x64.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $zip = "Orvix-v$version-Windows-x64.zip"
          $exe = "installer-output/Orvix-Setup-v$version-Windows-x64.exe"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $exe --clobber
          } else {
            gh release create $tag $zip $exe `
              --target "${{ github.sha }}" `
              --title "Orvix $tag" `
              --generate-notes
          }
