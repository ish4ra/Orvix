name: Build Pikora Flutter Windows

on:
  workflow_dispatch:
  push:
    branches:
      - v0.3-flutter
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - 'installer/**'
      - '.github/workflows/build-flutter-windows.yml'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner
        shell: pwsh
        run: flutter create --platforms=windows --project-name pikora .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app sources
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Build Windows release
        run: flutter build windows --release

      - name: Pack portable Windows build
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath Pikora-v0.3-Windows-x64.zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler was not found." }
          & $iscc "installer\pikora.iss"

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: Pikora-v0.3-Windows-x64
          path: Pikora-v0.3-Windows-x64.zip

      - name: Upload setup exe
        uses: actions/upload-artifact@v4
        with:
          name: Pikora-v0.3-Setup-Windows-x64
          path: installer-output/Pikora-Setup-v0.3.0-Windows-x64.exe
