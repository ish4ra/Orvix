name: Prepare Pikora v0.3.7 Source Browser

on:
  push:
    branches:
      - v0.3.7-source-browser
    paths:
      - '.github/workflows/patch-v037.yml'

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v0.3.7-source-browser

      - name: Patch source browser UI and version
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          # SourceResult: allow the source picker to re-rank the same results
          # instantly without doing another provider request.
          service = Path('lib/services/source_provider_service.dart')
          text = service.read_text(encoding='utf-8')
          start = text.index('  /// Ranking is deliberately lexicographic')
          end = text.index('\n}\n\nclass SourceProviderService', start)
          scoring = r'''  /// Ranking is deliberately lexicographic rather than a vague weighted mix.
          /// Quality mode means exactly: quality > seeders > size.
          int scoreFor(SourceSortMode mode) {
            final seederRank = (seeders ?? -1).clamp(-1, 999999).toInt() + 1;
            final sizeMb = ((sizeBytes ?? 0) ~/ (1024 * 1024))
                .clamp(0, 999999)
                .toInt();

            switch (mode) {
              case SourceSortMode.quality:
                return qualityRank * 1000000000000 +
                    seederRank * 1000000 +
                    sizeMb;
              case SourceSortMode.seeders:
                return seederRank * 1000000000000 +
                    qualityRank * 1000000 +
                    sizeMb;
              case SourceSortMode.fileSize:
                return sizeMb * 1000000000 +
                    qualityRank * 1000000 +
                    seederRank;
            }
          }

          int get preferenceScore => scoreFor(sortMode);
          '''
          service.write_text(text[:start] + scoring + text[end:], encoding='utf-8')

          details = Path('lib/screens/details_screen.dart')
          text = details.read_text(encoding='utf-8')
          start = text.index('  Future<SourceResult?> _chooseSource(')
          end = text.index('  Future<PikPakFile?> _findInPikPak(', start)
          picker = r'''  Future<SourceResult?> _chooseSource(List<SourceResult> results) async {
            var activeSort = await widget.sources.getSortMode();
            if (!mounted) return null;

            return showModalBottomSheet<SourceResult>(
              context: context,
              backgroundColor: const Color(0xFF11141C),
              showDragHandle: true,
              isScrollControlled: true,
              constraints: const BoxConstraints(maxWidth: 920),
              builder: (sheetContext) => StatefulBuilder(
                builder: (context, setSheetState) {
                  final sorted = [...results]
                    ..sort(
                      (a, b) => b.scoreFor(activeSort).compareTo(a.scoreFor(activeSort)),
                    );
                  final best = sorted.isEmpty ? null : sorted.first;
                  final color = Theme.of(context).colorScheme;

                  return SafeArea(
                    child: SizedBox(
                      height: MediaQuery.sizeOf(context).height * .82,
                      child: Padding(
                        padding: const EdgeInsets.fromLTRB(22, 4, 22, 24),
                        child: Column(
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Row(
                              children: [
                                Expanded(
                                  child: Column(
                                    crossAxisAlignment: CrossAxisAlignment.start,
                                    children: [
                                      Text(
                                        'Choose source',
                                        style: Theme.of(context)
                                            .textTheme
                                            .titleLarge
                                            ?.copyWith(fontWeight: FontWeight.w900),
                                      ),
                                      const SizedBox(height: 4),
                                      Text(
                                        '${results.length} result${results.length == 1 ? '' : 's'} returned • showing all',
                                        style: TextStyle(color: color.onSurfaceVariant),
                                      ),
                                    ],
                                  ),
                                ),
                                if (best != null)
                                  FilledButton.icon(
                                    onPressed: () => Navigator.pop(sheetContext, best),
                                    icon: const Icon(Icons.bolt_rounded),
                                    label: Text(
                                      'Quick Play ${best.quality ?? ''}'.trim(),
                                    ),
                                  ),
                              ],
                            ),
                            const SizedBox(height: 15),
                            Row(
                              children: [
                                Text(
                                  'Sort by',
                                  style: TextStyle(
                                    color: color.onSurfaceVariant,
                                    fontWeight: FontWeight.w700,
                                  ),
                                ),
                                const SizedBox(width: 12),
                                Expanded(
                                  child: SegmentedButton<SourceSortMode>(
                                    showSelectedIcon: true,
                                    segments: const [
                                      ButtonSegment(
                                        value: SourceSortMode.quality,
                                        icon: Icon(Icons.high_quality_rounded),
                                        label: Text('Quality'),
                                      ),
                                      ButtonSegment(
                                        value: SourceSortMode.seeders,
                                        icon: Icon(Icons.people_alt_rounded),
                                        label: Text('Seeders'),
                                      ),
                                      ButtonSegment(
                                        value: SourceSortMode.fileSize,
                                        icon: Icon(Icons.storage_rounded),
                                        label: Text('File size'),
                                      ),
                                    ],
                                    selected: {activeSort},
                                    onSelectionChanged: (selection) {
                                      if (selection.isEmpty) return;
                                      final next = selection.first;
                                      setSheetState(() => activeSort = next);
                                      widget.sources.setSortMode(next);
                                    },
                                  ),
                                ),
                              ],
                            ),
                            const SizedBox(height: 10),
                            Text(
                              activeSort == SourceSortMode.quality
                                  ? 'Priority: quality → seeders → file size'
                                  : activeSort == SourceSortMode.seeders
                                      ? 'Priority: seeders → quality → file size'
                                      : 'Priority: file size → quality → seeders',
                              style: TextStyle(
                                color: color.primary,
                                fontSize: 12,
                                fontWeight: FontWeight.w700,
                              ),
                            ),
                            const SizedBox(height: 12),
                            const Divider(height: 1),
                            Expanded(
                              child: ListView.separated(
                                itemCount: sorted.length,
                                separatorBuilder: (_, __) => const Divider(height: 1),
                                itemBuilder: (context, index) {
                                  final result = sorted[index];
                                  return ListTile(
                                    contentPadding: const EdgeInsets.symmetric(
                                      horizontal: 8,
                                      vertical: 7,
                                    ),
                                    leading: CircleAvatar(
                                      radius: 25,
                                      child: Text(
                                        result.quality?.replaceAll('P', '') ?? '—',
                                        style: const TextStyle(
                                          fontSize: 12,
                                          fontWeight: FontWeight.w900,
                                        ),
                                      ),
                                    ),
                                    title: Text(
                                      result.title,
                                      maxLines: 2,
                                      overflow: TextOverflow.ellipsis,
                                      style: const TextStyle(height: 1.38),
                                    ),
                                    subtitle: Padding(
                                      padding: const EdgeInsets.only(top: 4),
                                      child: Text(
                                        '${result.provider}${result.isMagnet ? ' • PikPak cloud source' : ' • direct URL'}',
                                      ),
                                    ),
                                    trailing: index == 0
                                        ? const Chip(label: Text('Best'))
                                        : const Icon(Icons.chevron_right_rounded),
                                    onTap: () => Navigator.pop(sheetContext, result),
                                  );
                                },
                              ),
                            ),
                          ],
                        ),
                      ),
                    ),
                  );
                },
              ),
            );
          }

          '''
          details.write_text(text[:start] + picker + text[end:], encoding='utf-8')

          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text(encoding='utf-8')
          text = text.replace('version: 0.3.6+14', 'version: 0.3.7+15', 1)
          pubspec.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = 'This file tracks user-visible changes to Pikora. GitHub Releases are published automatically for new packaged versions starting with v0.3.2.\n\n'
          section = '''## v0.3.7 — richer source browser & quality-first ranking

          - Source cards now surface parsed seeder counts and file sizes before the release name, so useful availability/size data stays visible even for long titles.
          - Changed the fresh-install/default ranking to strict `quality → seeders → file size` priority.
          - Added live sorting inside the source picker: Quality, Seeders, or File size; the selected mode is remembered for later searches.
          - Removed the source picker's 30-row display cap. Pikora now shows every unique result returned by configured providers.
          - Expanded Torrentio/Stremio metadata parsing for seed-count variants, `GiB/TiB` sizes, comma decimals, behavior hints, and alternate size fields.
          - Keeps identical URLs from different configured providers as separate rows so provider-specific availability metadata is not discarded.

          '''
          if '## v0.3.7 — richer source browser' not in text:
              text = text.replace(marker, marker + section, 1)
          changelog.write_text(text, encoding='utf-8')
          '@ | Set-Content -Encoding UTF8 patch_v037.py
          python patch_v037.py
          Remove-Item patch_v037.py

      - name: Remove temporary workflow from release commit
        shell: pwsh
        run: git rm .github/workflows/patch-v037.yml

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner
        shell: pwsh
        run: flutter create --platforms=windows --project-name pikora .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app sources
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Build Windows release
        run: flutter build windows --release

      - name: Commit validated patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/source_provider_service.dart lib/screens/details_screen.dart pubspec.yaml CHANGELOG.md .github/workflows/patch-v037.yml
          git commit -m "feat: richer source browser and sorting [skip ci]"
          git push origin HEAD:v0.3.7-source-browser
