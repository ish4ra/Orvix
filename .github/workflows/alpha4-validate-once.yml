name: Validate Orvix alpha.4 once

on:
  push:
    branches:
      - orvix-v0.7.3-alpha.4
    paths:
      - '.github/workflows/alpha4-validate-once.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: orvix-v0.7.3-alpha.4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild in-app logo from pinned Windows icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          @'
          from pathlib import Path
          from PIL import Image

          source = Path(r"windows/runner/resources/app_icon.ico")
          target = Path(r"assets/branding/orvix_icon.png")
          icon = Image.open(source)
          sizes = sorted(icon.ico.sizes(), key=lambda s: s[0] * s[1])
          if not sizes:
              raise SystemExit("No icon frames in app_icon.ico")
          image = icon.ico.getimage(sizes[-1]).convert("RGBA")
          bbox = image.getbbox()
          if bbox is None:
              raise SystemExit("Generated Orvix logo is fully transparent")
          if image.width < 64 or image.height < 64:
              raise SystemExit(f"Largest icon frame is unexpectedly small: {image.size}")
          target.parent.mkdir(parents=True, exist_ok=True)
          image.save(target, format="PNG", optimize=True)
          print(f"Generated {target} from {source}: {image.size}, bbox={bbox}")
          '@ | Set-Content -Encoding UTF8 regenerate_orvix_logo.py
          python regenerate_orvix_logo.py
          Remove-Item regenerate_orvix_logo.py

      - name: Verify OpenSubtitles v3 is reachable
        shell: pwsh
        run: |
          $manifest = Invoke-RestMethod -Uri 'https://opensubtitles-v3.strem.io/manifest.json' -TimeoutSec 20
          if ($manifest.id -ne 'org.stremio.opensubtitlesv3') {
            throw "Unexpected OpenSubtitles addon id: $($manifest.id)"
          }
          $sample = Invoke-RestMethod -Uri 'https://opensubtitles-v3.strem.io/subtitles/movie/tt0816692.json' -TimeoutSec 25
          if ($null -eq $sample.subtitles) {
            throw 'OpenSubtitles v3 sample response did not contain subtitles.'
          }

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format alpha.4 Dart changes
        run: dart format lib/app.dart lib/screens/player_screen.dart lib/screens/settings_screen.dart lib/screens/sources_screen.dart lib/services/online_subtitle_service.dart lib/services/subtitle_preferences_service.dart

      - name: Analyze
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build Windows release
        run: flutter build windows --release

      - name: Commit validated formatting and exact in-app logo
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib pubspec.yaml assets/branding/orvix_icon.png
          git commit -m 'fix: validate alpha.4 subtitle stack and restore visible Orvix logo' || echo 'No validation changes to commit'
          git rm .github/workflows/alpha4-validate-once.yml
          git commit -m 'chore: clean alpha.4 validation workflow'
          git push origin HEAD:orvix-v0.7.3-alpha.4
