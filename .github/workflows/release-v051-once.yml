name: Release Orvix v0.5.1 Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v051-once.yml'

permissions:
  contents: write

concurrency:
  group: orvix-v051-release-once
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release version
        shell: pwsh
        run: |
          $line = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1
          if (-not $line) { throw 'Version not found in pubspec.yaml' }
          $version = (($line -replace '^version:\s*', '').Split('+')[0]).Trim()
          if ($version -ne '0.5.1') { throw "Expected version 0.5.1, found $version" }

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner
        shell: pwsh
        run: flutter create --platforms=windows --project-name orvix .

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Orvix Windows icon
        run: dart run flutter_launcher_icons

      - name: Analyze app sources
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Build Windows release
        run: flutter build windows --release

      - name: Pack portable Windows build
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath 'Orvix-v0.5.1-Windows-x64.zip' -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler was not found.' }
          & $iscc '/DMyAppVersion=0.5.1' 'installer\orvix.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Publish v0.5.1 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = 'Orvix-v0.5.1-Windows-x64.zip'
          $exe = 'installer-output/Orvix-Setup-v0.5.1-Windows-x64.exe'
          $notes = @'
          Orvix v0.5.1 fixes the fresh-install Source Engine regression from v0.5.0.

          - Torrentio is configured automatically on fresh installs.
          - Comet and MediaFusion are seeded once as additional removable providers.
          - Existing custom providers and legacy Torrentio settings are preserved.
          - Source Engine branding cleanup and source-priority reset are included.
          '@
          Set-Content -Path release-notes.md -Value $notes

          gh release view v0.5.1 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.5.1 $zip $exe --clobber
          } else {
            gh release create v0.5.1 $zip $exe `
              --target '4591aff699ce476b05564c364fccd0275a3abfaa' `
              --title 'Orvix v0.5.1' `
              --notes-file release-notes.md
          }
