name: Apply Pikora v0.3.4 PikPak FETCH Alignment

on:
  push:
    branches:
      - v0.3-flutter
    paths:
      - '.github/workflows/patch-v034-magic.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply PikPak request patch
        run: python tool/patch_v034_magic.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Pikora Build Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/pikpak_transfer_service.dart pubspec.yaml CHANGELOG.md
          git rm .github/workflows/patch-v034-magic.yml tool/patch_v034_magic.py
          git commit -m "fix: align PikPak file details request with Debrify"
          git push origin HEAD:v0.3-flutter
