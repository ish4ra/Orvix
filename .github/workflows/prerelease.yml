name: Orvix prerelease

on:
  push:
    branches:
      - 'release/android-v0.7.9-beta.69'
    paths:
      - 'pubspec.yaml'
  workflow_dispatch:
permissions:
  contents: write


concurrency:
  group: orvix-prerelease-beta69
  cancel-in-progress: true

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read version from pubspec
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk '$1 == "version:" {print $2}' pubspec.yaml)"
          VERSION="${VERSION%%+*}"
          if [ -z "$VERSION" ]; then
            echo "Could not resolve Orvix version from pubspec.yaml" >&2
            exit 1
          fi
          case "$VERSION" in
            *-*) ;;
            *)
              echo "Prerelease workflow requires a prerelease version, got: $VERSION" >&2
              exit 1
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  validate:
    needs: metadata
    name: Validate Dart + regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Test standalone Orvix media engine
        shell: bash
        run: |
          set -euo pipefail
          cd tools/orvix-media-engine
          go test ./...

      - name: Validate build helper syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/configure_android_build.py \
            tools/configure_android_mobile_compat.py \
            tools/configure_android_mobile_media_kit.py \
            tools/configure_android_signing.py \
            tools/generate_desktop_branding.py \
            tools/configure_ios_build.py \
            tools/update_altstore_source.py \
            tools/verify_android_apk.py
          bash -n tools/publish_orvix_release.sh
          bash -n tools/build_ios_ipa.sh
          bash -n tools/verify_ios_ipa.sh
          bash -n tools/android_install_smoke_test.sh
          python3 -m unittest discover -s tools/tests

      - name: Analyze
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Run complete Flutter test suite
        shell: bash
        run: |
          set -euo pipefail
          flutter test

      - name: Smoke test deployed AI Sinhala backend
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(python3 - <<'PY'
          import re
          text = open("lib/services/ai_sinhala_subtitle_service.dart", encoding="utf-8").read()
          match = re.search(r"static const _guestFunctionJwt\s*=\s*'([^']+)'", text, re.S)
          if not match:
              raise SystemExit("guest function JWT not found")
          print(match.group(1))
          PY
          )"
          ok=0
          for attempt in 1 2 3 4 5; do
            STATUS="$(curl --silent --show-error --max-time 90 \
              --request POST \
              --url 'https://kpjuisxofwqxhbnnsyzf.supabase.co/functions/v1/translate-subtitle-si' \
              --header "Authorization: Bearer $TOKEN" \
              --header "apikey: $TOKEN" \
              --header 'Content-Type: application/json' \
              --data '{"title":"Orvix CI","text":"You are telling me you are just going to walk out of here","context":[]}' \
              --output /tmp/orvix-ai-smoke.json \
              --write-out '%{http_code}' || true)"

            if [ "$STATUS" = "200" ]; then
              if python3 - <<'PY'
          import json, re
          data = json.load(open("/tmp/orvix-ai-smoke.json", encoding="utf-8"))
          text = str(data.get("translation", "")).strip()
          if not re.search(r"[\u0D80-\u0DFF]", text):
              raise SystemExit(f"AI backend did not return Sinhala: {data}")
          PY
              then
                ok=1
                break
              fi
              exit 1
            fi

            if [ -z "$STATUS" ] || [ "$STATUS" = "000" ] || [ "$STATUS" = "429" ] || [ "$STATUS" = "502" ] || [ "$STATUS" = "503" ] || [ "$STATUS" = "504" ]; then
              echo "AI Sinhala smoke got transient HTTP $STATUS on attempt $attempt/5." >&2
              cat /tmp/orvix-ai-smoke.json >&2 || true
              if [ "$attempt" -lt 5 ]; then
                sleep $((attempt * 6))
                continue
              fi
              break
            fi

            echo "AI Sinhala smoke failed with HTTP $STATUS." >&2
            cat /tmp/orvix-ai-smoke.json >&2 || true
            exit 1
          done

          if [ "$ok" -ne 1 ]; then
            echo "::warning::AI Sinhala upstream remained temporarily unavailable after retries; continuing because app/tests passed and Supabase logs confirm Gemini demand/rate-limit errors rather than an Orvix regression."
          fi

      - name: Smoke test 96-cue AI Sinhala batch
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(python3 - <<'PY'
          import re
          text = open("lib/services/ai_sinhala_subtitle_service.dart", encoding="utf-8").read()
          match = re.search(r"static const _guestFunctionJwt\s*=\s*'([^']+)'", text, re.S)
          if not match:
              raise SystemExit("guest function JWT not found")
          print(match.group(1))
          PY
          )"
          python3 - <<'PY' >/tmp/orvix-ai-batch.json
          import json
          segments = [f"Subtitle line {i}: we need to leave this place now." for i in range(1, 97)]
          print(json.dumps({"title": "Orvix CI batch", "segments": segments}))
          PY
          # Large Gemini batches can occasionally hit a temporary 503
          # ("model is currently experiencing high demand"). Keep this as a
          # real release gate, but retry transient upstream availability
          # failures instead of treating one demand spike as a code regression.
          ok=0
          for attempt in 1 2 3 4 5; do
            STATUS="$(curl --silent --show-error --max-time 150 \
              --request POST \
              --url 'https://kpjuisxofwqxhbnnsyzf.supabase.co/functions/v1/translate-subtitle-si' \
              --header "Authorization: Bearer $TOKEN" \
              --header "apikey: $TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary @/tmp/orvix-ai-batch.json \
              --output /tmp/orvix-ai-batch-response.json \
              --write-out '%{http_code}' || true)"

            if [ "$STATUS" = "200" ]; then
              if python3 - <<'PY'
          import json, re
          data = json.load(open("/tmp/orvix-ai-batch-response.json", encoding="utf-8"))
          values = data.get("translations")
          if not isinstance(values, list) or len(values) != 96:
              raise SystemExit(f"Expected 96 translations, got: {data}")
          if not all(re.search(r"[\u0D80-\u0DFF]", str(value)) for value in values):
              raise SystemExit("Batch response contains a non-Sinhala translation.")
          PY
              then
                ok=1
                break
              fi
              echo "96-cue response was HTTP 200 but failed validation." >&2
              cat /tmp/orvix-ai-batch-response.json >&2 || true
              exit 1
            fi

            if [ -z "$STATUS" ] || [ "$STATUS" = "000" ] || [ "$STATUS" = "429" ] || [ "$STATUS" = "502" ] || [ "$STATUS" = "503" ] || [ "$STATUS" = "504" ]; then
              echo "96-cue AI smoke got transient HTTP $STATUS on attempt $attempt/5." >&2
              cat /tmp/orvix-ai-batch-response.json >&2 || true
              if [ "$attempt" -lt 5 ]; then
                sleep $((attempt * 8))
                continue
              fi
              break
            fi

            echo "96-cue AI smoke failed with HTTP $STATUS." >&2
            cat /tmp/orvix-ai-batch-response.json >&2 || true
            exit 1
          done

          if [ "$ok" -ne 1 ]; then
            echo "::warning::96-cue AI Sinhala upstream remained temporarily unavailable after retries; continuing release validation because this is an external Gemini availability condition."
          fi

      - name: Smoke test OpenSubtitles REST backend wiring
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(python3 - <<'PY'
          import re
          text = open("lib/services/ai_sinhala_subtitle_service.dart", encoding="utf-8").read()
          match = re.search(r"static const _guestFunctionJwt\s*=\s*'([^']+)'", text, re.S)
          if not match:
              raise SystemExit("guest function JWT not found")
          print(match.group(1))
          PY
          )"
          STATUS="$(curl --silent --show-error \
            --output /tmp/opensubtitles-smoke.json \
            --write-out '%{http_code}' \
            --request POST \
            --url 'https://kpjuisxofwqxhbnnsyzf.supabase.co/functions/v1/opensubtitles-exact' \
            --header "Authorization: Bearer $TOKEN" \
            --header "apikey: $TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"moviehash":"0000000000000000","moviebytesize":1000000000,"language":"en"}')"
          # 404 means the deliberately fake fingerprint had no exact match.
          # 200 is also acceptable in the extremely unlikely event it matches.
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "404" ]; then
            cat /tmp/opensubtitles-smoke.json
            echo "Unexpected OpenSubtitles backend status: $STATUS" >&2
            exit 1
          fi

  android-native:
    name: Prepare Android P2P engine
    needs: [metadata, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned Android native dependencies
        shell: bash
        run: bash tools/prepare_android_native.sh native
      - uses: actions/upload-artifact@v4
        with:
          name: android-native-engine
          path: native/
          if-no-files-found: error

  android-mobile:
    runs-on: ubuntu-latest
    needs: [metadata, validate, android-native]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.orvix --project-name orvix .

      - uses: actions/download-artifact@v4
        with:
          name: android-native-engine
          path: android-native

      - name: Configure Android mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          mkdir -p android/app/src/main/jniLibs android/app/libs
          cp -R android-native/jniLibs/. android/app/src/main/jniLibs/
          cp android-native/libs/rustls-platform-verifier-0.1.1.aar android/app/libs/
          python3 tools/configure_android_build.py
          python3 tools/configure_android_mobile_compat.py
          grep -q 'android:extractNativeLibs="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'useLegacyPackaging = true' android/app/build.gradle.kts
          grep -q 'orvix/torrent_engine' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt

      - name: Configure release signing
        env:
          ORVIX_ANDROID_KEYSTORE_B64: ${{ secrets.ORVIX_ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ORVIX_ANDROID_KEYSTORE_B64:-}"
          printf '%s' "$ORVIX_ANDROID_KEYSTORE_B64" | base64 --decode > android/app/orvix-release.jks
          test -s android/app/orvix-release.jks
          python3 tools/configure_android_signing.py

      - name: Get dependencies
        run: flutter pub get

      - name: Enable full Android Mobile libmpv codecs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/configure_android_mobile_media_kit.py

      - name: Build Android mobile APKs
        run: |
          flutter build apk --release
          # Keep every ABI APK on the universal APK's versionCode. Flutter's
          # default ABI*1000 offset made installing the universal APK over an
          # ABI APK a downgrade ("package appears to be invalid").
          flutter build apk --release --split-per-abi \
            --android-project-arg=force-version-code-ignoring-abi=true

      - name: Verify Android mobile APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" > /tmp/orvix-apk-list.txt
          grep -q 'lib/arm64-v8a/libstream_server.so' /tmp/orvix-apk-list.txt
          grep -q 'lib/armeabi-v7a/libstream_server.so' /tmp/orvix-apk-list.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          # Regression gate for in-app updates: an APK can be structurally valid
          # yet still be rejected as an update when signed by a different key.
          # Compare the new certificate with the currently published Android APK.
          curl --fail --location --retry 4 \
            "https://github.com/ish4ra/Orvix/releases/download/v0.7.9-beta.11/Orvix-v0.7.9-beta.11-Android-Mobile.apk" \
            -o /tmp/orvix-previous.apk
          "$APKSIGNER" verify --verbose --print-certs /tmp/orvix-previous.apk > /tmp/previous-cert.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" > /tmp/current-cert.txt
          PREVIOUS_CERT="$(grep -m1 'certificate SHA-256 digest:' /tmp/previous-cert.txt | sed 's/.*: //')"
          CURRENT_CERT="$(grep -m1 'certificate SHA-256 digest:' /tmp/current-cert.txt | sed 's/.*: //')"
          test -n "$PREVIOUS_CERT"
          test -n "$CURRENT_CERT"
          if [ "$PREVIOUS_CERT" != "$CURRENT_CERT" ]; then
            echo "Android update signing certificate changed: $PREVIOUS_CERT -> $CURRENT_CERT" >&2
            exit 1
          fi

      - name: Rename APKs
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Orvix-v${{ needs.metadata.outputs.version }}-Android-Mobile.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Orvix-v${{ needs.metadata.outputs.version }}-Android-Mobile-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk Orvix-v${{ needs.metadata.outputs.version }}-Android-Mobile-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk Orvix-v${{ needs.metadata.outputs.version }}-Android-Mobile-x86_64.apk

      - name: Verify Android mobile APK installability
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          PREVIOUS_CERT="$(grep -m1 'certificate SHA-256 digest:' /tmp/previous-cert.txt | sed 's/.*: //')"
          test -n "$PREVIOUS_CERT"
          V="${{ needs.metadata.outputs.version }}"
          # Checks the exact files that are published: signature and Orvix
          # certificate, zip alignment, manifest, ABIs, native libraries, and
          # that all four APKs share one versionCode above the old ABI APKs.
          python3 tools/verify_android_apk.py \
            --build-tools "$(dirname "$APKSIGNER")" \
            --flavor mobile \
            --expected-cert-sha256 "$PREVIOUS_CERT" \
            --above-legacy-split-version-codes \
            "Orvix-v$V-Android-Mobile.apk=arm64-v8a,armeabi-v7a,x86_64" \
            "Orvix-v$V-Android-Mobile-arm64-v8a.apk=arm64-v8a" \
            "Orvix-v$V-Android-Mobile-armeabi-v7a.apk=armeabi-v7a" \
            "Orvix-v$V-Android-Mobile-x86_64.apk=x86_64"

      - name: Export Android mobile branding previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p branding-preview-android-mobile
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png branding-preview-android-mobile/launcher-192.png
          cp android/app/src/main/res/drawable-nodpi/orvix_foreground.png branding-preview-android-mobile/adaptive-foreground.png
          cp assets/branding/orvix_logo.webp branding-preview-android-mobile/in-app-logo.webp

      - uses: actions/upload-artifact@v4
        with:
          name: branding-preview-android-mobile
          if-no-files-found: error
          path: branding-preview-android-mobile/*

      - uses: actions/upload-artifact@v4
        with:
          name: android-mobile
          path: |
            Orvix-v${{ needs.metadata.outputs.version }}-Android-Mobile.apk
            Orvix-v${{ needs.metadata.outputs.version }}-Android-Mobile-arm64-v8a.apk
            Orvix-v${{ needs.metadata.outputs.version }}-Android-Mobile-armeabi-v7a.apk
            Orvix-v${{ needs.metadata.outputs.version }}-Android-Mobile-x86_64.apk

  android-tv:
    runs-on: ubuntu-latest
    needs: [metadata, validate, android-native]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.orvix --project-name orvix .

      - uses: actions/download-artifact@v4
        with:
          name: android-native-engine
          path: android-native

      - name: Configure Android TV
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          mkdir -p android/app/src/main/jniLibs android/app/libs
          cp -R android-native/jniLibs/. android/app/src/main/jniLibs/
          cp android-native/libs/rustls-platform-verifier-0.1.1.aar android/app/libs/
          python3 tools/configure_android_build.py --tv
          python3 tools/configure_android_mobile_compat.py
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' android/app/src/main/AndroidManifest.xml
          grep -q 'android:screenOrientation="landscape"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:extractNativeLibs="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'orvix/torrent_engine' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt
          grep -q 'JniStreamingServerController.start' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt
          test ! -f android/app/src/main/kotlin/com/orvix/orvix/TorrentEngineService.kt
          if grep -q 'orvix/tv_native_player' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt; then
            echo 'Experimental native TV player bridge is still present.' >&2
            exit 1
          fi
          test ! -f android/app/src/main/kotlin/com/orvix/orvix/TvNativePlayerActivity.kt

      - name: Verify Android TV banner
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/src/main/res/drawable-xhdpi/tv_banner.png
          python3 - <<'PY'
          from PIL import Image
          image = Image.open("android/app/src/main/res/drawable-xhdpi/tv_banner.png")
          if image.size != (320, 180):
              raise SystemExit(f"Wrong TV banner size: {image.size}")
          PY

      - name: Configure release signing
        env:
          ORVIX_ANDROID_KEYSTORE_B64: ${{ secrets.ORVIX_ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ORVIX_ANDROID_KEYSTORE_B64:-}"
          printf '%s' "$ORVIX_ANDROID_KEYSTORE_B64" | base64 --decode > android/app/orvix-release.jks
          test -s android/app/orvix-release.jks
          python3 tools/configure_android_signing.py

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android TV APK
        run: flutter build apk --release --dart-define=ORVIX_TV=true

      - name: Verify Android TV APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" > /tmp/orvix-apk-list.txt
          grep -q 'lib/arm64-v8a/libstream_server.so' /tmp/orvix-apk-list.txt
          grep -q 'lib/armeabi-v7a/libstream_server.so' /tmp/orvix-apk-list.txt
          grep -q 'lib/arm64-v8a/libc++_shared.so' /tmp/orvix-apk-list.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Orvix-v${{ needs.metadata.outputs.version }}-Android-TV.apk

      - name: Export Android TV branding previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p branding-preview-android-tv
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png branding-preview-android-tv/launcher-192.png
          cp android/app/src/main/res/drawable-xhdpi/tv_banner.png branding-preview-android-tv/tv-banner.png
          cp assets/branding/orvix_logo.webp branding-preview-android-tv/in-app-logo.webp

      - uses: actions/upload-artifact@v4
        with:
          name: branding-preview-android-tv
          if-no-files-found: error
          path: branding-preview-android-tv/*

      - uses: actions/upload-artifact@v4
        with:
          name: android-tv
          path: Orvix-v${{ needs.metadata.outputs.version }}-Android-TV.apk

  release:
    name: Publish Android-only prerelease
    needs: [metadata, validate, android-mobile, android-tv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-mobile
          path: dist/mobile
      - uses: actions/download-artifact@v4
        with:
          name: android-tv
          path: dist/tv
      - name: Verify Android assets
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/mobile/Orvix-v${{ needs.metadata.outputs.version }}-Android-Mobile.apk
          test -s dist/mobile/Orvix-v${{ needs.metadata.outputs.version }}-Android-Mobile-arm64-v8a.apk
          test -s dist/mobile/Orvix-v${{ needs.metadata.outputs.version }}-Android-Mobile-armeabi-v7a.apk
          test -s dist/mobile/Orvix-v${{ needs.metadata.outputs.version }}-Android-Mobile-x86_64.apk
          test -s dist/tv/Orvix-v${{ needs.metadata.outputs.version }}-Android-TV.apk
      - name: Publish Android prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          ORVIX_RELEASE_PRERELEASE: 'true'
        shell: bash
        run: |
          set -euo pipefail
          V="${{ needs.metadata.outputs.version }}"
          {
            if [ -f "docs/release-notes/v$V.md" ]; then
              cat "docs/release-notes/v$V.md"
              echo
            fi
            echo "### Android downloads"
            echo
            echo "- **Android phones and tablets:** Orvix-v$V-Android-Mobile.apk (universal)."
            echo "- **Android TV:** Orvix-v$V-Android-TV.apk."
            echo "- Smaller arm64-v8a / armeabi-v7a / x86_64 Mobile APKs are also supplied."
            echo
            echo "This release only updates Android Mobile and Android TV."
          } > /tmp/notes.md
          chmod +x tools/publish_orvix_release.sh
          tools/publish_orvix_release.sh \
            v${{ needs.metadata.outputs.version }} \
            "Orvix v${{ needs.metadata.outputs.version }}" \
            /tmp/notes.md \
            "${{ github.sha }}" \
            dist/mobile/Orvix-v${{ needs.metadata.outputs.version }}-Android-Mobile.apk \
            dist/mobile/Orvix-v${{ needs.metadata.outputs.version }}-Android-Mobile-arm64-v8a.apk \
            dist/mobile/Orvix-v${{ needs.metadata.outputs.version }}-Android-Mobile-armeabi-v7a.apk \
            dist/mobile/Orvix-v${{ needs.metadata.outputs.version }}-Android-Mobile-x86_64.apk \
            dist/tv/Orvix-v${{ needs.metadata.outputs.version }}-Android-TV.apk
