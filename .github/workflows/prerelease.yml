name: Orvix Android Mobile test APK

# Throwaway test-build branch only. Never merged. Builds the release-signed
# Android Mobile APKs of the Free P2P recovery fix as a workflow artifact for
# real-device testing. It has no release or publish job and a read-only
# token, so it cannot create a GitHub release.
on:
  push:
    branches:
      - 'test/free-p2p-recovery-apk'

permissions:
  contents: read

concurrency:
  group: orvix-free-p2p-recovery-test-apk
  cancel-in-progress: true

env:
  TEST_BUILD_NAME: '0.7.9-beta.66'
  TEST_BUILD_NUMBER: '4212'
  TEST_LABEL: '0.7.9-beta.66-p2p-recovery-test.1'

jobs:
  android-native:
    name: Prepare Android P2P engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned Android native dependencies
        shell: bash
        run: bash tools/prepare_android_native.sh native
      - uses: actions/upload-artifact@v4
        with:
          name: android-native-engine
          path: native/
          if-no-files-found: error


  android-mobile:
    runs-on: ubuntu-latest
    needs: [android-native]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.orvix --project-name orvix .

      - uses: actions/download-artifact@v4
        with:
          name: android-native-engine
          path: android-native

      - name: Configure Android mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          mkdir -p android/app/src/main/jniLibs android/app/libs
          cp -R android-native/jniLibs/. android/app/src/main/jniLibs/
          cp android-native/libs/rustls-platform-verifier-0.1.1.aar android/app/libs/
          python3 tools/configure_android_build.py
          python3 tools/configure_android_mobile_compat.py
          grep -q 'android:extractNativeLibs="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'useLegacyPackaging = true' android/app/build.gradle.kts
          grep -q 'orvix/torrent_engine' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt

      - name: Configure release signing
        env:
          ORVIX_ANDROID_KEYSTORE_B64: ${{ secrets.ORVIX_ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ORVIX_ANDROID_KEYSTORE_B64:-}"
          printf '%s' "$ORVIX_ANDROID_KEYSTORE_B64" | base64 --decode > android/app/orvix-release.jks
          test -s android/app/orvix-release.jks
          python3 tools/configure_android_signing.py

      - name: Get dependencies
        run: flutter pub get

      - name: Enable full Android Mobile libmpv codecs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/configure_android_mobile_media_kit.py

      - name: Build Android mobile APKs
        run: |
          # Test build: keeps the beta.66 version name (the in-app updater still
          # offers beta.67) with a versionCode above beta.66 (4211) so it
          # installs over the published release.
          flutter build apk --release \
            --build-name="$TEST_BUILD_NAME" --build-number="$TEST_BUILD_NUMBER"
          # Keep every ABI APK on the universal APK's versionCode. Flutter's
          # default ABI*1000 offset made installing the universal APK over an
          # ABI APK a downgrade ("package appears to be invalid").
          flutter build apk --release --split-per-abi \
            --build-name="$TEST_BUILD_NAME" --build-number="$TEST_BUILD_NUMBER" \
            --android-project-arg=force-version-code-ignoring-abi=true

      - name: Verify Android mobile APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" > /tmp/orvix-apk-list.txt
          grep -q 'lib/arm64-v8a/libstream_server.so' /tmp/orvix-apk-list.txt
          grep -q 'lib/armeabi-v7a/libstream_server.so' /tmp/orvix-apk-list.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          # Regression gate for in-app updates: an APK can be structurally valid
          # yet still be rejected as an update when signed by a different key.
          # Compare the new certificate with the currently published Android APK.
          curl --fail --location --retry 4 \
            "https://github.com/ish4ra/Orvix/releases/download/v0.7.9-beta.11/Orvix-v0.7.9-beta.11-Android-Mobile.apk" \
            -o /tmp/orvix-previous.apk
          "$APKSIGNER" verify --verbose --print-certs /tmp/orvix-previous.apk > /tmp/previous-cert.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" > /tmp/current-cert.txt
          PREVIOUS_CERT="$(grep -m1 'certificate SHA-256 digest:' /tmp/previous-cert.txt | sed 's/.*: //')"
          CURRENT_CERT="$(grep -m1 'certificate SHA-256 digest:' /tmp/current-cert.txt | sed 's/.*: //')"
          test -n "$PREVIOUS_CERT"
          test -n "$CURRENT_CERT"
          if [ "$PREVIOUS_CERT" != "$CURRENT_CERT" ]; then
            echo "Android update signing certificate changed: $PREVIOUS_CERT -> $CURRENT_CERT" >&2
            exit 1
          fi

      - name: Rename APKs
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Orvix-v${{ env.TEST_LABEL }}-Android-Mobile.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Orvix-v${{ env.TEST_LABEL }}-Android-Mobile-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk Orvix-v${{ env.TEST_LABEL }}-Android-Mobile-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk Orvix-v${{ env.TEST_LABEL }}-Android-Mobile-x86_64.apk

      - name: Verify Android mobile APK installability
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          PREVIOUS_CERT="$(grep -m1 'certificate SHA-256 digest:' /tmp/previous-cert.txt | sed 's/.*: //')"
          test -n "$PREVIOUS_CERT"
          V="${{ env.TEST_LABEL }}"
          # Checks the exact files that are published: signature and Orvix
          # certificate, zip alignment, manifest, ABIs, native libraries, and
          # that all four APKs share one versionCode above the old ABI APKs.
          python3 tools/verify_android_apk.py \
            --build-tools "$(dirname "$APKSIGNER")" \
            --flavor mobile \
            --expected-cert-sha256 "$PREVIOUS_CERT" \
            --above-legacy-split-version-codes \
            "Orvix-v$V-Android-Mobile.apk=arm64-v8a,armeabi-v7a,x86_64" \
            "Orvix-v$V-Android-Mobile-arm64-v8a.apk=arm64-v8a" \
            "Orvix-v$V-Android-Mobile-armeabi-v7a.apk=armeabi-v7a" \
            "Orvix-v$V-Android-Mobile-x86_64.apk=x86_64"

      - name: Verify Android Mobile APKs update the latest published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          V="${{ env.TEST_LABEL }}"
          # Android accepts an update only from the same package and signer
          # with a strictly higher versionCode. Compare every new Mobile APK
          # with the universal APK of the newest published release, which is
          # what the in-app updater installs on phones.
          PREVIOUS_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            --jq '[.[] | select(.draft == false) | select(any(.assets[]; .name | endswith("-Android-Mobile.apk")))][0].tag_name // empty')"
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No published Android Mobile APK found to compare against." >&2
            exit 1
          fi
          if [ "$PREVIOUS_TAG" = "v$V" ]; then
            echo "v$V is already published." >&2
            exit 1
          fi
          gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "Orvix-$PREVIOUS_TAG-Android-Mobile.apk" \
            --output /tmp/orvix-published-android-mobile.apk
          python3 tools/check_android_update_path.py \
            --build-tools "$(dirname "$APKSIGNER")" \
            --previous /tmp/orvix-published-android-mobile.apk \
            "Orvix-v$V-Android-Mobile.apk" \
            "Orvix-v$V-Android-Mobile-arm64-v8a.apk" \
            "Orvix-v$V-Android-Mobile-armeabi-v7a.apk" \
            "Orvix-v$V-Android-Mobile-x86_64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-mobile-test-apk
          retention-days: 14
          if-no-files-found: error
          path: |
            Orvix-v${{ env.TEST_LABEL }}-Android-Mobile.apk
            Orvix-v${{ env.TEST_LABEL }}-Android-Mobile-arm64-v8a.apk
            Orvix-v${{ env.TEST_LABEL }}-Android-Mobile-armeabi-v7a.apk
            Orvix-v${{ env.TEST_LABEL }}-Android-Mobile-x86_64.apk
