name: Orvix prerelease

on:
  push:
    branches:
      - 'release/android-v0.7.9-beta.70'
    paths:
      - 'pubspec.yaml'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build and publish (auto = android on a release/android-v* branch, otherwise all; android = Android Mobile + Android TV only)'
        type: choice
        options:
          - auto
          - all
          - android
        default: auto
permissions:
  contents: write


concurrency:
  group: orvix-prerelease-beta70
  cancel-in-progress: true

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      platforms: ${{ steps.platforms.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4
      - id: platforms
        name: Resolve release platforms
        # A release/android-v* branch, or a manual run with platforms=android,
        # builds and publishes only the Android Mobile and Android TV APKs.
        # Every other trigger keeps the full multi-platform release.
        shell: bash
        env:
          REQUESTED_PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          PLATFORMS="${REQUESTED_PLATFORMS:-auto}"
          if [ "$PLATFORMS" = auto ]; then
            case "$GITHUB_REF_NAME" in
              release/android-v*) PLATFORMS=android ;;
              *) PLATFORMS=all ;;
            esac
          fi
          case "$GITHUB_REF_NAME:$PLATFORMS" in
            release/android-v*:all)
              echo "An Android release branch cannot publish every platform." >&2
              exit 1
              ;;
          esac
          case "$PLATFORMS" in
            all|android) ;;
            *)
              echo "Unknown release platforms: $PLATFORMS" >&2
              exit 1
              ;;
          esac
          echo "Release platforms: $PLATFORMS"
          echo "platforms=$PLATFORMS" >> "$GITHUB_OUTPUT"
      - id: version
        name: Read version from pubspec
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk '$1 == "version:" {print $2}' pubspec.yaml)"
          VERSION="${VERSION%%+*}"
          if [ -z "$VERSION" ]; then
            echo "Could not resolve Orvix version from pubspec.yaml" >&2
            exit 1
          fi
          case "$VERSION" in
            *-*) ;;
            *)
              echo "Prerelease workflow requires a prerelease version, got: $VERSION" >&2
              exit 1
              ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  validate:
    needs: metadata
    name: Validate Dart + regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Test standalone Orvix media engine
        shell: bash
        run: |
          set -euo pipefail
          cd tools/orvix-media-engine
          go test ./...

      - name: Validate build helper syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            tools/configure_android_build.py \
            tools/configure_android_mobile_compat.py \
            tools/configure_android_mobile_media_kit.py \
            tools/configure_android_signing.py \
            tools/generate_desktop_branding.py \
            tools/configure_ios_build.py \
            tools/ios_ipa_checks.py \
            tools/ios_macho.py \
            tools/ios_profiles.py \
            tools/ios_signing.py \
            tools/update_altstore_source.py \
            tools/verify_android_apk.py \
            tools/check_android_update_path.py
          bash -n tools/publish_orvix_release.sh
          bash -n tools/ios_ipa_common.sh
          bash -n tools/build_ios_ipa.sh
          bash -n tools/build_ios_legacy_ipa.sh
          bash -n tools/verify_ios_ipa.sh
          bash -n tools/verify_ios_legacy_ipa.sh
          bash -n tools/android_install_smoke_test.sh
          python3 -m unittest discover -s tools/tests

      - name: Analyze
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Run complete Flutter test suite
        shell: bash
        run: |
          set -euo pipefail
          flutter test

      - name: Smoke test deployed AI Sinhala backend
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(python3 - <<'PY'
          import re
          text = open("lib/services/ai_sinhala_subtitle_service.dart", encoding="utf-8").read()
          match = re.search(r"static const _guestFunctionJwt\s*=\s*'([^']+)'", text, re.S)
          if not match:
              raise SystemExit("guest function JWT not found")
          print(match.group(1))
          PY
          )"
          ok=0
          for attempt in 1 2 3 4 5; do
            STATUS="$(curl --silent --show-error --max-time 90 \
              --request POST \
              --url 'https://kpjuisxofwqxhbnnsyzf.supabase.co/functions/v1/translate-subtitle-si' \
              --header "Authorization: Bearer $TOKEN" \
              --header "apikey: $TOKEN" \
              --header 'Content-Type: application/json' \
              --data '{"title":"Orvix CI","text":"You are telling me you are just going to walk out of here","context":[]}' \
              --output /tmp/orvix-ai-smoke.json \
              --write-out '%{http_code}' || true)"

            if [ "$STATUS" = "200" ]; then
              if python3 - <<'PY'
          import json, re
          data = json.load(open("/tmp/orvix-ai-smoke.json", encoding="utf-8"))
          text = str(data.get("translation", "")).strip()
          if not re.search(r"[\u0D80-\u0DFF]", text):
              raise SystemExit(f"AI backend did not return Sinhala: {data}")
          PY
              then
                ok=1
                break
              fi
              exit 1
            fi

            if [ -z "$STATUS" ] || [ "$STATUS" = "000" ] || [ "$STATUS" = "429" ] || [ "$STATUS" = "502" ] || [ "$STATUS" = "503" ] || [ "$STATUS" = "504" ]; then
              echo "AI Sinhala smoke got transient HTTP $STATUS on attempt $attempt/5." >&2
              cat /tmp/orvix-ai-smoke.json >&2 || true
              if [ "$attempt" -lt 5 ]; then
                sleep $((attempt * 6))
                continue
              fi
              break
            fi

            echo "AI Sinhala smoke failed with HTTP $STATUS." >&2
            cat /tmp/orvix-ai-smoke.json >&2 || true
            exit 1
          done

          if [ "$ok" -ne 1 ]; then
            echo "::warning::AI Sinhala upstream remained temporarily unavailable after retries; continuing because app/tests passed and Supabase logs confirm Gemini demand/rate-limit errors rather than an Orvix regression."
          fi

      - name: Smoke test 96-cue AI Sinhala batch
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(python3 - <<'PY'
          import re
          text = open("lib/services/ai_sinhala_subtitle_service.dart", encoding="utf-8").read()
          match = re.search(r"static const _guestFunctionJwt\s*=\s*'([^']+)'", text, re.S)
          if not match:
              raise SystemExit("guest function JWT not found")
          print(match.group(1))
          PY
          )"
          python3 - <<'PY' >/tmp/orvix-ai-batch.json
          import json
          segments = [f"Subtitle line {i}: we need to leave this place now." for i in range(1, 97)]
          print(json.dumps({"title": "Orvix CI batch", "segments": segments}))
          PY
          # Large Gemini batches can occasionally hit a temporary 503
          # ("model is currently experiencing high demand"). Keep this as a
          # real release gate, but retry transient upstream availability
          # failures instead of treating one demand spike as a code regression.
          ok=0
          for attempt in 1 2 3 4 5; do
            STATUS="$(curl --silent --show-error --max-time 150 \
              --request POST \
              --url 'https://kpjuisxofwqxhbnnsyzf.supabase.co/functions/v1/translate-subtitle-si' \
              --header "Authorization: Bearer $TOKEN" \
              --header "apikey: $TOKEN" \
              --header 'Content-Type: application/json' \
              --data-binary @/tmp/orvix-ai-batch.json \
              --output /tmp/orvix-ai-batch-response.json \
              --write-out '%{http_code}' || true)"

            if [ "$STATUS" = "200" ]; then
              if python3 - <<'PY'
          import json, re
          data = json.load(open("/tmp/orvix-ai-batch-response.json", encoding="utf-8"))
          values = data.get("translations")
          if not isinstance(values, list) or len(values) != 96:
              raise SystemExit(f"Expected 96 translations, got: {data}")
          if not all(re.search(r"[\u0D80-\u0DFF]", str(value)) for value in values):
              raise SystemExit("Batch response contains a non-Sinhala translation.")
          PY
              then
                ok=1
                break
              fi
              echo "96-cue response was HTTP 200 but failed validation." >&2
              cat /tmp/orvix-ai-batch-response.json >&2 || true
              exit 1
            fi

            if [ -z "$STATUS" ] || [ "$STATUS" = "000" ] || [ "$STATUS" = "429" ] || [ "$STATUS" = "502" ] || [ "$STATUS" = "503" ] || [ "$STATUS" = "504" ]; then
              echo "96-cue AI smoke got transient HTTP $STATUS on attempt $attempt/5." >&2
              cat /tmp/orvix-ai-batch-response.json >&2 || true
              if [ "$attempt" -lt 5 ]; then
                sleep $((attempt * 8))
                continue
              fi
              break
            fi

            echo "96-cue AI smoke failed with HTTP $STATUS." >&2
            cat /tmp/orvix-ai-batch-response.json >&2 || true
            exit 1
          done

          if [ "$ok" -ne 1 ]; then
            echo "::warning::96-cue AI Sinhala upstream remained temporarily unavailable after retries; continuing release validation because this is an external Gemini availability condition."
          fi

      - name: Smoke test OpenSubtitles REST backend wiring
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(python3 - <<'PY'
          import re
          text = open("lib/services/ai_sinhala_subtitle_service.dart", encoding="utf-8").read()
          match = re.search(r"static const _guestFunctionJwt\s*=\s*'([^']+)'", text, re.S)
          if not match:
              raise SystemExit("guest function JWT not found")
          print(match.group(1))
          PY
          )"
          STATUS="$(curl --silent --show-error \
            --output /tmp/opensubtitles-smoke.json \
            --write-out '%{http_code}' \
            --request POST \
            --url 'https://kpjuisxofwqxhbnnsyzf.supabase.co/functions/v1/opensubtitles-exact' \
            --header "Authorization: Bearer $TOKEN" \
            --header "apikey: $TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"moviehash":"0000000000000000","moviebytesize":1000000000,"language":"en"}')"
          # 404 means the deliberately fake fingerprint had no exact match.
          # 200 is also acceptable in the extremely unlikely event it matches.
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "404" ]; then
            cat /tmp/opensubtitles-smoke.json
            echo "Unexpected OpenSubtitles backend status: $STATUS" >&2
            exit 1
          fi

  android-native:
    name: Prepare Android P2P engine
    needs: [metadata, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned Android native dependencies
        shell: bash
        run: bash tools/prepare_android_native.sh native
      - uses: actions/upload-artifact@v4
        with:
          name: android-native-engine
          path: native/
          if-no-files-found: error

  macos:
    name: Build macOS
    needs: [metadata, validate]
    if: needs.metadata.outputs.platforms == 'all'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate macOS platform
        run: flutter create --platforms=macos --org com.orvix --project-name orvix .

      - name: Configure macOS Orvix branding
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/orvix-branding-venv"
          "$RUNNER_TEMP/orvix-branding-venv/bin/python" -m pip install --disable-pip-version-check pillow
          "$RUNNER_TEMP/orvix-branding-venv/bin/python" tools/generate_desktop_branding.py --macos
          test -s macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_1024.png

      - name: Require macOS 10.15+
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          podfile = Path("macos/Podfile")
          if podfile.exists():
              text = podfile.read_text()
              if "platform :osx" in text:
                  text = re.sub(
                      r"#?\s*platform :osx, ['\"][^'\"]+['\"]",
                      "platform :osx, '10.15'",
                      text,
                      count=1,
                  )
              else:
                  text = "platform :osx, '10.15'\n" + text
              podfile.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Verify macOS app
        shell: bash
        run: |
          set -euo pipefail
          test -d build/macos/Build/Products/Release/Orvix.app

      - name: Pack macOS app
        shell: bash
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/Build/Products/Release/Orvix.app \
            Orvix-v${{ needs.metadata.outputs.version }}-macOS.zip
          test -s Orvix-v${{ needs.metadata.outputs.version }}-macOS.zip

      - name: Export macOS branding previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p branding-preview-macos
          cp macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_512.png branding-preview-macos/app-icon-512.png
          cp assets/branding/orvix_logo.webp branding-preview-macos/in-app-logo.webp

      - uses: actions/upload-artifact@v4
        with:
          name: branding-preview-macos
          if-no-files-found: error
          path: branding-preview-macos/*

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: Orvix-v${{ needs.metadata.outputs.version }}-macOS.zip

  ios-modern:
    name: Build iOS Modern sideload IPA
    needs: [metadata, validate]
    if: needs.metadata.outputs.platforms == 'all'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare iOS build tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/orvix-ios-venv"
          "$RUNNER_TEMP/orvix-ios-venv/bin/python" -m pip install --disable-pip-version-check pillow
          echo "$RUNNER_TEMP/orvix-ios-venv/bin" >> "$GITHUB_PATH"

      - name: Build unsigned Modern iOS IPA (iOS 15.5+)
        shell: bash
        run: bash tools/build_ios_ipa.sh "${{ needs.metadata.outputs.version }}"

      - name: Verify Modern iOS sideload package
        shell: bash
        run: |
          set -euo pipefail
          V="${{ needs.metadata.outputs.version }}"
          PUBSPEC_VERSION="$(awk '$1 == "version:" {print $2}' pubspec.yaml)"
          bash tools/verify_ios_ipa.sh "Orvix-v$V-iOS-15.5-Plus.ipa" "$V" "${PUBSPEC_VERSION#*+}" modern

      - uses: actions/upload-artifact@v4
        with:
          name: ios-modern
          if-no-files-found: error
          path: Orvix-v${{ needs.metadata.outputs.version }}-iOS-15.5-Plus.ipa

  # iOS 12 build for older 64-bit devices. Only this job pins the last
  # Flutter release that targets iOS 12 (see tools/ios_profiles.py).
  ios-legacy:
    name: Build iOS Legacy sideload IPA
    needs: [metadata, validate]
    if: needs.metadata.outputs.platforms == 'all'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16.4
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d /Applications/Xcode_16.4.app ]; then
            echo "Xcode 16.4 is not installed on this runner. Available:" >&2
            ls -d /Applications/Xcode*.app >&2 || true
            exit 1
          fi
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.8
          cache: true

      - name: Prepare iOS build tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/orvix-ios-venv"
          "$RUNNER_TEMP/orvix-ios-venv/bin/python" -m pip install --disable-pip-version-check pillow
          echo "$RUNNER_TEMP/orvix-ios-venv/bin" >> "$GITHUB_PATH"

      - name: Build unsigned Legacy iOS IPA (iOS 12)
        shell: bash
        run: bash tools/build_ios_legacy_ipa.sh "${{ needs.metadata.outputs.version }}"

      - name: Verify Legacy iOS sideload package and Mach-O deployment targets
        shell: bash
        run: |
          set -euo pipefail
          V="${{ needs.metadata.outputs.version }}"
          PUBSPEC_VERSION="$(awk '$1 == "version:" {print $2}' pubspec.yaml)"
          bash tools/verify_ios_legacy_ipa.sh "Orvix-v$V-iOS-12-Legacy.ipa" "$V" "${PUBSPEC_VERSION#*+}"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-legacy
          if-no-files-found: error
          path: Orvix-v${{ needs.metadata.outputs.version }}-iOS-12-Legacy.ipa

  windows:
    needs: [metadata, validate]
    if: needs.metadata.outputs.platforms == 'all'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Configure Windows Orvix branding
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check pillow
          python tools/generate_desktop_branding.py --windows
          if (-not (Test-Path 'windows\\runner\\resources\\app_icon.ico')) { throw 'Windows app icon missing' }
          if ((Get-Item 'windows\\runner\\resources\\app_icon.ico').Length -lt 10000) { throw 'Windows app icon looks invalid' }

      - name: Build Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Force CMake/RC to rebuild Runner.rc after CI generates app_icon.ico.
          # Otherwise a cached runner resource can keep the previous embedded icon.
          Remove-Item -Recurse -Force 'build\windows' -ErrorAction SilentlyContinue
          flutter clean
          flutter pub get
          flutter build windows --release

      - name: Build standalone Orvix media engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location 'tools\orvix-media-engine'
          try {
            go test ./...
            go build -trimpath -ldflags '-s -w' -o '..\..\build\windows\x64\runner\Release\orvix-media-engine.exe' .
          } finally {
            Pop-Location
          }
          $engine = 'build\windows\x64\runner\Release\orvix-media-engine.exe'
          if (-not (Test-Path $engine)) { throw 'Standalone Orvix media engine was not built.' }
          if ((Get-Item $engine).Length -lt 1000000) { throw 'Standalone Orvix media engine looks invalid.' }

      - name: Verify committed Windows icon
        shell: pwsh
        run: |
          if (-not (Test-Path 'windows\runner\resources\app_icon.ico')) { throw 'Windows app icon missing' }
          if ((Get-Item 'windows\runner\resources\app_icon.ico').Length -lt 10000) { throw 'Windows app icon looks invalid' }

      - name: Verify icon embedded in built Windows EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Resolve-Path 'build\windows\x64\runner\Release\orvix.exe'
          $icoPath = Resolve-Path 'windows\runner\resources\app_icon.ico'
          Add-Type -AssemblyName System.Drawing

          # ExtractAssociatedIcon only returns a shell-selected small icon
          # (typically 32x32), so comparing it to a requested 256px ICO frame
          # was invalid. Compare the same 32px representation instead.
          $exeIcon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe.Path)
          if ($null -eq $exeIcon) { throw 'Could not extract icon embedded in orvix.exe' }
          $exeBitmap = $exeIcon.ToBitmap()
          $icoIcon = New-Object System.Drawing.Icon($icoPath.Path, 32, 32)
          $icoBitmap = $icoIcon.ToBitmap()

          function Get-VisibleBounds([System.Drawing.Bitmap]$bmp) {
            $minX=$bmp.Width; $minY=$bmp.Height; $maxX=-1; $maxY=-1
            for ($y=0; $y -lt $bmp.Height; $y++) {
              for ($x=0; $x -lt $bmp.Width; $x++) {
                if ($bmp.GetPixel($x,$y).A -ge 5) {
                  if ($x -lt $minX) {$minX=$x}; if ($x -gt $maxX) {$maxX=$x}
                  if ($y -lt $minY) {$minY=$y}; if ($y -gt $maxY) {$maxY=$y}
                }
              }
            }
            return @($minX,$minY,$maxX,$maxY)
          }

          $icoBounds = Get-VisibleBounds $icoBitmap
          $exeBounds = Get-VisibleBounds $exeBitmap
          $preview = Join-Path $env:RUNNER_TEMP 'orvix-exe-embedded-icon.png'
          $exeBitmap.Save($preview, [System.Drawing.Imaging.ImageFormat]::Png)
          $icoBitmap.Dispose(); $icoIcon.Dispose()
          $exeBitmap.Dispose(); $exeIcon.Dispose()

          if (($icoBounds -join ',') -ne ($exeBounds -join ',')) {
            throw "32px EXE embedded icon bounds $($exeBounds -join ',') do not match generated ICO bounds $($icoBounds -join ',')"
          }

      - name: Bundle verified FFmpeg tools
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Resolve-Path 'build\windows\x64\runner\Release'
          $ffmpegBin = Join-Path $releaseDir 'tools\ffmpeg\bin'
          New-Item -ItemType Directory -Force -Path $ffmpegBin | Out-Null

          # BtbN's "latest" release is replaced frequently, so hard-coding one
          # rolling asset ID eventually returns 404. Resolve the current LGPL
          # static Win64 asset at build time and verify the SHA-256 digest that
          # GitHub publishes for that exact asset before extracting it.
          $assetName = 'ffmpeg-master-latest-win64-lgpl.zip'
          $apiHeaders = @{
            Accept = 'application/vnd.github+json'
            'User-Agent' = 'Orvix-CI'
            'X-GitHub-Api-Version' = '2022-11-28'
            Authorization = "Bearer $env:GITHUB_TOKEN"
          }
          $latest = Invoke-RestMethod -Uri 'https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/latest' -Headers $apiHeaders
          $asset = $latest.assets | Where-Object { $_.name -eq 'ffmpeg-master-latest-win64-lgpl.zip' } | Select-Object -First 1
          if (-not $asset) { throw "Current BtbN release does not contain the static Win64 LGPL ZIP asset" }
          $assetName = [string]$asset.name
          if (-not $asset.digest -or -not ([string]$asset.digest).StartsWith('sha256:')) {
            throw "GitHub did not provide a SHA-256 digest for $assetName"
          }

          $archive = Join-Path $env:RUNNER_TEMP 'orvix-ffmpeg-win64-lgpl.zip'
          $downloadHeaders = @{
            Accept = 'application/octet-stream'
            'User-Agent' = 'Orvix-CI'
            'X-GitHub-Api-Version' = '2022-11-28'
            Authorization = "Bearer $env:GITHUB_TOKEN"
          }
          Invoke-WebRequest -Uri $asset.url -Headers $downloadHeaders -OutFile $archive

          $expected = ([string]$asset.digest).Substring(7).ToUpperInvariant()
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actual -ne $expected) {
            throw "FFmpeg archive checksum mismatch. expected=$expected actual=$actual"
          }

          $extract = Join-Path $env:RUNNER_TEMP 'orvix-ffmpeg-extract'
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          Expand-Archive -Path $archive -DestinationPath $extract -Force

          $ffmpegSource = Get-ChildItem -Path $extract -Recurse -Filter 'ffmpeg.exe' -File | Select-Object -First 1
          $ffprobeSource = Get-ChildItem -Path $extract -Recurse -Filter 'ffprobe.exe' -File | Select-Object -First 1
          if (-not $ffmpegSource) { throw 'Verified FFmpeg archive does not contain ffmpeg.exe' }
          if (-not $ffprobeSource) { throw 'Verified FFmpeg archive does not contain ffprobe.exe' }

          Copy-Item $ffmpegSource.FullName (Join-Path $ffmpegBin 'ffmpeg.exe') -Force
          Copy-Item $ffprobeSource.FullName (Join-Path $ffmpegBin 'ffprobe.exe') -Force

          $licenseDir = Join-Path $releaseDir 'licenses\ffmpeg'
          New-Item -ItemType Directory -Force -Path $licenseDir | Out-Null
          @"
          FFmpeg Windows binaries bundled by Orvix are from BtbN/FFmpeg-Builds.
          Release: $($latest.name)
          Asset: $assetName
          GitHub asset ID: $($asset.id)
          Verified SHA-256: $($actual.ToLowerInvariant())

          FFmpeg: https://ffmpeg.org/
          Build source: https://github.com/BtbN/FFmpeg-Builds
          "@ | Set-Content (Join-Path $licenseDir 'NOTICE.txt')

      - name: Verify bundled FFmpeg tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Resolve-Path 'build\windows\x64\runner\Release'
          $ffmpegBin = Join-Path $releaseDir 'tools\ffmpeg\bin'
          $ffmpeg = Join-Path $ffmpegBin 'ffmpeg.exe'
          $ffprobe = Join-Path $ffmpegBin 'ffprobe.exe'
          if (-not (Test-Path $ffmpeg)) { throw "Bundled ffmpeg.exe is missing: $ffmpeg" }
          if (-not (Test-Path $ffprobe)) { throw "Bundled ffprobe.exe is missing: $ffprobe" }
          # Do not pipe the process directly into Select-Object -First 1:
          # closing stdout early can make FFmpeg exit non-zero even though the
          # executable itself started correctly. Capture first, then inspect.
          $ffmpegOutput = & $ffmpeg -version 2>&1
          $ffmpegExit = $LASTEXITCODE
          $ffmpegOutput | Select-Object -First 1
          if ($ffmpegExit -ne 0) { throw "Bundled ffmpeg.exe did not run successfully (exit $ffmpegExit)" }

          $ffprobeOutput = & $ffprobe -version 2>&1
          $ffprobeExit = $LASTEXITCODE
          $ffprobeOutput | Select-Object -First 1
          if ($ffprobeExit -ne 0) { throw "Bundled ffprobe.exe did not run successfully (exit $ffprobeExit)" }

      - name: End-to-end smoke test standalone media engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Resolve-Path 'build\windows\x64\runner\Release'
          $ffmpegBin = Join-Path $releaseDir 'tools\ffmpeg\bin'
          $ffmpeg = Join-Path $ffmpegBin 'ffmpeg.exe'
          $engine = Join-Path $releaseDir 'orvix-media-engine.exe'
          $env:Path = "$ffmpegBin;$env:Path"

          $fixtureDir = Join-Path $env:RUNNER_TEMP 'orvix-media-engine-fixture'
          New-Item -ItemType Directory -Force -Path $fixtureDir | Out-Null
          $srt = Join-Path $fixtureDir 'fixture.srt'
          @"
          1
          00:00:00,000 --> 00:00:00,800
          Hello from Orvix engine.

          2
          00:00:01,000 --> 00:00:01,800
          This is the second English subtitle line.

          3
          00:00:02,000 --> 00:00:02,800
          We are checking embedded subtitle extraction.

          4
          00:00:03,000 --> 00:00:03,800
          The player must not be involved in this test.

          5
          00:00:04,000 --> 00:00:04,800
          The media engine reads the exact video file.

          6
          00:00:05,000 --> 00:00:05,800
          English text is converted into a complete SRT.

          7
          00:00:06,000 --> 00:00:06,800
          Sinhala translation happens before playback.

          8
          00:00:07,000 --> 00:00:07,800
          This fixture proves the extraction route works.
          "@ | Set-Content -Encoding utf8 $srt

          $mkv = Join-Path $fixtureDir 'fixture.mkv'
          & $ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'color=c=black:s=320x180:d=9' -i $srt -map 0:v:0 -map 1:0 -c:v mpeg4 -q:v 5 -c:s srt -metadata:s:s:0 language=eng -t 9 $mkv
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $mkv)) {
            throw 'Could not build the media-engine subtitle fixture.'
          }

          $http = Start-Process -FilePath 'python' -ArgumentList @('-m', 'http.server', '18080', '--bind', '127.0.0.1', '--directory', $fixtureDir) -PassThru
          $media = Start-Process -FilePath $engine -ArgumentList @('--port', '11471', '--idle-timeout', '10m') -PassThru
          try {
            $originReady = $false
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 250
              try {
                $origin = Invoke-WebRequest -UseBasicParsing -Method Head -Uri 'http://127.0.0.1:18080/fixture.mkv' -TimeoutSec 2
                if ($origin.StatusCode -eq 200 -and $origin.Headers['Content-Length']) {
                  $originReady = $true
                  break
                }
              } catch {}
            }
            if (-not $originReady) { throw 'Fixture HTTP origin did not become ready.' }

            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 250
              try {
                $heartbeat = Invoke-RestMethod -Uri 'http://127.0.0.1:11471/heartbeat' -TimeoutSec 2
                if ($heartbeat.name -eq 'orvix-media-engine' -and $heartbeat.version -eq 1) {
                  $ready = $true
                  break
                }
              } catch {}
            }
            if (-not $ready) { throw 'Standalone media engine heartbeat did not become ready.' }

            $payload = @{ videoUrl = 'http://127.0.0.1:18080/fixture.mkv' } | ConvertTo-Json
            $result = Invoke-RestMethod -Method Post -Uri 'http://127.0.0.1:11471/prepare' -ContentType 'application/json' -Body $payload -TimeoutSec 90

            if ($result.engine -ne 'orvix-media-engine') { throw 'Unexpected media-engine response.' }
            if ($result.embeddedFound -ne $true) { throw "Embedded subtitle extraction failed: $($result.probeError)" }
            if ($result.embeddedSrt -notmatch 'Hello from Orvix engine') {
              throw 'Extracted subtitle fixture content was missing.'
            }
            if ($result.embeddedSrt -notmatch 'This fixture proves the extraction route works') {
              throw 'Media engine did not extract the complete embedded subtitle fixture.'
            }
            if (-not $result.playbackUrl -or $result.playbackUrl -notlike 'http://127.0.0.1:11471/media/*') {
              throw "Media engine did not return its own local playback session: $($result.playbackUrl)"
            }

            $rangeHeaders = @{ Range = 'bytes=0-1023'; 'Accept-Encoding' = 'identity' }
            $proxyResponse = Invoke-WebRequest -UseBasicParsing -Uri $result.playbackUrl -Headers $rangeHeaders -TimeoutSec 15
            if ($proxyResponse.StatusCode -ne 200 -and $proxyResponse.StatusCode -ne 206) {
              throw "Media engine playback proxy returned HTTP $($proxyResponse.StatusCode)."
            }
            if ($proxyResponse.StatusCode -eq 206 -and -not $proxyResponse.Headers['Content-Range']) {
              throw 'Media engine playback proxy returned 206 without Content-Range.'
            }
            if ($proxyResponse.RawContentLength -le 0) {
              throw 'Media engine playback proxy returned no media bytes.'
            }
          } finally {
            Stop-Process -Id $media.Id -Force -ErrorAction SilentlyContinue
            Stop-Process -Id $http.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Bundle unified Orvix stream engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = 'build\windows\x64\runner\Release'
          $tag = 'stream-server-orvix-v0.1.8.3'
          $headers = @{
            Accept = 'application/vnd.github+json'
            'User-Agent' = 'Orvix-CI'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          $modRelease = $null
          for ($i = 0; $i -lt 90; $i++) {
            try {
              $modRelease = Invoke-RestMethod -Uri "https://api.github.com/repos/ish4ra/Orvix/releases/tags/$tag" -Headers $headers -TimeoutSec 10
              if ($modRelease) { break }
            } catch {
              if ($i -eq 89) { throw }
            }
            Start-Sleep -Seconds 20
          }
          if (-not $modRelease) { throw "Timed out waiting for $tag" }

          $assetName = 'orvix-stream-server-windows-amd64.exe'
          $asset = $modRelease.assets | Where-Object { $_.name -eq $assetName } | Select-Object -First 1
          if (-not $asset) { throw "$tag does not contain $assetName" }
          if (-not $asset.digest -or -not ([string]$asset.digest).StartsWith('sha256:')) {
            throw "GitHub did not provide a SHA-256 digest for $assetName"
          }

          $dest = Join-Path $releaseDir 'orvix-stream-server.exe'
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $dest
          $expected = ([string]$asset.digest).Substring(7).ToUpperInvariant()
          $actual = (Get-FileHash $dest -Algorithm SHA256).Hash.ToUpperInvariant()
          if ($actual -ne $expected) {
            throw "stream-server checksum mismatch. expected=$expected actual=$actual"
          }

          $licenseDir = Join-Path $releaseDir 'licenses\stream-server'
          New-Item -ItemType Directory -Force -Path $licenseDir | Out-Null
          Copy-Item 'licenses\stream-server\LICENSE' (Join-Path $licenseDir 'LICENSE.txt')
          Copy-Item 'licenses\stream-server\NOTICE.md' (Join-Path $licenseDir 'NOTICE.md')

      - name: End-to-end smoke unified Windows media engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = Resolve-Path 'build\windows\x64\runner\Release'
          $ffmpegBin = Join-Path $releaseDir 'tools\ffmpeg\bin'
          $ffmpeg = Join-Path $ffmpegBin 'ffmpeg.exe'
          $env:Path = "$ffmpegBin;$env:Path"

          $fixtureDir = Join-Path $env:RUNNER_TEMP 'orvix-unified-engine-fixture'
          New-Item -ItemType Directory -Force -Path $fixtureDir | Out-Null
          $fixture = Join-Path $fixtureDir 'audio-window-fixture.mkv'
          & $ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'color=c=black:s=320x180:d=5' -f lavfi -i 'sine=frequency=880:duration=5' -map 0:v:0 -map 1:a:0 -c:v mpeg4 -q:v 5 -c:a aac -t 5 $fixture
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $fixture)) {
            throw 'Could not build unified-engine audio fixture.'
          }

          $http = Start-Process -FilePath 'python' -ArgumentList @('-m', 'http.server', '18081', '--bind', '127.0.0.1', '--directory', $fixtureDir) -PassThru
          $exe = Resolve-Path 'build\windows\x64\runner\Release\orvix-stream-server.exe'
          $work = Join-Path $env:RUNNER_TEMP 'orvix-stream-server-smoke'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $proc = Start-Process -FilePath $exe -ArgumentList '--no-tray' -WorkingDirectory $work -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $r = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:11470/heartbeat' -TimeoutSec 2
                if ($r.StatusCode -ge 200 -and $r.StatusCode -lt 300) { $ready = $true; break }
              } catch {}
              if ($proc.HasExited) { throw "stream-server exited early with code $($proc.ExitCode)" }
            }
            if (-not $ready) { throw 'stream-server heartbeat did not become ready' }

            $caps = Invoke-RestMethod -Uri 'http://127.0.0.1:11470/orvix/capabilities' -TimeoutSec 5
            if ($caps.name -ne 'orvix-stream-server') { throw "Unexpected stream-server capability name: $($caps.name)" }
            if ($caps.exactFileEmbeddedSubtitles -ne $true) { throw 'Bundled stream-server is missing exact-file embedded subtitle support' }
            if ($caps.exactSubtitleRouteVersion -ne 1) { throw "Unsupported exact subtitle route version: $($caps.exactSubtitleRouteVersion)" }
            if ($caps.remoteEmbeddedSubtitles -ne $true) { throw 'Bundled stream-server is missing remote/debrid embedded subtitle support' }
            if ($caps.remoteSubtitleRouteVersion -ne 1) { throw "Unsupported remote subtitle route version: $($caps.remoteSubtitleRouteVersion)" }
            if ($caps.audioWindowExtraction -ne $true) { throw 'Bundled stream-server is missing crash-isolated audio extraction' }
            if ($caps.audioWindowRouteVersion -ne 1) { throw "Unsupported audio window route version: $($caps.audioWindowRouteVersion)" }

            $originReady = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $head = Invoke-WebRequest -UseBasicParsing -Method Head -Uri 'http://127.0.0.1:18081/audio-window-fixture.mkv' -TimeoutSec 2
                if ($head.StatusCode -eq 200) { $originReady = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 200
            }
            if (-not $originReady) { throw 'Audio fixture HTTP origin did not become ready.' }

            $audioBody = @{
              videoUrl = 'http://127.0.0.1:18081/audio-window-fixture.mkv'
              startMs = 0
              durationMs = 3000
            } | ConvertTo-Json -Compress
            $audioOut = Join-Path $env:RUNNER_TEMP 'orvix-unified-audio-window.aac'
            Invoke-WebRequest -UseBasicParsing -Method Post -ContentType 'application/json' -Body $audioBody -Uri 'http://127.0.0.1:11470/orvix/audio-window' -OutFile $audioOut -TimeoutSec 50
            if (-not (Test-Path $audioOut) -or (Get-Item $audioOut).Length -lt 256) {
              throw 'Unified stream engine did not return a usable AAC audio window.'
            }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            if (-not $http.HasExited) { Stop-Process -Id $http.Id -Force }
          }

      - name: Pack portable build
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath 'Orvix-v${{ needs.metadata.outputs.version }}-Windows-x64.zip' -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler was not found.' }
          & $iscc '/DMyAppVersion=${{ needs.metadata.outputs.version }}' 'installer\orvix.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Smoke test Windows installer package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Resolve-Path 'installer-output\\Orvix-Setup-v${{ needs.metadata.outputs.version }}-Windows-x64.exe'
          $installerLog = Join-Path $env:RUNNER_TEMP 'orvix-installer-smoke.log'
          $run = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/LOG=$installerLog" -Wait -PassThru
          if ($run.ExitCode -ne 0) {
            if (Test-Path $installerLog) { Get-Content $installerLog }
            throw "Installer smoke test failed with exit code $($run.ExitCode)"
          }
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\\Orvix\\orvix.exe'
          if (-not (Test-Path $installed)) {
            throw "Installed Orvix is missing: $installed"
          }

      - name: Smoke test updater handoff over a running Orvix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\\Orvix\\orvix.exe'
          $installer = Resolve-Path 'installer-output\\Orvix-Setup-v${{ needs.metadata.outputs.version }}-Windows-x64.exe'
          $upgradeLog = Join-Path $env:RUNNER_TEMP 'orvix-installer-running-app.log'

          $running = Start-Process -FilePath $installed -PassThru
          Start-Sleep -Seconds 3
          if ($running.HasExited) {
            throw 'Installed Orvix exited before the updater handoff test.'
          }

          # Match the real in-app updater: Setup is started first, then Orvix
          # releases its own file locks and exits shortly afterwards. Never
          # leave a CI runner waiting indefinitely on a hidden installer UI.
          $args = @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            '/CLOSEAPPLICATIONS',
            '/FORCECLOSEAPPLICATIONS',
            '/LOGCLOSEAPPLICATIONS',
            "/LOG=$upgradeLog"
          )
          $upgrade = Start-Process -FilePath $installer -ArgumentList $args -PassThru

          Start-Sleep -Milliseconds 900
          $running.Refresh()
          if (-not $running.HasExited) {
            Stop-Process -Id $running.Id -Force -ErrorAction SilentlyContinue
          }

          if (-not $upgrade.WaitForExit(180000)) {
            if (Test-Path $upgradeLog) { Get-Content $upgradeLog }
            Stop-Process -Id $upgrade.Id -Force -ErrorAction SilentlyContinue
            throw 'Installer did not finish within 180 seconds after Orvix released its file locks.'
          }

          if ($upgrade.ExitCode -ne 0) {
            if (Test-Path $upgradeLog) { Get-Content $upgradeLog }
            throw "Installer updater handoff failed with exit code $($upgrade.ExitCode)"
          }

          $running.Refresh()
          if (-not $running.HasExited) {
            Stop-Process -Id $running.Id -Force -ErrorAction SilentlyContinue
            throw 'Old Orvix process was still running after updater handoff.'
          }

          if (-not (Test-Path $installed)) {
            throw 'Updated Orvix executable is missing after updater handoff.'
          }

      - name: Compatibility test beta.2 in-app updater to new installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $currentInstaller = Resolve-Path 'installer-output\\Orvix-Setup-v${{ needs.metadata.outputs.version }}-Windows-x64.exe'
          $installedDir = Join-Path $env:LOCALAPPDATA 'Programs\\Orvix'
          $uninstaller = Join-Path $installedDir 'unins000.exe'

          # Reset to the exact public beta.2 package the user is running.
          if (Test-Path $uninstaller) {
            $cleanup = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
            if ($cleanup.ExitCode -ne 0) { throw "Pre-migration cleanup failed: $($cleanup.ExitCode)" }
          }

          $beta2 = Join-Path $env:RUNNER_TEMP 'Orvix-Setup-v0.7.6-beta.2-Windows-x64.exe'
          Invoke-WebRequest -Uri 'https://github.com/ish4ra/Orvix/releases/download/v0.7.6-beta.2/Orvix-Setup-v0.7.6-beta.2-Windows-x64.exe' -OutFile $beta2
          if ((Get-Item $beta2).Length -lt 70000000) { throw 'Downloaded beta.2 installer looks incomplete.' }

          $installBeta2 = Start-Process -FilePath $beta2 -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait -PassThru
          if ($installBeta2.ExitCode -ne 0) { throw "beta.2 setup failed: $($installBeta2.ExitCode)" }

          $beta2Exe = Join-Path $installedDir 'orvix.exe'
          $beta2Helper = Join-Path $installedDir 'orvix_updater_helper.exe'
          $beta2Stream = Join-Path $installedDir 'orvix-stream-server.exe'
          foreach ($required in @($beta2Exe, $beta2Helper, $beta2Stream)) {
            if (-not (Test-Path $required)) { throw "beta.2 migration fixture missing: $required" }
          }

          # Reproduce the old bug class: beta.2 UI + an orphanable P2P engine
          # are alive when the old updater helper takes over.
          $oldApp = Start-Process -FilePath $beta2Exe -PassThru
          $streamWork = Join-Path $env:RUNNER_TEMP 'beta2-stream-server'
          New-Item -ItemType Directory -Force -Path $streamWork | Out-Null
          $oldStream = Start-Process -FilePath $beta2Stream -ArgumentList '--no-tray' -WorkingDirectory $streamWork -PassThru
          Start-Sleep -Seconds 3
          if ($oldApp.HasExited) { throw 'beta.2 app exited before migration test.' }
          if ($oldStream.HasExited) { throw 'beta.2 stream-server exited before migration test.' }

          $helperCopy = Join-Path $env:RUNNER_TEMP 'beta2-updater-helper.exe'
          Copy-Item $beta2Helper $helperCopy -Force
          $status = Join-Path $env:RUNNER_TEMP 'beta2-to-next-status.txt'
          $helperLog = Join-Path $env:RUNNER_TEMP 'beta2-to-next-helper.log'
          $installerLog = Join-Path $env:RUNNER_TEMP 'beta2-to-next-installer.log'
          foreach ($path in @($status, $helperLog, $installerLog)) {
            if (Test-Path $path) { Remove-Item $path -Force }
          }

          $helperArgs = @(
            '--parent-pid', "$($oldApp.Id)",
            '--installer', "$currentInstaller",
            '--restart-exe', '',
            '--target-version', '0.7.7',
            '--log', "$helperLog",
            '--installer-log', "$installerLog",
            '--status', "$status",
            '--no-restart'
          )
          $helper = Start-Process -FilePath $helperCopy -ArgumentList $helperArgs -PassThru
          Start-Sleep -Milliseconds 700

          # beta.2 itself used exit(0) after handing off. Force-stopping the
          # fixture reproduces that abrupt parent disappearance.
          Stop-Process -Id $oldApp.Id -Force -ErrorAction SilentlyContinue

          if (-not $helper.WaitForExit(90000)) {
            Stop-Process -Id $helper.Id -Force -ErrorAction SilentlyContinue
            Stop-Process -Id $oldStream.Id -Force -ErrorAction SilentlyContinue
            throw 'beta.2 updater helper timed out while applying the new installer.'
          }
          if ($helper.ExitCode -ne 0) {
            if (Test-Path $helperLog) { Get-Content $helperLog }
            if (Test-Path $installerLog) { Get-Content $installerLog }
            Stop-Process -Id $oldStream.Id -Force -ErrorAction SilentlyContinue
            throw "beta.2 updater helper failed with exit code $($helper.ExitCode)"
          }

          if (-not (Test-Path $status)) { throw 'beta.2 helper did not write migration status.' }
          $value = (Get-Content -Raw $status).Trim()
          if ($value -ne 'success|0|0.7.7') {
            if (Test-Path $helperLog) { Get-Content $helperLog }
            if (Test-Path $installerLog) { Get-Content $installerLog }
            throw "Unexpected beta.2 migration status: $value"
          }

          # The new installer must have killed the stale old P2P process before
          # replacing its executable.
          $oldStream.Refresh()
          if (-not $oldStream.HasExited) {
            Stop-Process -Id $oldStream.Id -Force -ErrorAction SilentlyContinue
            throw 'Old beta.2 stream-server survived the upgrade.'
          }
          if (-not (Test-Path (Join-Path $installedDir 'orvix.exe'))) {
            throw 'Orvix is missing after beta.2 migration.'
          }

      - name: Smoke test Windows single-instance guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\\Orvix\\orvix.exe'
          $first = Start-Process -FilePath $installed -PassThru
          Start-Sleep -Seconds 3
          $second = Start-Process -FilePath $installed -PassThru
          if (-not $second.WaitForExit(5000)) {
            Stop-Process -Id $second.Id -Force -ErrorAction SilentlyContinue
            Stop-Process -Id $first.Id -Force -ErrorAction SilentlyContinue
            throw 'Second Orvix instance stayed alive instead of handing off to the existing window.'
          }
          $live = @(Get-Process -Name 'orvix' -ErrorAction SilentlyContinue)
          if ($live.Count -ne 1) {
            $live | Format-Table Id, ProcessName, Path -AutoSize
            Stop-Process -Name 'orvix' -Force -ErrorAction SilentlyContinue
            throw "Expected exactly one Orvix process, found $($live.Count)."
          }
          Stop-Process -Id $first.Id -Force -ErrorAction SilentlyContinue

          $uninstaller = Join-Path $env:LOCALAPPDATA 'Programs\\Orvix\\unins000.exe'
          if (Test-Path $uninstaller) {
            $cleanup = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
            if ($cleanup.ExitCode -ne 0) {
              Write-Warning "Orvix test uninstall returned $($cleanup.ExitCode)"
            }
          }

