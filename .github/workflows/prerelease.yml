      - uses: actions/upload-artifact@v4
        with:
          name: branding-preview
          if-no-files-found: error
          path: branding-preview/*

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            Orvix-v${{ needs.metadata.outputs.version }}-Windows-x64.zip
            installer-output/Orvix-Setup-v${{ needs.metadata.outputs.version }}-Windows-x64.exe

  android-mobile:
    runs-on: ubuntu-latest
    needs: [metadata, validate, android-native]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.orvix --project-name orvix .

      - uses: actions/download-artifact@v4
        with:
          name: android-native-engine
          path: android-native

      - name: Configure Android mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          mkdir -p android/app/src/main/jniLibs android/app/libs
          cp -R android-native/jniLibs/. android/app/src/main/jniLibs/
          cp android-native/libs/rustls-platform-verifier-0.1.1.aar android/app/libs/
          python3 tools/configure_android_build.py
          python3 tools/configure_android_mobile_compat.py
          grep -q 'android:extractNativeLibs="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'useLegacyPackaging = true' android/app/build.gradle.kts
          grep -q 'orvix/torrent_engine' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt

      - name: Configure release signing
        env:
          ORVIX_ANDROID_KEYSTORE_B64: ${{ secrets.ORVIX_ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ORVIX_ANDROID_KEYSTORE_B64:-}"
          printf '%s' "$ORVIX_ANDROID_KEYSTORE_B64" | base64 --decode > android/app/orvix-release.jks
          test -s android/app/orvix-release.jks
          python3 tools/configure_android_signing.py

      - name: Get dependencies
        run: flutter pub get

      - name: Enable full Android Mobile libmpv codecs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/configure_android_mobile_media_kit.py

      - name: Build Android mobile APKs
        run: |
          flutter build apk --release
          # Keep every ABI APK on the universal APK's versionCode. Flutter's
          # default ABI*1000 offset made installing the universal APK over an
          # ABI APK a downgrade ("package appears to be invalid").
          flutter build apk --release --split-per-abi \
            --android-project-arg=force-version-code-ignoring-abi=true

      - name: Verify Android mobile APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" > /tmp/orvix-apk-list.txt
          grep -q 'lib/arm64-v8a/libstream_server.so' /tmp/orvix-apk-list.txt
          grep -q 'lib/armeabi-v7a/libstream_server.so' /tmp/orvix-apk-list.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          # Regression gate for in-app updates: an APK can be structurally valid
          # yet still be rejected as an update when signed by a different key.
          # Compare the new certificate with the currently published Android APK.
          curl --fail --location --retry 4 \
            "https://github.com/ish4ra/Orvix/releases/download/v0.7.9-beta.11/Orvix-v0.7.9-beta.11-Android-Mobile.apk" \
            -o /tmp/orvix-previous.apk
          "$APKSIGNER" verify --verbose --print-certs /tmp/orvix-previous.apk > /tmp/previous-cert.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" > /tmp/current-cert.txt
          PREVIOUS_CERT="$(grep -m1 'certificate SHA-256 digest:' /tmp/previous-cert.txt | sed 's/.*: //')"
          CURRENT_CERT="$(grep -m1 'certificate SHA-256 digest:' /tmp/current-cert.txt | sed 's/.*: //')"
          test -n "$PREVIOUS_CERT"
          test -n "$CURRENT_CERT"
          if [ "$PREVIOUS_CERT" != "$CURRENT_CERT" ]; then
            echo "Android update signing certificate changed: $PREVIOUS_CERT -> $CURRENT_CERT" >&2
            exit 1
          fi

      - name: Rename APKs
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Orvix-v${{ needs.metadata.outputs.version }}-Android-Mobile.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Orvix-v${{ needs.metadata.outputs.version }}-Android-Mobile-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk Orvix-v${{ needs.metadata.outputs.version }}-Android-Mobile-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk Orvix-v${{ needs.metadata.outputs.version }}-Android-Mobile-x86_64.apk

      - name: Verify Android mobile APK installability
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          PREVIOUS_CERT="$(grep -m1 'certificate SHA-256 digest:' /tmp/previous-cert.txt | sed 's/.*: //')"
          test -n "$PREVIOUS_CERT"
          V="${{ needs.metadata.outputs.version }}"
          # Checks the exact files that are published: signature and Orvix
          # certificate, zip alignment, manifest, ABIs, native libraries, and
          # that all four APKs share one versionCode above the old ABI APKs.
          python3 tools/verify_android_apk.py \
            --build-tools "$(dirname "$APKSIGNER")" \
            --flavor mobile \
            --expected-cert-sha256 "$PREVIOUS_CERT" \
            --above-legacy-split-version-codes \
            "Orvix-v$V-Android-Mobile.apk=arm64-v8a,armeabi-v7a,x86_64" \
            "Orvix-v$V-Android-Mobile-arm64-v8a.apk=arm64-v8a" \
            "Orvix-v$V-Android-Mobile-armeabi-v7a.apk=armeabi-v7a" \
            "Orvix-v$V-Android-Mobile-x86_64.apk=x86_64"

      - name: Verify Android Mobile APKs update the latest published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          V="${{ needs.metadata.outputs.version }}"
          # Android accepts an update only from the same package and signer
          # with a strictly higher versionCode. Compare every new Mobile APK
          # with the universal APK of the newest published release, which is
          # what the in-app updater installs on phones.
          PREVIOUS_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            --jq '[.[] | select(.draft == false) | select(any(.assets[]; .name | endswith("-Android-Mobile.apk")))][0].tag_name // empty')"
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No published Android Mobile APK found to compare against." >&2
            exit 1
          fi
          if [ "$PREVIOUS_TAG" = "v$V" ]; then
            echo "v$V is already published." >&2
            exit 1
          fi
          gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "Orvix-$PREVIOUS_TAG-Android-Mobile.apk" \
            --output /tmp/orvix-published-android-mobile.apk
          python3 tools/check_android_update_path.py \
            --build-tools "$(dirname "$APKSIGNER")" \
            --previous /tmp/orvix-published-android-mobile.apk \
            "Orvix-v$V-Android-Mobile.apk" \
            "Orvix-v$V-Android-Mobile-arm64-v8a.apk" \
            "Orvix-v$V-Android-Mobile-armeabi-v7a.apk" \
            "Orvix-v$V-Android-Mobile-x86_64.apk"

      - name: Export Android mobile branding previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p branding-preview-android-mobile
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png branding-preview-android-mobile/launcher-192.png
          cp android/app/src/main/res/drawable-nodpi/orvix_foreground.png branding-preview-android-mobile/adaptive-foreground.png
          cp assets/branding/orvix_logo.webp branding-preview-android-mobile/in-app-logo.webp

      - uses: actions/upload-artifact@v4
        with:
          name: branding-preview-android-mobile
          if-no-files-found: error
          path: branding-preview-android-mobile/*

      - uses: actions/upload-artifact@v4
        with:
          name: android-mobile
          path: |
            Orvix-v${{ needs.metadata.outputs.version }}-Android-Mobile.apk
            Orvix-v${{ needs.metadata.outputs.version }}-Android-Mobile-arm64-v8a.apk
            Orvix-v${{ needs.metadata.outputs.version }}-Android-Mobile-armeabi-v7a.apk
            Orvix-v${{ needs.metadata.outputs.version }}-Android-Mobile-x86_64.apk

  android-tv:
    runs-on: ubuntu-latest
    needs: [metadata, validate, android-native]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.orvix --project-name orvix .

      - uses: actions/download-artifact@v4
        with:
          name: android-native-engine
          path: android-native

      - name: Configure Android TV
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          mkdir -p android/app/src/main/jniLibs android/app/libs
          cp -R android-native/jniLibs/. android/app/src/main/jniLibs/
          cp android-native/libs/rustls-platform-verifier-0.1.1.aar android/app/libs/
          python3 tools/configure_android_build.py --tv
          python3 tools/configure_android_mobile_compat.py
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' android/app/src/main/AndroidManifest.xml
          grep -q 'android:screenOrientation="landscape"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:extractNativeLibs="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'orvix/torrent_engine' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt
          grep -q 'JniStreamingServerController.start' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt
          test ! -f android/app/src/main/kotlin/com/orvix/orvix/TorrentEngineService.kt
          if grep -q 'orvix/tv_native_player' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt; then
            echo 'Experimental native TV player bridge is still present.' >&2
            exit 1
          fi
          test ! -f android/app/src/main/kotlin/com/orvix/orvix/TvNativePlayerActivity.kt

      - name: Verify Android TV banner
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/src/main/res/drawable-xhdpi/tv_banner.png
          python3 - <<'PY'
          from PIL import Image
          image = Image.open("android/app/src/main/res/drawable-xhdpi/tv_banner.png")
          if image.size != (320, 180):
              raise SystemExit(f"Wrong TV banner size: {image.size}")
          PY

      - name: Configure release signing
        env:
          ORVIX_ANDROID_KEYSTORE_B64: ${{ secrets.ORVIX_ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ORVIX_ANDROID_KEYSTORE_B64:-}"
          printf '%s' "$ORVIX_ANDROID_KEYSTORE_B64" | base64 --decode > android/app/orvix-release.jks
          test -s android/app/orvix-release.jks
          python3 tools/configure_android_signing.py

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android TV APK
        run: flutter build apk --release --dart-define=ORVIX_TV=true

      - name: Verify Android TV APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" > /tmp/orvix-apk-list.txt
          grep -q 'lib/arm64-v8a/libstream_server.so' /tmp/orvix-apk-list.txt
          grep -q 'lib/armeabi-v7a/libstream_server.so' /tmp/orvix-apk-list.txt
          grep -q 'lib/arm64-v8a/libc++_shared.so' /tmp/orvix-apk-list.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Orvix-v${{ needs.metadata.outputs.version }}-Android-TV.apk

      - name: Verify Android TV APK updates the latest published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          V="${{ needs.metadata.outputs.version }}"
          # Same update rule as Android Mobile, against the newest published
          # Android TV APK that the TV in-app updater installed.
          PREVIOUS_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=30" \
            --jq '[.[] | select(.draft == false) | select(any(.assets[]; .name | endswith("-Android-TV.apk")))][0].tag_name // empty')"
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No published Android TV APK found to compare against." >&2
            exit 1
          fi
          if [ "$PREVIOUS_TAG" = "v$V" ]; then
            echo "v$V is already published." >&2
            exit 1
          fi
          gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "Orvix-$PREVIOUS_TAG-Android-TV.apk" \
            --output /tmp/orvix-published-android-tv.apk
          python3 tools/check_android_update_path.py \
            --build-tools "$(dirname "$APKSIGNER")" \
            --previous /tmp/orvix-published-android-tv.apk \
            "Orvix-v$V-Android-TV.apk"

      - name: Export Android TV branding previews
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p branding-preview-android-tv
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png branding-preview-android-tv/launcher-192.png
          cp android/app/src/main/res/drawable-xhdpi/tv_banner.png branding-preview-android-tv/tv-banner.png
          cp assets/branding/orvix_logo.webp branding-preview-android-tv/in-app-logo.webp

      - uses: actions/upload-artifact@v4
        with:
          name: branding-preview-android-tv
          if-no-files-found: error
          path: branding-preview-android-tv/*

      - uses: actions/upload-artifact@v4
        with:
          name: android-tv
          path: Orvix-v${{ needs.metadata.outputs.version }}-Android-TV.apk

  release:
    name: Publish Orvix prerelease
    needs: [metadata, validate, windows, macos, ios-modern, ios-legacy, android-mobile, android-tv]
    # Desktop and iOS jobs are skipped for an Android-only release. Publish
    # only when every job of the selected platform set succeeded.
    if: >-
      ${{ !cancelled()
      && needs.validate.result == 'success'
      && needs.android-mobile.result == 'success'
      && needs.android-tv.result == 'success'
      && (needs.metadata.outputs.platforms == 'android'
          || (needs.windows.result == 'success'
              && needs.macos.result == 'success'
              && needs.ios-modern.result == 'success'
              && needs.ios-legacy.result == 'success')) }}
    runs-on: ubuntu-latest
    env:
      RELEASE_PLATFORMS: ${{ needs.metadata.outputs.platforms }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        if: needs.metadata.outputs.platforms == 'all'
        with:
          name: windows
          path: dist/windows

      - uses: actions/download-artifact@v4
        with:
          name: android-mobile
          path: dist/mobile

      - uses: actions/download-artifact@v4
        with:
          name: android-tv
          path: dist/tv

      - uses: actions/download-artifact@v4
        if: needs.metadata.outputs.platforms == 'all'
        with:
          name: macos
          path: dist/macos

      - uses: actions/download-artifact@v4
        if: needs.metadata.outputs.platforms == 'all'
        with:
          name: ios-modern
          path: dist/ios-modern

      - uses: actions/download-artifact@v4
        if: needs.metadata.outputs.platforms == 'all'
        with:
          name: ios-legacy
          path: dist/ios-legacy

      - name: Select release assets
        shell: bash
        run: |
          set -euo pipefail
          V="${{ needs.metadata.outputs.version }}"
          case "$RELEASE_PLATFORMS" in
            android)
              # Android Mobile (universal + ABI) and Android TV only.
              ASSETS=(
                "dist/mobile/Orvix-v$V-Android-Mobile.apk"
                "dist/mobile/Orvix-v$V-Android-Mobile-arm64-v8a.apk"
                "dist/mobile/Orvix-v$V-Android-Mobile-armeabi-v7a.apk"
                "dist/mobile/Orvix-v$V-Android-Mobile-x86_64.apk"
                "dist/tv/Orvix-v$V-Android-TV.apk"
              )
              ;;
            all)
              ASSETS=(
                "dist/windows/Orvix-v$V-Windows-x64.zip"
                "dist/windows/installer-output/Orvix-Setup-v$V-Windows-x64.exe"
                "dist/mobile/Orvix-v$V-Android-Mobile.apk"
                "dist/mobile/Orvix-v$V-Android-Mobile-arm64-v8a.apk"
                "dist/mobile/Orvix-v$V-Android-Mobile-armeabi-v7a.apk"
                "dist/mobile/Orvix-v$V-Android-Mobile-x86_64.apk"
                "dist/tv/Orvix-v$V-Android-TV.apk"
                "dist/macos/Orvix-v$V-macOS.zip"
                "dist/ios-modern/Orvix-v$V-iOS-15.5-Plus.ipa"
                "dist/ios-legacy/Orvix-v$V-iOS-12-Legacy.ipa"
              )
              ;;
            *)
              echo "Unknown release platforms: $RELEASE_PLATFORMS" >&2
              exit 1
              ;;
          esac
          for asset in "${ASSETS[@]}"; do
            test -s "$asset"
            if [ "$RELEASE_PLATFORMS" = android ]; then
              case "$asset" in
                *Windows*|*macOS*|*iOS*)
                  echo "Android-only release selected a non-Android asset: $asset" >&2
                  exit 1
                  ;;
              esac
            fi
          done
          printf '%s\n' "${ASSETS[@]}" > /tmp/orvix-release-assets.txt
          echo "Publishing ${#ASSETS[@]} assets:"
          cat /tmp/orvix-release-assets.txt

      - name: Stage PRIVATE draft release (no public publishing)
        env:
          GH_TOKEN: ${{ github.token }}
          ORVIX_RELEASE_PRERELEASE: "true"
          ORVIX_RELEASE_DRAFT_ONLY: "true"
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="v${{ needs.metadata.outputs.version }}" \
            -f target_commitish="${GITHUB_SHA}" \
            --jq '.body' > /tmp/generated-notes.md

          V="${{ needs.metadata.outputs.version }}"
          {
            if [ -f "docs/release-notes/v$V.md" ]; then
              cat "docs/release-notes/v$V.md"
              echo
            fi
            echo "### Which Android file should I download?"
            echo
            echo "- **Phones and tablets:** \`Orvix-v$V-Android-Mobile.apk\` (recommended, works on every supported phone)."
            echo "- **Android TV / Google TV:** \`Orvix-v$V-Android-TV.apk\`."
            echo "- Smaller phone downloads for one processor type: \`-arm64-v8a\` (most modern phones), \`-armeabi-v7a\` (older 32-bit phones), \`-x86_64\` (emulators and Chromebooks). Any Android Mobile file can update or replace another."
            echo
            if [ "$RELEASE_PLATFORMS" = android ]; then
            echo "### Platforms in this release"
            echo
            echo "This is an Android Mobile and Android TV test release. It has no Windows, macOS or iPhone / iPad files; those platforms stay on their previous release."
            echo
            echo "- [Privacy policy](https://github.com/$GITHUB_REPOSITORY/blob/v$V/PRIVACY.md)"
            echo
            else
            echo "### Windows code signing"
            echo
            echo "The Windows installer and portable ZIP in this release are **not code signed**, so Windows SmartScreen may warn before running them. Download Orvix only from this GitHub Releases page. Orvix is applying for free open-source code signing from SignPath Foundation; signed releases will say so here."
            echo
            echo "- [Code signing policy](https://github.com/$GITHUB_REPOSITORY/blob/v$V/CODE_SIGNING_POLICY.md)"
            echo "- [Privacy policy](https://github.com/$GITHUB_REPOSITORY/blob/v$V/PRIVACY.md)"
            echo
            IOS_BUILD="$(awk '$1 == "version:" {print $2}' pubspec.yaml)"
            echo "### Which iPhone / iPad file should I download?"
            echo
            echo "There are two iPhone / iPad files. Download **one**, chosen by your iOS version (**Settings > General > About > iOS Version**). Both are **unsigned IPAs** for sideloading: your sideload tool re-signs them with your own Apple account. They are **not** App Store releases."
            echo
            echo "### iPhone / iPad - Modern (Recommended)"
            echo
            echo "File:"
            echo "\`Orvix-v$V-iOS-15.5-Plus.ipa\`"
            echo
            echo "- Requires iOS / iPadOS 15.5 or later."
            echo "- Recommended build for supported newer devices."
            echo "- Use this unless your device cannot run iOS 15.5."
            echo "- Install with AltStore, SideStore or a compatible sideload tool. AltStore / SideStore source: \`https://raw.githubusercontent.com/ish4ra/Orvix/develop/store.json\`."
            echo
            echo "### iPhone / iPad - Legacy"
            echo
            echo "File:"
            echo "\`Orvix-v$V-iOS-12-Legacy.ipa\`"
            echo
            echo "- For older devices running iOS 12.x that cannot update to iOS 15.5."
            echo "- Intended for devices such as:"
            echo "  - iPhone 5s"
            echo "  - iPhone 6"
            echo "  - iPhone 6 Plus"
            echo "- Requires iOS 12.0 or later. If your device can run iOS 15.5 or later, use the Modern file instead."
            echo "- Not in the AltStore / SideStore source, because current AltStore and SideStore apps do not run on iOS 12. Install it from a computer with a sideload tool that still supports iOS 12."
            echo "- Legacy-only limitations: no features are removed compared with the Modern build. It is built with an older, iOS 12 compatible Flutter toolchain and library versions, so details can differ slightly from the Modern build."
            echo
            echo "### Both iPhone / iPad builds"
            echo
            echo "- iOS shows both builds as version ${V%%-*} (build ${IOS_BUILD#*+})."
            echo "- Apps signed with a free Apple account normally have to be re-signed periodically (every 7 days)."
            echo "- Built-in local Free P2P is not included on iOS yet. Use supported cloud, debrid or direct playback sources."
            echo "- Embedded subtitle extraction and the AI audio subtitle fallback are not available on iOS."
            echo
            fi
            cat /tmp/generated-notes.md
          } > /tmp/notes.md

          TITLE="Orvix v$V"
          if [ "$RELEASE_PLATFORMS" = android ]; then
            TITLE="Orvix v$V Android Mobile + TV"
          fi
          mapfile -t ASSETS < /tmp/orvix-release-assets.txt
          chmod +x tools/publish_orvix_release.sh
          tools/publish_orvix_release.sh \
            "v$V" \
            "$TITLE" \
            /tmp/notes.md \
            "${{ github.sha }}" \
            "${ASSETS[@]}"

      - name: Prepare AltStore / SideStore source entry
        # store.json changes go to develop through a normal PR. This only
        # produces a candidate file and never blocks or alters the release.
        # Only the Modern IPA is listed: current AltStore / SideStore apps do
        # not run on iOS 12, and one bundle ID must not get two entries for
        # the same version/build. The Legacy IPA is a direct download.
        # An Android-only release has no IPA and leaves the source untouched.
        if: needs.metadata.outputs.platforms == 'all'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          V="${{ needs.metadata.outputs.version }}"
          BUILD="$(awk '$1 == "version:" {print $2}' pubspec.yaml)"
          mkdir -p dist/altstore
          python3 tools/update_altstore_source.py \
            --source store.json \
            --ipa "dist/ios-modern/Orvix-v$V-iOS-15.5-Plus.ipa" \
            --release-notes /tmp/notes.md \
            --release-version "$V" \
            --build-version "${BUILD#*+}" \
            --release-date "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            --download-url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$V/Orvix-v$V-iOS-15.5-Plus.ipa" \
            --output dist/altstore/store.json

      - uses: actions/upload-artifact@v4
        if: needs.metadata.outputs.platforms == 'all'
        continue-on-error: true
        with:
          name: altstore-source
          if-no-files-found: warn
          path: dist/altstore/store.json
