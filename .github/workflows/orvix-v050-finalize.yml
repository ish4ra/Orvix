name: Finalize Orvix v0.5 source priority

on:
  push:
    branches:
      - orvix-v0.5.0-dev
    paths:
      - '.github/workflows/orvix-v050-finalize.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: orvix-v0.5.0-dev
          fetch-depth: 0

      - name: Refine default source priority
        shell: pwsh
        run: |
          $path = 'lib/services/source_provider_service.dart'
          $content = Get-Content $path -Raw
          $pattern = 'SourceSortCriterion\.releaseQuality,\r?\n\s+SourceSortCriterion\.fileSize,\r?\n\s+SourceSortCriterion\.seeders,'
          $replacement = "SourceSortCriterion.releaseQuality,`n    SourceSortCriterion.seeders,`n    SourceSortCriterion.fileSize,"
          $updated = [regex]::Replace($content, $pattern, $replacement, 1)
          if ($updated -eq $content) { throw 'Default source-priority sequence was not found.' }
          [System.IO.File]::WriteAllText($path, $updated)

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/orvix-v050-finalize.yml
          git add lib/services/source_provider_service.dart
          git commit -m "fix: prefer healthy sources before file size"
          git push origin HEAD:orvix-v0.5.0-dev
