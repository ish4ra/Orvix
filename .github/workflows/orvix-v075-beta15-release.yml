name: Release Orvix v0.7.5-beta.15 — Instant Titles + Desktop Refresh

on:
  push:
    branches:
      - orvix-v0.7.5-dev
    paths:
      - '.github/workflows/orvix-v075-beta15-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orvix-v075-beta15-release
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Dart + regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Run complete Flutter test suite
        shell: bash
        run: |
          set -euo pipefail
          flutter test

      - name: Smoke test deployed AI Sinhala backend
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(python3 - <<'PY'
          import re
          text = open("lib/services/ai_sinhala_subtitle_service.dart", encoding="utf-8").read()
          match = re.search(r"static const _guestFunctionJwt\s*=\s*'([^']+)'", text, re.S)
          if not match:
              raise SystemExit("guest function JWT not found")
          print(match.group(1))
          PY
          )"
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url 'https://kpjuisxofwqxhbnnsyzf.supabase.co/functions/v1/translate-subtitle-si' \
            --header "Authorization: Bearer $TOKEN" \
            --header "apikey: $TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"title":"Orvix CI","text":"You are telling me you are just going to walk out of here","context":[]}')"
          printf '%s' "$RESPONSE" | python3 -c '
          import json, re, sys
          data = json.load(sys.stdin)
          text = str(data.get("translation", "")).strip()
          if not re.search(r"[\u0D80-\u0DFF]", text):
              raise SystemExit(f"AI backend did not return Sinhala: {data}")
          '

      - name: Smoke test OpenSubtitles REST backend wiring
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(python3 - <<'PY'
          import re
          text = open("lib/services/ai_sinhala_subtitle_service.dart", encoding="utf-8").read()
          match = re.search(r"static const _guestFunctionJwt\s*=\s*'([^']+)'", text, re.S)
          if not match:
              raise SystemExit("guest function JWT not found")
          print(match.group(1))
          PY
          )"
          STATUS="$(curl --silent --show-error \
            --output /tmp/opensubtitles-smoke.json \
            --write-out '%{http_code}' \
            --request POST \
            --url 'https://kpjuisxofwqxhbnnsyzf.supabase.co/functions/v1/opensubtitles-exact' \
            --header "Authorization: Bearer $TOKEN" \
            --header "apikey: $TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"moviehash":"0000000000000000","moviebytesize":1000000000,"language":"en"}')"
          # 404 means the deliberately fake fingerprint had no exact match.
          # 200 is also acceptable in the extremely unlikely event it matches.
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "404" ]; then
            cat /tmp/opensubtitles-smoke.json
            echo "Unexpected OpenSubtitles backend status: $STATUS" >&2
            exit 1
          fi

  android-native:
    name: Prepare Android P2P engine
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned native stream-server builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/jniLibs/{armeabi-v7a,arm64-v8a,x86,x86_64} native/libs tmp
          extract_native() {
            abi="$1"
            file="$2"
            sha="$3"
            curl --fail --location --retry 4 --retry-delay 2               "https://github.com/stremio-native/stremio-android/releases/download/v1.2.4/$file"               -o "tmp/$file"
            echo "$sha  tmp/$file" | sha256sum -c -
            unzip -p "tmp/$file" "lib/$abi/libstream_server.so" > "native/jniLibs/$abi/libstream_server.so"
            unzip -p "tmp/$file" "lib/$abi/libc++_shared.so" > "native/jniLibs/$abi/libc++_shared.so"
            test -s "native/jniLibs/$abi/libstream_server.so"
            test -s "native/jniLibs/$abi/libc++_shared.so"
          }
          extract_native arm64-v8a StremioMobile-v1.2.4-arm64-v8a-release.apk 3ffd96e6c6f0b23845f7ee6ab721d52ba1534055304959ed84c9589aac8bc97e
          extract_native armeabi-v7a StremioMobile-v1.2.4-armeabi-v7a-release.apk 519ab54a8a57e93c5a2f2a70cced18673063cffcb88cfdcd0ec6c9a7e5f5570e
          extract_native x86 StremioMobile-v1.2.4-x86-release.apk 201012b229914b533665f4c477140f174d7b933fdc27c1fae6a2fb3a1f232058
          extract_native x86_64 StremioMobile-v1.2.4-x86_64-release.apk bee94497864d46a3b7c1905848e161da03179ca4ff85c6808710cdd435cafc94
          curl --fail --location --retry 4             "https://raw.githubusercontent.com/stremio-native/stremio-android/4bdef3b6be1186d9aa22acd8b3ec391c22f0e083/app/libs/rustls-platform-verifier-0.1.1.aar"             -o native/libs/rustls-platform-verifier-0.1.1.aar
          test -s native/libs/rustls-platform-verifier-0.1.1.aar


      - uses: actions/upload-artifact@v4
        with:
          name: android-native-engine
          path: native/
          if-no-files-found: error

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Verify committed Windows icon
        shell: pwsh
        run: |
          if (-not (Test-Path 'windows\runner\resources\app_icon.ico')) { throw 'Windows app icon missing' }
          if ((Get-Item 'windows\runner\resources\app_icon.ico').Length -lt 10000) { throw 'Windows app icon looks invalid' }

      - name: Bundle local P2P engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = 'build\windows\x64\runner\Release'
          $url = 'https://github.com/stremio-native/stream-server/releases/download/v0.1.8/stream-server-windows-amd64.exe'
          $dest = Join-Path $releaseDir 'orvix-stream-server.exe'
          Invoke-WebRequest -Uri $url -OutFile $dest
          $expected = '90B7A14B282A9E649FBA5ADB6112C2C191DBA884EC762F8650F45CCF06E17E09'
          $actual = (Get-FileHash $dest -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "stream-server checksum mismatch: $actual" }
          $licenseDir = Join-Path $releaseDir 'licenses\stream-server'
          New-Item -ItemType Directory -Force -Path $licenseDir | Out-Null
          Copy-Item 'licenses\stream-server\LICENSE' (Join-Path $licenseDir 'LICENSE.txt')
          Copy-Item 'licenses\stream-server\NOTICE.md' (Join-Path $licenseDir 'NOTICE.md')

      - name: Smoke test Windows P2P engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Resolve-Path 'build\windows\x64\runner\Release\orvix-stream-server.exe'
          $work = Join-Path $env:RUNNER_TEMP 'orvix-stream-server-smoke'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $proc = Start-Process -FilePath $exe -ArgumentList '--no-tray' -WorkingDirectory $work -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $r = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:11470/heartbeat' -TimeoutSec 2
                if ($r.StatusCode -ge 200 -and $r.StatusCode -lt 300) { $ready = $true; break }
              } catch {}
              if ($proc.HasExited) { throw "stream-server exited early with code $($proc.ExitCode)" }
            }
            if (-not $ready) { throw 'stream-server heartbeat did not become ready' }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Pack portable build
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath 'Orvix-v0.7.5-beta.15-Windows-x64.zip' -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler was not found.' }
          & $iscc '/DMyAppVersion=0.7.5-beta.15' 'installer\orvix.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            Orvix-v0.7.5-beta.15-Windows-x64.zip
            installer-output/Orvix-Setup-v0.7.5-beta.15-Windows-x64.exe

  android-mobile:
    runs-on: ubuntu-latest
    needs: [validate, android-native]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.orvix --project-name orvix .

      - uses: actions/download-artifact@v4
        with:
          name: android-native-engine
          path: android-native

      - name: Configure Android mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          mkdir -p android/app/src/main/jniLibs android/app/libs
          cp -R android-native/jniLibs/. android/app/src/main/jniLibs/
          cp android-native/libs/rustls-platform-verifier-0.1.1.aar android/app/libs/
          python3 tools/configure_android_build.py
          python3 tools/configure_android_mobile_compat.py
          grep -q 'android:extractNativeLibs="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'useLegacyPackaging = true' android/app/build.gradle.kts
          grep -q 'orvix/torrent_engine' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt

      - name: Configure release signing
        env:
          ORVIX_ANDROID_KEYSTORE_B64: ${{ secrets.ORVIX_ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ORVIX_ANDROID_KEYSTORE_B64:-}"
          printf '%s' "$ORVIX_ANDROID_KEYSTORE_B64" | base64 --decode > android/app/orvix-release.jks
          test -s android/app/orvix-release.jks
          python3 tools/configure_android_signing.py

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android mobile APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Verify Android mobile APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" > /tmp/orvix-apk-list.txt
          grep -q 'lib/arm64-v8a/libstream_server.so' /tmp/orvix-apk-list.txt
          grep -q 'lib/armeabi-v7a/libstream_server.so' /tmp/orvix-apk-list.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Rename APKs
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Orvix-v0.7.5-beta.15-Android-Mobile.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Orvix-v0.7.5-beta.15-Android-Mobile-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk Orvix-v0.7.5-beta.15-Android-Mobile-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk Orvix-v0.7.5-beta.15-Android-Mobile-x86_64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-mobile
          path: |
            Orvix-v0.7.5-beta.15-Android-Mobile.apk
            Orvix-v0.7.5-beta.15-Android-Mobile-arm64-v8a.apk
            Orvix-v0.7.5-beta.15-Android-Mobile-armeabi-v7a.apk
            Orvix-v0.7.5-beta.15-Android-Mobile-x86_64.apk

  android-tv:
    runs-on: ubuntu-latest
    needs: [validate, android-native]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.orvix --project-name orvix .

      - uses: actions/download-artifact@v4
        with:
          name: android-native-engine
          path: android-native

      - name: Configure Android TV
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          mkdir -p android/app/src/main/jniLibs android/app/libs
          cp -R android-native/jniLibs/. android/app/src/main/jniLibs/
          cp android-native/libs/rustls-platform-verifier-0.1.1.aar android/app/libs/
          python3 tools/configure_android_build.py --tv
          python3 tools/configure_android_mobile_compat.py
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' android/app/src/main/AndroidManifest.xml
          grep -q 'android:screenOrientation="landscape"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:extractNativeLibs="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'orvix/torrent_engine' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt
          grep -q 'JniStreamingServerController.start' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt
          test ! -f android/app/src/main/kotlin/com/orvix/orvix/TorrentEngineService.kt
          if grep -q 'orvix/tv_native_player' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt; then
            echo 'Experimental native TV player bridge is still present.' >&2
            exit 1
          fi
          test ! -f android/app/src/main/kotlin/com/orvix/orvix/TvNativePlayerActivity.kt

      - name: Verify Android TV banner
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/src/main/res/drawable-xhdpi/tv_banner.png
          python3 - <<'PY'
          from PIL import Image
          image = Image.open("android/app/src/main/res/drawable-xhdpi/tv_banner.png")
          if image.size != (320, 180):
              raise SystemExit(f"Wrong TV banner size: {image.size}")
          PY

      - name: Configure release signing
        env:
          ORVIX_ANDROID_KEYSTORE_B64: ${{ secrets.ORVIX_ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ORVIX_ANDROID_KEYSTORE_B64:-}"
          printf '%s' "$ORVIX_ANDROID_KEYSTORE_B64" | base64 --decode > android/app/orvix-release.jks
          test -s android/app/orvix-release.jks
          python3 tools/configure_android_signing.py

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android TV APK
        run: flutter build apk --release --dart-define=ORVIX_TV=true

      - name: Verify Android TV APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" > /tmp/orvix-apk-list.txt
          grep -q 'lib/arm64-v8a/libstream_server.so' /tmp/orvix-apk-list.txt
          grep -q 'lib/armeabi-v7a/libstream_server.so' /tmp/orvix-apk-list.txt
          grep -q 'lib/arm64-v8a/libc++_shared.so' /tmp/orvix-apk-list.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Orvix-v0.7.5-beta.15-Android-TV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-tv
          path: Orvix-v0.7.5-beta.15-Android-TV.apk


  release:
    name: Publish v0.7.5-beta.15
    needs: [validate, windows, android-mobile, android-tv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist/windows

      - uses: actions/download-artifact@v4
        with:
          name: android-mobile
          path: dist/mobile

      - uses: actions/download-artifact@v4
        with:
          name: android-tv
          path: dist/tv

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/windows/Orvix-v0.7.5-beta.15-Windows-x64.zip
          test -s dist/windows/installer-output/Orvix-Setup-v0.7.5-beta.15-Windows-x64.exe
          test -s dist/mobile/Orvix-v0.7.5-beta.15-Android-Mobile.apk
          test -s dist/mobile/Orvix-v0.7.5-beta.15-Android-Mobile-arm64-v8a.apk
          test -s dist/mobile/Orvix-v0.7.5-beta.15-Android-Mobile-armeabi-v7a.apk
          test -s dist/mobile/Orvix-v0.7.5-beta.15-Android-Mobile-x86_64.apk
          test -s dist/tv/Orvix-v0.7.5-beta.15-Android-TV.apk

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/notes.md <<'EOF'
          Orvix v0.7.5-beta.15 is a cross-platform title-loading refresh with a major Windows UI redesign.

          Faster title opening on every platform:
          - Home now warms rich metadata for a broader part of the visible catalog instead of only two items per row.
          - Focus and Windows mouse-hover warm both rich metadata and the likely first playable source before navigation.
          - Search results use the same metadata/source warm-up path.
          - The app-level title opener reuses already-warmed rich MediaItem data from Home, Search, Library, Watchlist or Continue Watching instead of rendering a sparse object first.
          - Source-prefetch cache lifetime is extended from 45 seconds to five minutes so browse-time work survives normal navigation.
          - IMDb episode-rating pagination no longer blocks series metadata, cast, episode thumbnails or source prefetch; ratings enrich the in-memory cache in the background.

          Seasons and episode presentation:
          - Poster thumbnails are removed from season buttons on Windows, Android Mobile and Android TV.
          - Season selectors are compact text buttons inspired by Nuvio's text-season mode.
          - The selected season uses Orvix neon-lime (#B9FF45) with dark text; unselected seasons stay on dark surfaces with lime hover/focus feedback.
          - Windows series episodes now use cinematic horizontal thumbnail cards instead of the old full-width rows.

          Source picker behavior:
          - With no TorBox/debrid connection, Free P2P is selected by default.
          - When TorBox/debrid is connected, the normal Default source ordering is selected instead.
          - PikPak alone is treated as a cloud fallback, not as a debrid connection for this default-mode decision.
          - The visible “Best” label/badge is removed. Normal ordering is called Default; meaningful Pinned / Free P2P / Smooth state remains.
          - Windows source results use rounded dark cinematic cards and a larger desktop sheet.
          - The playability-first Free P2P ranking from beta.14 remains intact.

          Windows visual redesign:
          - New cinematic Home composition with a wide hero backdrop, strong side/bottom gradients, title logo support, dense metadata pills and neon-lime primary action.
          - New Windows poster shelves with hover preloading and cleaner spacing.
          - Continue Watching is now a landscape artwork rail with progress integrated into each card.
          - New desktop Details layout with a wide cinematic hero, compact actions, existing cast/details information and Nuvio-inspired season/episode rails.
          - Windows navigation rail is slimmer and icon-focused to leave more space for content.
          - The source picker has been restyled to match the same dark/lime visual family.

          Cross-platform behavior preserved:
          - Android TV keeps MPV-first Free P2P with safe Exo fallback from beta.14.
          - Android Mobile keeps its Android player routing.
          - Home back-navigation state preservation remains active.
          - Existing OpenSubtitles and AI Sinhala wiring remains unchanged.

          Validation before publishing:
          - Flutter analyze and complete Flutter test suite.
          - AI Sinhala and OpenSubtitles backend smoke tests.
          - Windows release build, local P2P engine smoke test and installer packaging.
          - Signed Android Mobile APKs with native P2P engine verification.
          - Signed Android TV APK with native P2P engine verification.

          This is a prerelease. The preload system removes avoidable UI/network waits, but a title that has never been warmed and whose upstream metadata/provider is slow can still require network time on the first ever access.
          EOF

          gh release create v0.7.5-beta.15             --target "${{ github.sha }}"             --title 'Orvix v0.7.5-beta.15 — Instant Titles + Desktop Refresh'             --prerelease             --notes-file /tmp/notes.md             dist/windows/Orvix-v0.7.5-beta.15-Windows-x64.zip             dist/windows/installer-output/Orvix-Setup-v0.7.5-beta.15-Windows-x64.exe             dist/mobile/Orvix-v0.7.5-beta.15-Android-Mobile.apk             dist/mobile/Orvix-v0.7.5-beta.15-Android-Mobile-arm64-v8a.apk             dist/mobile/Orvix-v0.7.5-beta.15-Android-Mobile-armeabi-v7a.apk             dist/mobile/Orvix-v0.7.5-beta.15-Android-Mobile-x86_64.apk             dist/tv/Orvix-v0.7.5-beta.15-Android-TV.apk
