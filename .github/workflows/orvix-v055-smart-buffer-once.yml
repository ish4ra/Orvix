name: Apply Orvix v0.5.5 Smart Buffer Once

on:
  push:
    branches:
      - orvix-v0.5.5-smart-buffer
    paths:
      - '.github/workflows/orvix-v055-smart-buffer-once.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: orvix-v0.5.5-smart-buffer
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/patch_v055.py

      - name: Remove temporary patch files
        shell: pwsh
        run: |
          git rm --ignore-unmatch .github/scripts/patch_v055.py .github/workflows/README-temp.txt .github/workflows/dummy3.txt

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner
        run: flutter create --platforms=windows --project-name orvix .

      - name: Restore pinned Windows icon unchanged
        shell: pwsh
        run: git checkout HEAD -- windows/runner/resources/app_icon.ico

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app sources
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Build Windows release
        run: flutter build windows --release

      - name: Commit validated v0.5.5 changes and remove helper
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/orvix-v055-smart-buffer-once.yml
          git add -A
          git commit -m "feat: smart buffering and compatibility source filter"
          git push origin HEAD:orvix-v0.5.5-smart-buffer
