name: Apply Orvix v0.5.5 Smart Buffer Once

on:
  push:
    branches:
      - orvix-v0.5.5-smart-buffer
    paths:
      - '.github/workflows/orvix-v055-smart-buffer-once.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: orvix-v0.5.5-smart-buffer
          fetch-depth: 0

      - name: Apply smart buffering and compatibility filter
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          p = Path('lib/services/playback_service.dart')
          p.write_text(r'''import 'package:media_kit/media_kit.dart';
          import 'package:media_kit_video/media_kit_video.dart';

          class PlaybackService {
            PlaybackService()
                : player = Player(
                    configuration: const PlayerConfiguration(
                      bufferSize: 512 * 1024 * 1024,
                    ),
                  ) {
              controller = VideoController(player);
            }

            final Player player;
            late final VideoController controller;

            Future<void> _applySmartStreamingProfile() async {
              final platform = player.platform;
              if (platform is! NativePlayer) return;

              const properties = <String, String>{
                'cache': 'yes',
                'demuxer-readahead-secs': '180',
                'cache-secs': '180',
                'network-timeout': '90',
                'stream-lavf-o':
                    'reconnect=1,reconnect_on_network_error=1,reconnect_on_http_error=5xx,reconnect_delay_max=10',
              };
              for (final entry in properties.entries) {
                try {
                  await platform.setProperty(
                    entry.key,
                    entry.value,
                    waitForInitialization: false,
                  );
                } catch (_) {
                  // An unsupported mpv/ffmpeg option must never block playback.
                }
              }
            }

            Future<void> open(
              String url, {
              String? title,
              Map<String, String>? httpHeaders,
            }) async {
              await _applySmartStreamingProfile();
              await player.open(
                Media(
                  url,
                  httpHeaders: httpHeaders,
                  extras: {
                    if (title != null) 'title': title,
                  },
                ),
                play: true,
              );
            }

            Future<void> stop() => player.stop();

            Future<void> dispose() => player.dispose();
          }
          '''.replace('          ', ''), encoding='utf-8')

          p = Path('lib/services/source_provider_service.dart')
          s = p.read_text(encoding='utf-8')
          marker = '''  String? get sizeLabel {\n'''
          insert = r'''  int get compatibilityRisk {
            final text = '$title ${fileNameHint ?? ''}'.toLowerCase();
            var risk = 0;

            // File size is intentionally NOT a compatibility signal. Very large
            // remuxes can still be excellent when the stream path is healthy.
            if (RegExp(r'(^|[\s._\-\[(])(8k|4320p)(?=$|[\s._\-\])])')
                .hasMatch(text)) {
              risk += 100;
            }
            if (RegExp(r'(^|[\s._\-\[(])(av1|av01)(?=$|[\s._\-\])])')
                .hasMatch(text)) {
              risk += 45;
            }
            if (RegExp(
              r'(^|[\s._\-\[(])(hi10p|h\.?264[ ._-]?10bit|avc[ ._-]?10bit)(?=$|[\s._\-\])])',
            ).hasMatch(text)) {
              risk += 40;
            }

            final hasDolbyVision = RegExp(
              r'(^|[\s._\-\[(])(dovi|dolby[ ._-]?vision|dv)(?=$|[\s._\-\])])',
            ).hasMatch(text);
            final hasHdrFallback = RegExp(
              r'(^|[\s._\-\[(])(hdr10\+?|hdr)(?=$|[\s._\-\])])',
            ).hasMatch(text);
            if (hasDolbyVision && !hasHdrFallback) risk += 30;

            return risk;
          }

          bool get compatibilityFriendly => compatibilityRisk == 0;

          String get compatibilityLabel =>
              compatibilityFriendly ? 'Compatible' : 'Compatibility risk';

'''
          if insert.strip() not in s:
              if marker not in s:
                  raise SystemExit('SourceResult sizeLabel marker not found')
              s = s.replace(marker, insert + marker, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('lib/screens/details_screen.dart')
          s = p.read_text(encoding='utf-8')
          old = '''  Future<SourceResult?> _chooseSource(List<SourceResult> results) async {\n    var priority = await widget.sources.getPriorityOrder();\n    if (!mounted) return null;\n'''
          new = '''  Future<SourceResult?> _chooseSource(List<SourceResult> results) async {\n    var priority = await widget.sources.getPriorityOrder();\n    var compatibilityOnly = false;\n    if (!mounted) return null;\n'''
          if old not in s:
              raise SystemExit('chooseSource header marker not found')
          s = s.replace(old, new, 1)

          old = '''          final sorted = widget.sources.sortResults(results, priority);\n          final best = sorted.isEmpty ? null : sorted.first;\n          final color = Theme.of(context).colorScheme;\n          final priorityText = priority.map((e) => e.label.toLowerCase()).join(' → ');\n'''
          new = '''          final ranked = widget.sources.sortResults(results, priority);\n          final sorted = compatibilityOnly\n              ? ranked.where((result) => result.compatibilityFriendly).toList(growable: false)\n              : ranked;\n          final hiddenCount = ranked.length - sorted.length;\n          final best = sorted.isEmpty ? null : sorted.first;\n          final color = Theme.of(context).colorScheme;\n          final priorityText = priority.map((e) => e.label.toLowerCase()).join(' → ');\n'''
          if old not in s:
              raise SystemExit('source picker sort marker not found')
          s = s.replace(old, new, 1)

          old = '''                                '${results.length} result${results.length == 1 ? '' : 's'} returned • showing all',\n'''
          new = '''                                compatibilityOnly\n                                    ? '${sorted.length} compatible result${sorted.length == 1 ? '' : 's'}${hiddenCount > 0 ? ' • $hiddenCount risky hidden' : ''}'\n                                    : '${results.length} result${results.length == 1 ? '' : 's'} returned • showing all',\n'''
          if old not in s:
              raise SystemExit('source picker count marker not found')
          s = s.replace(old, new, 1)

          old = '''                        OutlinedButton.icon(\n                          onPressed: () => customizePriority(sheetContext, setSheetState),\n                          icon: const Icon(Icons.tune_rounded),\n                          label: const Text('Sort priority'),\n                        ),\n                        const SizedBox(width: 10),\n'''
          new = '''                        FilterChip(\n                          selected: compatibilityOnly,\n                          avatar: Icon(\n                            compatibilityOnly\n                                ? Icons.verified_rounded\n                                : Icons.verified_outlined,\n                            size: 18,\n                          ),\n                          label: const Text('Compatibility'),\n                          tooltip: 'Hide known-risk formats such as AV1, 8K, Hi10P and Dolby Vision-only releases. File size is not used.',\n                          onSelected: (value) =>\n                              setSheetState(() => compatibilityOnly = value),\n                        ),\n                        const SizedBox(width: 10),\n                        OutlinedButton.icon(\n                          onPressed: () => customizePriority(sheetContext, setSheetState),\n                          icon: const Icon(Icons.tune_rounded),\n                          label: const Text('Sort priority'),\n                        ),\n                        const SizedBox(width: 10),\n'''
          if old not in s:
              raise SystemExit('source picker sort button marker not found')
          s = s.replace(old, new, 1)

          old = '''                            subtitle: Padding(\n                              padding: const EdgeInsets.only(top: 4),\n                              child: Text(\n                                '${result.provider}${result.isMagnet ? ' • cloud source' : ' • direct URL'}',\n                              ),\n                            ),\n'''
          new = '''                            subtitle: Padding(\n                              padding: const EdgeInsets.only(top: 4),\n                              child: Text(\n                                '${result.provider}${result.isMagnet ? ' • cloud source' : ' • direct URL'}${result.compatibilityFriendly ? '' : ' • ⚠ compatibility risk'}',\n                              ),\n                            ),\n'''
          if old not in s:
              raise SystemExit('source picker subtitle marker not found')
          s = s.replace(old, new, 1)

          old = '''                    const SizedBox(height: 12),\n                    const Divider(height: 1),\n                    Expanded(\n                      child: ListView.separated(\n'''
          new = '''                    const SizedBox(height: 12),\n                    const Divider(height: 1),\n                    Expanded(\n                      child: sorted.isEmpty\n                          ? Center(\n                              child: Column(\n                                mainAxisSize: MainAxisSize.min,\n                                children: [\n                                  const Icon(Icons.shield_outlined, size: 38),\n                                  const SizedBox(height: 10),\n                                  const Text(\n                                    'No compatibility-safe sources matched this filter.',\n                                    style: TextStyle(fontWeight: FontWeight.w800),\n                                  ),\n                                  const SizedBox(height: 8),\n                                  TextButton(\n                                    onPressed: () => setSheetState(\n                                      () => compatibilityOnly = false,\n                                    ),\n                                    child: const Text('Show all sources'),\n                                  ),\n                                ],\n                              ),\n                            )\n                          : ListView.separated(\n'''
          if old not in s:
              raise SystemExit('source picker list marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('lib/screens/player_screen.dart')
          s = p.read_text(encoding='utf-8')
          old = '''                          SliderTheme(\n                            data: SliderTheme.of(context).copyWith(\n                              trackHeight: 3.5,\n                              thumbShape: const RoundSliderThumbShape(enabledThumbRadius: 6),\n                            ),\n                            child: Slider(\n                              value: actualMs,\n                              max: maxMs,\n                              onChangeStart: (_) {\n                                _hideTimer?.cancel();\n                                setState(() => _seeking = true);\n                              },\n                              onChanged: (value) => setState(() => _seekPreviewMs = value),\n                              onChangeEnd: (value) async {\n                                await player.seek(Duration(milliseconds: value.round()));\n                                if (!mounted) return;\n                                setState(() {\n                                  _seeking = false;\n                                  _seekPreviewMs = null;\n                                });\n                                _scheduleHide();\n                              },\n                            ),\n                          ),\n'''
          new = '''                          StreamBuilder<Duration>(\n                            stream: player.stream.buffer,\n                            initialData: player.state.buffer,\n                            builder: (context, bufferSnapshot) {\n                              final bufferedMs = (bufferSnapshot.data ?? Duration.zero)\n                                  .inMilliseconds\n                                  .toDouble()\n                                  .clamp(actualMs, maxMs)\n                                  .toDouble();\n                              return SliderTheme(\n                                data: SliderTheme.of(context).copyWith(\n                                  trackHeight: 3.5,\n                                  thumbShape: const RoundSliderThumbShape(enabledThumbRadius: 6),\n                                ),\n                                child: Slider(\n                                  value: actualMs,\n                                  max: maxMs,\n                                  secondaryTrackValue: bufferedMs,\n                                  onChangeStart: (_) {\n                                    _hideTimer?.cancel();\n                                    setState(() => _seeking = true);\n                                  },\n                                  onChanged: (value) => setState(() => _seekPreviewMs = value),\n                                  onChangeEnd: (value) async {\n                                    await player.seek(Duration(milliseconds: value.round()));\n                                    if (!mounted) return;\n                                    setState(() {\n                                      _seeking = false;\n                                      _seekPreviewMs = null;\n                                    });\n                                    _scheduleHide();\n                                  },\n                                ),\n                              );\n                            },\n                          ),\n'''
          if old not in s:
              raise SystemExit('player slider marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('pubspec.yaml')
          s = p.read_text(encoding='utf-8')
          if 'version: 0.5.4+24' not in s:
              raise SystemExit('unexpected pubspec version')
          p.write_text(s.replace('version: 0.5.4+24', 'version: 0.5.5+25', 1), encoding='utf-8')

          p = Path('installer/orvix.iss')
          s = p.read_text(encoding='utf-8')
          p.write_text(s.replace('#define MyAppVersion "0.5.4"', '#define MyAppVersion "0.5.5"', 1), encoding='utf-8')
          '@ | Set-Content -Path patch_v055.py -Encoding UTF8
          python patch_v055.py
          Remove-Item patch_v055.py

      - name: Remove inherited temporary markers
        shell: pwsh
        run: |
          git rm --ignore-unmatch .github/workflows/README-temp.txt .github/workflows/dummy3.txt

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner
        shell: pwsh
        run: flutter create --platforms=windows --project-name orvix .

      - name: Restore pinned Windows icon unchanged
        shell: pwsh
        run: git checkout HEAD -- windows/runner/resources/app_icon.ico

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app sources
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Build Windows release
        run: flutter build windows --release

      - name: Commit validated v0.5.5 changes and remove helper
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/orvix-v055-smart-buffer-once.yml
          git add -A
          git commit -m "feat: smart buffering and compatibility source filter"
          git push origin HEAD:orvix-v0.5.5-smart-buffer
