name: Apply AI Sinhala subtitle player patch once

on:
  push:
    branches:
      - orvix-v0.7.0-ai-sinhala
    paths:
      - '.github/workflows/ai-sinhala-patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: orvix-v0.7.0-ai-sinhala

      - name: Patch player and enable feature-branch build
        shell: python
        run: |
          from pathlib import Path

          player_path = Path('lib/screens/player_screen.dart')
          text = player_path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "import '../services/media_state_service.dart';\nimport '../services/playback_service.dart';",
              "import '../services/ai_sinhala_subtitle_service.dart';\nimport '../services/media_state_service.dart';\nimport '../services/playback_service.dart';",
              'AI service import',
          )

          replace_once(
              "  StreamSubscription<bool>? _completedSubscription;\n  final FocusNode _focusNode = FocusNode();",
              "  StreamSubscription<bool>? _completedSubscription;\n  StreamSubscription<List<String>>? _subtitleSubscription;\n  final FocusNode _focusNode = FocusNode();\n  final List<String> _subtitleContext = <String>[];\n  bool _aiSinhalaEnabled = false;\n  bool _aiSubtitleBusy = false;\n  String _sourceSubtitle = '';\n  String _aiDisplaySubtitle = '';\n  String? _aiSubtitleError;\n  int _subtitleRequestSerial = 0;",
              'AI state',
          )

          replace_once(
              "    super.initState();\n    _open();",
              "    super.initState();\n    _subtitleSubscription = widget.playback.player.stream.subtitle.listen(_onSubtitleCue);\n    _open();",
              'subtitle listener',
          )

          marker = "  Future<void> _pickExternalSubtitle() async {"
          if text.count(marker) != 1:
              raise SystemExit('subtitle method marker not unique')

          ai_methods = r'''  void _onSubtitleCue(List<String> lines) {
            final source = lines
                .map((line) => line.trim())
                .where((line) => line.isNotEmpty)
                .join('\n')
                .trim();
            _sourceSubtitle = source;

            if (!_aiSinhalaEnabled) return;

            final serial = ++_subtitleRequestSerial;
            if (source.isEmpty) {
              if (mounted) {
                setState(() {
                  _aiDisplaySubtitle = '';
                  _aiSubtitleBusy = false;
                  _aiSubtitleError = null;
                });
              }
              return;
            }

            if (mounted) {
              setState(() {
                // Show the original cue immediately so slow AI never leaves a gap.
                _aiDisplaySubtitle = source;
                _aiSubtitleBusy = true;
                _aiSubtitleError = null;
              });
            }
            _translateSubtitleCue(source, serial);
          }

          Future<void> _translateSubtitleCue(String source, int serial) async {
            try {
              final translated = await AiSinhalaSubtitleService.translate(
                text: source,
                title: widget.title,
                context: List<String>.unmodifiable(_subtitleContext),
              );
              if (!mounted ||
                  !_aiSinhalaEnabled ||
                  serial != _subtitleRequestSerial ||
                  _sourceSubtitle != source) {
                return;
              }
              setState(() {
                _aiDisplaySubtitle = translated;
                _aiSubtitleBusy = false;
                _aiSubtitleError = null;
              });
              _subtitleContext.add(source);
              if (_subtitleContext.length > 6) {
                _subtitleContext.removeRange(0, _subtitleContext.length - 6);
              }
            } on AiSubtitleException catch (error) {
              if (!mounted || serial != _subtitleRequestSerial) return;
              setState(() {
                _aiDisplaySubtitle = source;
                _aiSubtitleBusy = false;
                _aiSubtitleError = error.message;
              });
            } catch (_) {
              if (!mounted || serial != _subtitleRequestSerial) return;
              setState(() {
                _aiDisplaySubtitle = source;
                _aiSubtitleBusy = false;
                _aiSubtitleError = 'AI translation unavailable — showing the original subtitle.';
              });
            }
          }

          Future<void> _setAiSinhala(bool enabled) async {
            final player = widget.playback.player;
            if (enabled) {
              if (!AiSinhalaSubtitleService.canTranslate) {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(
                      content: Text('Sign in to your Orvix account to use Sinhala (AI Beta).'),
                    ),
                  );
                }
                return;
              }
              if (player.state.track.subtitle.id.toLowerCase() == 'no') {
                if (mounted) {
                  ScaffoldMessenger.of(context).showSnackBar(
                    const SnackBar(
                      content: Text('Select an English/text subtitle track first, then enable Sinhala (AI Beta).'),
                    ),
                  );
                }
                return;
              }
              AiSinhalaSubtitleService.clearSessionCache();
              _subtitleContext.clear();
              if (mounted) {
                setState(() {
                  _aiSinhalaEnabled = true;
                  _aiSubtitleError = null;
                });
              }
              _onSubtitleCue(player.state.subtitle);
            } else {
              ++_subtitleRequestSerial;
              if (mounted) {
                setState(() {
                  _aiSinhalaEnabled = false;
                  _aiSubtitleBusy = false;
                  _aiDisplaySubtitle = '';
                  _aiSubtitleError = null;
                });
              }
              _subtitleContext.clear();
            }
            _scheduleHide();
          }

          Widget _aiSubtitleOverlay() {
            final error = _aiSubtitleError;
            return AnimatedPositioned(
              duration: const Duration(milliseconds: 180),
              curve: Curves.easeOut,
              left: 40,
              right: 40,
              bottom: _controlsVisible ? 122 : 30,
              child: IgnorePointer(
                child: Center(
                  child: ConstrainedBox(
                    constraints: const BoxConstraints(maxWidth: 980),
                    child: DecoratedBox(
                      decoration: BoxDecoration(
                        color: const Color(0xD9000000),
                        borderRadius: BorderRadius.circular(12),
                        border: Border.all(color: const Color(0x44FFFFFF)),
                        boxShadow: const [
                          BoxShadow(color: Color(0x99000000), blurRadius: 18, offset: Offset(0, 4)),
                        ],
                      ),
                      child: Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 18, vertical: 11),
                        child: Column(
                          mainAxisSize: MainAxisSize.min,
                          children: [
                            Row(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                const Icon(Icons.auto_awesome_rounded, size: 14, color: Color(0xFFFFB45B)),
                                const SizedBox(width: 6),
                                const Text(
                                  'සිංහල • AI Beta',
                                  style: TextStyle(fontSize: 11, fontWeight: FontWeight.w800, color: Color(0xFFFFD5A0)),
                                ),
                                if (_aiSubtitleBusy) ...[
                                  const SizedBox(width: 8),
                                  const SizedBox(
                                    width: 11,
                                    height: 11,
                                    child: CircularProgressIndicator(strokeWidth: 1.6),
                                  ),
                                ],
                              ],
                            ),
                            const SizedBox(height: 5),
                            Text(
                              _aiDisplaySubtitle,
                              textAlign: TextAlign.center,
                              style: const TextStyle(
                                color: Colors.white,
                                fontSize: 27,
                                height: 1.35,
                                fontWeight: FontWeight.w700,
                                shadows: [Shadow(color: Colors.black, blurRadius: 8)],
                              ),
                            ),
                            if (error != null && error.isNotEmpty) ...[
                              const SizedBox(height: 5),
                              Text(
                                error,
                                textAlign: TextAlign.center,
                                style: const TextStyle(fontSize: 10.5, color: Color(0xFFFFB4AB)),
                              ),
                            ],
                          ],
                        ),
                      ),
                    ),
                  ),
                ),
              ),
            );
          }

'''
          # Normalize indentation from the raw block above.
          ai_methods = '\n'.join(line[10:] if line.startswith('          ') else line for line in ai_methods.splitlines()) + '\n'
          text = text.replace(marker, ai_methods + marker, 1)

          subtitle_heading = """                const SizedBox(height: 8),
                _TrackTile(
                  title: 'Off',"""
          ai_toggle = """                const SizedBox(height: 8),
                Container(
                  decoration: BoxDecoration(
                    color: const Color(0x331F7A4D),
                    borderRadius: BorderRadius.circular(14),
                    border: Border.all(color: const Color(0x5544D28A)),
                  ),
                  child: SwitchListTile.adaptive(
                    value: _aiSinhalaEnabled,
                    secondary: const Icon(Icons.auto_awesome_rounded),
                    title: const Text(
                      'Sinhala (AI Beta)',
                      style: TextStyle(fontWeight: FontWeight.w800),
                    ),
                    subtitle: const Text(
                      'Translate the selected text subtitle to natural Sri Lankan Sinhala. Requires Orvix sign-in + internet.',
                    ),
                    onChanged: (value) async {
                      Navigator.pop(sheetContext);
                      await _setAiSinhala(value);
                    },
                  ),
                ),
                const SizedBox(height: 8),
                _TrackTile(
                  title: 'Off',"""
          if text.count(subtitle_heading) != 1:
              raise SystemExit(f'AI toggle insertion expected one match, found {text.count(subtitle_heading)}')
          text = text.replace(subtitle_heading, ai_toggle, 1)

          off_tap = """                  onTap: () async {
                    await player.setSubtitleTrack(mk.SubtitleTrack.no());
                    if (sheetContext.mounted) Navigator.pop(sheetContext);
                  },"""
          off_tap_new = """                  onTap: () async {
                    if (_aiSinhalaEnabled) await _setAiSinhala(false);
                    await player.setSubtitleTrack(mk.SubtitleTrack.no());
                    if (sheetContext.mounted) Navigator.pop(sheetContext);
                  },"""
          if text.count(off_tap) != 1:
              raise SystemExit(f'Off subtitle handler expected one match, found {text.count(off_tap)}')
          text = text.replace(off_tap, off_tap_new, 1)

          replace_once(
              "                    fit: BoxFit.contain,\n                    controls: NoVideoControls,",
              "                    fit: BoxFit.contain,\n                    controls: NoVideoControls,\n                    subtitleViewConfiguration: SubtitleViewConfiguration(\n                      visible: !_aiSinhalaEnabled,\n                    ),",
              'hide native subtitles during AI mode',
          )

          overlay_marker = """                AnimatedOpacity(
                  opacity: _controlsVisible ? 1 : 0,"""
          overlay_new = """                if (_aiSinhalaEnabled && _aiDisplaySubtitle.isNotEmpty)
                  _aiSubtitleOverlay(),
                AnimatedOpacity(
                  opacity: _controlsVisible ? 1 : 0,"""
          if text.count(overlay_marker) != 1:
              raise SystemExit(f'overlay marker expected one match, found {text.count(overlay_marker)}')
          text = text.replace(overlay_marker, overlay_new, 1)

          replace_once(
              "    _completedSubscription?.cancel();\n    _persistProgress();",
              "    _completedSubscription?.cancel();\n    _subtitleSubscription?.cancel();\n    ++_subtitleRequestSerial;\n    _persistProgress();",
              'dispose subtitle listener',
          )

          player_path.write_text(text, encoding='utf-8')

          pubspec = Path('pubspec.yaml')
          pub = pubspec.read_text(encoding='utf-8')
          old_version = 'version: 0.6.2+32'
          if old_version in pub:
              pub = pub.replace(old_version, 'version: 0.7.0+33', 1)
          elif 'version: 0.7.0+33' not in pub:
              raise SystemExit('Unexpected pubspec version')
          pubspec.write_text(pub, encoding='utf-8')

          build = Path('.github/workflows/build-flutter-windows.yml')
          workflow = build.read_text(encoding='utf-8')
          branch_line = '      - orvix-v0.7.0-ai-sinhala\n'
          if branch_line not in workflow:
              anchor = '      - orvix-v0.6.0-cloud-sync\n'
              if anchor not in workflow:
                  raise SystemExit('Build workflow branch anchor not found')
              workflow = workflow.replace(anchor, anchor + branch_line, 1)
          build.write_text(workflow, encoding='utf-8')

          placeholder = Path('docs/.branch-placeholder')
          if placeholder.exists():
              placeholder.unlink()

      - name: Remove one-time patch workflow
        shell: bash
        run: rm -f .github/workflows/ai-sinhala-patch-once.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add live AI Sinhala subtitles to player"
          git push origin HEAD:orvix-v0.7.0-ai-sinhala
