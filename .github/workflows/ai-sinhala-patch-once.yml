name: Apply AI Sinhala subtitle player patch once

on:
  push:
    branches:
      - orvix-v0.7.0-ai-sinhala
    paths:
      - '.github/workflows/ai-sinhala-patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: orvix-v0.7.0-ai-sinhala

      - name: Apply player patch
        run: |
          python3 tools/apply_ai_sinhala_patch.py
          git checkout -- .github/workflows/build-flutter-windows.yml

      - name: Commit player changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/player_screen.dart pubspec.yaml
          if [ -e docs/.branch-placeholder ]; then
            git add docs/.branch-placeholder
          else
            git add -u docs/.branch-placeholder
          fi
          git commit -m "feat: add live AI Sinhala subtitles to player"
          git push origin HEAD:orvix-v0.7.0-ai-sinhala
