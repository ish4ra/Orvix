name: Apply AI Sinhala subtitle player patch once

on:
  push:
    branches:
      - orvix-v0.7.0-ai-sinhala
    paths:
      - '.github/workflows/ai-sinhala-patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: orvix-v0.7.0-ai-sinhala

      - name: Apply patch
        run: python3 tools/apply_ai_sinhala_patch.py

      - name: Remove one-time helpers
        run: |
          rm -f .github/workflows/ai-sinhala-patch-once.yml
          rm -f tools/apply_ai_sinhala_patch.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add live AI Sinhala subtitles to player"
          git push origin HEAD:orvix-v0.7.0-ai-sinhala
