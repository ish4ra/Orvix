name: Apply Orvix v0.5.6 Smooth Ranking Once

on:
  push:
    branches:
      - orvix-v0.5.6-smooth-ranking
    paths:
      - '.github/scripts/apply_v056_smooth_ranking.py'
      - '.github/workflows/orvix-v056-smooth-ranking-once.yml'

permissions:
  contents: write

jobs:
  patch-validate-tag:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: orvix-v0.5.6-smooth-ranking
          fetch-depth: 0

      - name: Preserve manually fixed Windows icon hash
        shell: pwsh
        run: |
          $icon = 'windows\runner\resources\app_icon.ico'
          if (-not (Test-Path $icon)) { throw 'Orvix Windows icon is missing.' }
          $hash = (Get-FileHash $icon -Algorithm SHA256).Hash
          "ORVIX_ICON_HASH=$hash" >> $env:GITHUB_ENV

      - name: Apply smooth source ranking
        run: python .github/scripts/apply_v056_smooth_ranking.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format changed Dart files
        shell: pwsh
        run: dart format lib\services\source_provider_service.dart lib\screens\details_screen.dart

      - name: Check patch whitespace
        shell: pwsh
        run: git diff --check

      - name: Clean old build artifacts
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app sources
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Build Windows release
        run: flutter build windows --release

      - name: Verify manually fixed icon stayed byte-identical
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'windows\runner\resources\app_icon.ico' -Algorithm SHA256).Hash
          if ($hash -ne $env:ORVIX_ICON_HASH) { throw 'Windows icon changed unexpectedly.' }

      - name: Commit validated feature and remove one-time helpers
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/source_provider_service.dart lib/screens/details_screen.dart CHANGELOG.md
          git rm .github/scripts/apply_v056_smooth_ranking.py .github/workflows/orvix-v056-smooth-ranking-once.yml
          git commit -m "feat: add smooth playback source ranking"
          git push origin HEAD:orvix-v0.5.6-smooth-ranking

      - name: Tag v0.5.6
        shell: pwsh
        run: |
          git tag v0.5.6
          git push origin v0.5.6
