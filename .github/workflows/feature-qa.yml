name: Orvix feature QA

on:
  push:
    branches:
      - feature/tv-qr-login
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orvix-feature-qa
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze + full regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos
      - name: Test media engine
        run: |
          cd tools/orvix-media-engine
          go test ./...
      - name: Run full Flutter regression suite
        run: flutter test
