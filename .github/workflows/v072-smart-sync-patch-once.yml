name: Patch and Build Orvix v0.7.2 Smart Subtitle Sync

on:
  push:
    branches:
      - orvix-v0.7.2-smart-sub-sync
    paths:
      - '.github/workflows/v072-smart-sync-patch-once.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: orvix-v0.7.2-smart-sub-sync

      - name: Apply smart sync source patch
        run: python tools/v072_smart_sync_patch.py

      - name: Commit smart sync patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib pubspec.yaml
          git commit -m "feat: add exact-match and automatic AI subtitle sync"
          git push origin HEAD:orvix-v0.7.2-smart-sub-sync

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preserve pinned Orvix icon hash
        shell: pwsh
        run: |
          $icon = 'windows\runner\resources\app_icon.ico'
          if (-not (Test-Path $icon)) { throw 'Pinned Orvix app icon is missing.' }
          $hash = (Get-FileHash $icon -Algorithm SHA256).Hash
          "ORVIX_ICON_HASH=$hash" >> $env:GITHUB_ENV

      - name: Generate Windows runner
        shell: pwsh
        run: flutter create --platforms=windows --project-name orvix .

      - name: Restore exact pinned Orvix icon
        shell: pwsh
        run: |
          git checkout HEAD -- windows/runner/resources/app_icon.ico
          $hash = (Get-FileHash 'windows\runner\resources\app_icon.ico' -Algorithm SHA256).Hash
          if ($hash -ne $env:ORVIX_ICON_HASH) { throw 'Orvix icon changed during Flutter runner generation.' }

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app sources
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Build Windows release
        run: flutter build windows --release

      - name: Pack candidate
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "Orvix-v0.7.2-smart-sync-candidate-Windows-x64.zip" -Force

      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: Orvix-v0.7.2-smart-sync-candidate-Windows-x64
          path: Orvix-v0.7.2-smart-sync-candidate-Windows-x64.zip
          if-no-files-found: error
