name: Release Orvix v0.7.5-beta.12 — P2P Engine Parity

on:
  push:
    branches:
      - orvix-v0.7.5-dev
    paths:
      - '.github/workflows/orvix-v075-beta12-p2p-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orvix-v075-beta12-android-release
  cancel-in-progress: true

jobs:
  validate:
    name: Validate dual-engine code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Run tests
        run: flutter test

  android-native:
    name: Prepare Android P2P engine
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned Stremio native stream-server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/jniLibs/{armeabi-v7a,arm64-v8a,x86,x86_64} native/libs tmp

          extract_native() {
            abi="$1"
            file="$2"
            sha="$3"
            curl --fail --location --retry 4 --retry-delay 2 \
              "https://github.com/stremio-native/stremio-android/releases/download/v1.2.4/$file" \
              -o "tmp/$file"
            echo "$sha  tmp/$file" | sha256sum -c -
            unzip -p "tmp/$file" "lib/$abi/libstream_server.so" > "native/jniLibs/$abi/libstream_server.so"
            unzip -p "tmp/$file" "lib/$abi/libc++_shared.so" > "native/jniLibs/$abi/libc++_shared.so"
            test -s "native/jniLibs/$abi/libstream_server.so"
            test -s "native/jniLibs/$abi/libc++_shared.so"
          }

          extract_native arm64-v8a StremioMobile-v1.2.4-arm64-v8a-release.apk 3ffd96e6c6f0b23845f7ee6ab721d52ba1534055304959ed84c9589aac8bc97e
          extract_native armeabi-v7a StremioMobile-v1.2.4-armeabi-v7a-release.apk 519ab54a8a57e93c5a2f2a70cced18673063cffcb88cfdcd0ec6c9a7e5f5570e
          extract_native x86 StremioMobile-v1.2.4-x86-release.apk 201012b229914b533665f4c477140f174d7b933fdc27c1fae6a2fb3a1f232058
          extract_native x86_64 StremioMobile-v1.2.4-x86_64-release.apk bee94497864d46a3b7c1905848e161da03179ca4ff85c6808710cdd435cafc94

          curl --fail --location --retry 4 \
            "https://raw.githubusercontent.com/stremio-native/stremio-android/4bdef3b6be1186d9aa22acd8b3ec391c22f0e083/app/libs/rustls-platform-verifier-0.1.1.aar" \
            -o native/libs/rustls-platform-verifier-0.1.1.aar
          test -s native/libs/rustls-platform-verifier-0.1.1.aar

      - uses: actions/upload-artifact@v4
        with:
          name: beta12-android-native
          path: native/
          if-no-files-found: error

  android-mobile:
    name: Build Android Mobile beta.12
    needs: [validate, android-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.orvix --project-name orvix .

      - uses: actions/download-artifact@v4
        with:
          name: beta12-android-native
          path: android-native

      - name: Configure Android mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          mkdir -p android/app/src/main/jniLibs android/app/libs
          cp -R android-native/jniLibs/. android/app/src/main/jniLibs/
          cp android-native/libs/rustls-platform-verifier-0.1.1.aar android/app/libs/
          python3 tools/configure_android_build.py
          python3 tools/configure_android_mobile_compat.py
          grep -q 'android:extractNativeLibs="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'orvix/torrent_engine' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt

      - name: Configure release signing
        env:
          ORVIX_ANDROID_KEYSTORE_B64: ${{ secrets.ORVIX_ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ORVIX_ANDROID_KEYSTORE_B64:-}"
          printf '%s' "$ORVIX_ANDROID_KEYSTORE_B64" | base64 --decode > android/app/orvix-release.jks
          python3 tools/configure_android_signing.py

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android mobile APK
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter build apk --release --build-name=0.7.5-beta.12 --build-number=83; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Transient Android dependency/network failure. Retrying mobile build in $((attempt * 30))s..."
            sleep $((attempt * 30))
          done

      - name: Verify Android mobile APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" > /tmp/mobile-list.txt
          grep -q 'lib/arm64-v8a/libstream_server.so' /tmp/mobile-list.txt
          grep -q 'lib/armeabi-v7a/libstream_server.so' /tmp/mobile-list.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Orvix-v0.7.5-beta.12-Android-Mobile.apk

      - uses: actions/upload-artifact@v4
        with:
          name: beta12-android-mobile
          path: Orvix-v0.7.5-beta.12-Android-Mobile.apk
          if-no-files-found: error

  android-tv:
    name: Build Android TV beta.12
    needs: [validate, android-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.orvix --project-name orvix .

      - uses: actions/download-artifact@v4
        with:
          name: beta12-android-native
          path: android-native

      - name: Configure Android TV
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          mkdir -p android/app/src/main/jniLibs android/app/libs
          cp -R android-native/jniLibs/. android/app/src/main/jniLibs/
          cp android-native/libs/rustls-platform-verifier-0.1.1.aar android/app/libs/
          python3 tools/configure_android_build.py --tv
          python3 tools/configure_android_mobile_compat.py
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' android/app/src/main/AndroidManifest.xml
          grep -q 'android:screenOrientation="landscape"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:extractNativeLibs="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'orvix/torrent_engine' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt

      - name: Configure release signing
        env:
          ORVIX_ANDROID_KEYSTORE_B64: ${{ secrets.ORVIX_ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ORVIX_ANDROID_KEYSTORE_B64:-}"
          printf '%s' "$ORVIX_ANDROID_KEYSTORE_B64" | base64 --decode > android/app/orvix-release.jks
          python3 tools/configure_android_signing.py

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android TV APK
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if flutter build apk --release --dart-define=ORVIX_TV=true --build-name=0.7.5-beta.12 --build-number=83; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "Transient Android dependency/network failure. Retrying TV build in $((attempt * 30))s..."
            sleep $((attempt * 30))
          done

      - name: Verify Android TV APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" > /tmp/tv-list.txt
          grep -q 'lib/arm64-v8a/libstream_server.so' /tmp/tv-list.txt
          grep -q 'lib/armeabi-v7a/libstream_server.so' /tmp/tv-list.txt
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Orvix-v0.7.5-beta.12-Android-TV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: beta12-android-tv
          path: Orvix-v0.7.5-beta.12-Android-TV.apk
          if-no-files-found: error

  release:
    name: Publish beta.12
    needs: [android-mobile, android-tv]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: beta12-android-mobile
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: beta12-android-tv
          path: release

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/notes.md <<'EOF'
          Orvix v0.7.5-beta.12 is a focused Android P2P reliability test release.

          P2P transport:
          - Keeps the pinned Stremio native stream-server v1.2.4 transport on Android.
          - Strips Orvix-only cloud metadata parameters before handing a magnet to the native torrent engine.
          - Preserves provider trackers and supplements them with the same small public fallback tracker set used by Nuvio.
          - Supplies explicit DHT + tracker peer-search sources to the local stream server.
          - Enables DHT, PeX and LSD explicitly, keeps unlimited torrent download speed, and uses Stremio-compatible handshake/request timing.
          - Android TV uses Stremio's 500-connection Fast profile; Android mobile stays on the 200-connection Balanced profile.
          - Android TV primes the first local HTTP range before opening the player so the swarm has a short pre-buffer window.

          Player routing:
          - Auto mode now tries ExoPlayer first for Android local P2P HTTP streams, matching the default Android playback direction used by current Stremio Android and Nuvio.
          - If ExoPlayer cannot initialize the stream, Orvix automatically falls back to MPV.
          - Manual ExoPlayer and MPV choices remain available; no engine has been removed.

          Regression coverage:
          - Added tests for magnet metadata cleanup and tracker de-duplication/fallback.
          - Updated player-router tests to lock Exo-first local P2P behavior.
          - The full Flutter test suite must pass before either APK is built or published.

          Test focus:
          - Re-test the exact Prison Break / Death Note sources that previously behaved differently between Android mobile and Google/Android TV.
          - Report whether the source starts, how long initial buffering lasts, and whether seeking causes a stall.
          EOF

          if gh release view v0.7.5-beta.12 >/dev/null 2>&1; then
            gh release upload v0.7.5-beta.12 --clobber \
              release/Orvix-v0.7.5-beta.12-Android-Mobile.apk \
              release/Orvix-v0.7.5-beta.12-Android-TV.apk
            gh release edit v0.7.5-beta.12 \
              --title 'Orvix v0.7.5-beta.12 — P2P Engine Parity' \
              --prerelease \
              --notes-file /tmp/notes.md
          else
            gh release create v0.7.5-beta.12 \
              --target "${{ github.sha }}" \
              --title 'Orvix v0.7.5-beta.12 — P2P Engine Parity' \
              --prerelease \
              --notes-file /tmp/notes.md \
              release/Orvix-v0.7.5-beta.12-Android-Mobile.apk \
              release/Orvix-v0.7.5-beta.12-Android-TV.apk
          fi
