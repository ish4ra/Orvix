name: Orvix Android Mobile + TV beta.52 release

on:
  push:
    branches:
      - 'release/android-v0.7.9-beta.52'
    paths:
      - 'pubspec.yaml'

permissions:
  contents: write

concurrency:
  group: orvix-android-beta52-release
  cancel-in-progress: true

jobs:
  android-mobile:
    name: Build and publish Android Mobile only
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          FULL_VERSION="$(awk '$1 == "version:" {print $2}' pubspec.yaml)"
          VERSION="${FULL_VERSION%%+*}"
          test "$VERSION" = "0.7.9-beta.52"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Run regression tests
        run: flutter test

      - name: Guard mobile subtitle and aspect-ratio contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'libass: PlatformProfile.isAndroidMobile' lib/services/playback_service.dart
          grep -q "assets/fonts/NotoSansSinhala-Regular.ttf" lib/services/playback_service.dart
          grep -q "libassAndroidFontName:" lib/services/playback_service.dart
          grep -q "nativeStyledSubtitles: PlatformProfile.isAndroidMobile" lib/screens/player_screen.dart
          grep -q "width: double.infinity" lib/screens/player_screen.dart
          grep -q "height: double.infinity" lib/screens/player_screen.dart
          grep -q "fallback: PlayerResizeMode.fit" lib/screens/player_screen.dart
          grep -q "fit: _resizeMode.boxFit" lib/screens/player_screen.dart
          grep -q "double? _mobileActiveAspectRatio" lib/screens/player_screen.dart
          grep -q "aspectRatio: PlatformProfile.isAndroidMobile" lib/screens/player_screen.dart
          grep -q "final activeAspectRatio = crop.width / crop.height" lib/screens/player_screen.dart
          ! grep -q "_applyAndroidMobileNativeResize" lib/screens/player_screen.dart
          ! grep -q "'panscan'" lib/screens/player_screen.dart
          ! grep -q "'video-aspect-override'" lib/screens/player_screen.dart
          test -s assets/fonts/NotoSansSinhala-Regular.ttf
          test -s assets/fonts/OFL.txt
          grep -q 'VideoBlackBarCropService.detectFromNativePlayer' lib/screens/player_screen.dart
          grep -q 'screenshot-to-file' lib/services/video_black_bar_crop_service.dart
          grep -q "'video-crop'" lib/screens/player_screen.dart
          grep -q '@orvix_autocrop:crop=' lib/screens/player_screen.dart
          grep -q '_selectEmbeddedSubtitleReliably' lib/screens/player_screen.dart
          grep -q "'sid'," lib/screens/player_screen.dart
          grep -q "'sub-ass-override'," lib/screens/player_screen.dart
          test -s lib/services/video_black_bar_crop_service.dart

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.orvix --project-name orvix .

      - name: Prepare Android native dependencies
        shell: bash
        run: bash tools/prepare_android_native.sh native

      - name: Configure Android mobile
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          mkdir -p android/app/src/main/jniLibs android/app/libs
          cp -R native/jniLibs/. android/app/src/main/jniLibs/
          cp native/libs/rustls-platform-verifier-0.1.1.aar android/app/libs/
          python3 tools/configure_android_build.py
          python3 tools/configure_android_mobile_compat.py
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          grep -q 'android.hardware.camera' android/app/src/main/AndroidManifest.xml
          grep -q 'android:extractNativeLibs="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'useLegacyPackaging = true' android/app/build.gradle.kts
          grep -q 'orvix/torrent_engine' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt

      - name: Enable PGS-capable Android Mobile libmpv
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          python3 tools/configure_android_mobile_media_kit.py

      - name: Configure release signing
        env:
          ORVIX_ANDROID_KEYSTORE_B64: ${{ secrets.ORVIX_ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ORVIX_ANDROID_KEYSTORE_B64:-}"
          printf '%s' "$ORVIX_ANDROID_KEYSTORE_B64" | base64 --decode > android/app/orvix-release.jks
          test -s android/app/orvix-release.jks
          python3 tools/configure_android_signing.py

      - name: Build Android mobile APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Verify signed Android mobile APK and subtitle font
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" > /tmp/orvix-apk-list.txt
          grep -q 'lib/arm64-v8a/libstream_server.so' /tmp/orvix-apk-list.txt
          grep -q 'lib/armeabi-v7a/libstream_server.so' /tmp/orvix-apk-list.txt
          grep -q 'assets/flutter_assets/assets/fonts/NotoSansSinhala-Regular.ttf' /tmp/orvix-apk-list.txt
          grep -q 'assets/flutter_assets/assets/fonts/OFL.txt' /tmp/orvix-apk-list.txt
          grep -q 'lib/arm64-v8a/libmpv.so' /tmp/orvix-apk-list.txt
          unzip -p "$APK" lib/arm64-v8a/libmpv.so > /tmp/orvix-libmpv.so
          test -s /tmp/orvix-libmpv.so
          strings /tmp/orvix-libmpv.so | grep -q 'hdmv_pgs_subtitle'

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          curl --fail --location --retry 4             "https://github.com/ish4ra/Orvix/releases/download/v0.7.9-beta.51/Orvix-v0.7.9-beta.51-Android-Mobile.apk"             -o /tmp/orvix-previous.apk
          "$APKSIGNER" verify --verbose --print-certs /tmp/orvix-previous.apk > /tmp/previous-cert.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" > /tmp/current-cert.txt
          PREVIOUS_CERT="$(grep -m1 'certificate SHA-256 digest:' /tmp/previous-cert.txt | sed 's/.*: //')"
          CURRENT_CERT="$(grep -m1 'certificate SHA-256 digest:' /tmp/current-cert.txt | sed 's/.*: //')"
          test -n "$PREVIOUS_CERT"
          test -n "$CURRENT_CERT"
          test "$PREVIOUS_CERT" = "$CURRENT_CERT"

      - name: Rename APKs
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp build/app/outputs/flutter-apk/app-release.apk "Orvix-v$VERSION-Android-Mobile.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "Orvix-v$VERSION-Android-Mobile-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "Orvix-v$VERSION-Android-Mobile-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "Orvix-v$VERSION-Android-Mobile-x86_64.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-mobile
          if-no-files-found: error
          path: |
            Orvix-v${{ steps.version.outputs.version }}-Android-Mobile.apk
            Orvix-v${{ steps.version.outputs.version }}-Android-Mobile-arm64-v8a.apk
            Orvix-v${{ steps.version.outputs.version }}-Android-Mobile-armeabi-v7a.apk
            Orvix-v${{ steps.version.outputs.version }}-Android-Mobile-x86_64.apk

  android-tv:
    name: Build Android TV only
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          FULL_VERSION="$(awk '$1 == "version:" {print $2}' pubspec.yaml)"
          VERSION="${FULL_VERSION%%+*}"
          test "$VERSION" = "0.7.9-beta.52"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.orvix --project-name orvix .

      - name: Prepare Android native dependencies
        shell: bash
        run: bash tools/prepare_android_native.sh native

      - name: Configure Android TV
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          mkdir -p android/app/src/main/jniLibs android/app/libs
          cp -R native/jniLibs/. android/app/src/main/jniLibs/
          cp native/libs/rustls-platform-verifier-0.1.1.aar android/app/libs/
          python3 tools/configure_android_build.py --tv
          python3 tools/configure_android_mobile_compat.py
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' android/app/src/main/AndroidManifest.xml
          grep -q 'android:screenOrientation="landscape"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:extractNativeLibs="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'orvix/torrent_engine' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt
          grep -q 'JniStreamingServerController.start' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt
          test ! -f android/app/src/main/kotlin/com/orvix/orvix/TorrentEngineService.kt
          if grep -q 'orvix/tv_native_player' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt; then
            echo 'Experimental native TV player bridge is still present.' >&2
            exit 1
          fi
          test ! -f android/app/src/main/kotlin/com/orvix/orvix/TvNativePlayerActivity.kt

      - name: Guard TV DPAD scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'HardwareKeyboard.instance.addHandler' lib/app.dart
          grep -q 'current.focusInDirection(direction)' lib/app.dart
          grep -q 'alignment: 0.30' lib/app.dart
          grep -q 'onSubmitted: (_) => _busy ? null : _connectApiKey()' lib/screens/library_screen.dart

      - name: Configure release signing
        env:
          ORVIX_ANDROID_KEYSTORE_B64: ${{ secrets.ORVIX_ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ORVIX_ANDROID_KEYSTORE_B64:-}"
          printf '%s' "$ORVIX_ANDROID_KEYSTORE_B64" | base64 --decode > android/app/orvix-release.jks
          test -s android/app/orvix-release.jks
          python3 tools/configure_android_signing.py

      - name: Build Android TV APK
        run: flutter build apk --release --dart-define=ORVIX_TV=true

      - name: Verify signed Android TV APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" > /tmp/orvix-tv-apk-list.txt
          grep -q 'lib/arm64-v8a/libstream_server.so' /tmp/orvix-tv-apk-list.txt
          grep -q 'lib/armeabi-v7a/libstream_server.so' /tmp/orvix-tv-apk-list.txt
          grep -q 'lib/arm64-v8a/libc++_shared.so' /tmp/orvix-tv-apk-list.txt

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          curl --fail --location --retry 4             "https://github.com/ish4ra/Orvix/releases/download/v0.7.9-beta.46/Orvix-v0.7.9-beta.46-Android-TV.apk"             -o /tmp/orvix-previous-tv.apk
          "$APKSIGNER" verify --verbose --print-certs /tmp/orvix-previous-tv.apk > /tmp/previous-tv-cert.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" > /tmp/current-tv-cert.txt
          PREVIOUS_CERT="$(grep -m1 'certificate SHA-256 digest:' /tmp/previous-tv-cert.txt | sed 's/.*: //')"
          CURRENT_CERT="$(grep -m1 'certificate SHA-256 digest:' /tmp/current-tv-cert.txt | sed 's/.*: //')"
          test -n "$PREVIOUS_CERT"
          test -n "$CURRENT_CERT"
          test "$PREVIOUS_CERT" = "$CURRENT_CERT"

      - name: Rename Android TV APK
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cp build/app/outputs/flutter-apk/app-release.apk "Orvix-v$VERSION-Android-TV.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-tv
          if-no-files-found: error
          path: Orvix-v${{ steps.version.outputs.version }}-Android-TV.apk

  release:
    name: Publish Android Mobile + TV beta.52
    needs: [android-mobile, android-tv]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: android-mobile
          path: dist/mobile

      - uses: actions/download-artifact@v4
        with:
          name: android-tv
          path: dist/tv

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.7.9-beta.52"
          test -s "dist/mobile/Orvix-v$VERSION-Android-Mobile.apk"
          test -s "dist/mobile/Orvix-v$VERSION-Android-Mobile-arm64-v8a.apk"
          test -s "dist/mobile/Orvix-v$VERSION-Android-Mobile-armeabi-v7a.apk"
          test -s "dist/mobile/Orvix-v$VERSION-Android-Mobile-x86_64.apk"
          test -s "dist/tv/Orvix-v$VERSION-Android-TV.apk"

      - name: Publish Android Mobile + TV prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.7.9-beta.52"
          TAG="v$VERSION"
          cat > /tmp/release-notes.md <<'EOF'
          Android Mobile + Android TV only.

          - Android TV: explicit vertical DPAD focus traversal across sections and smooth focused-control scrolling, based on TV-first patterns reviewed in Nuvio and Debrify.
          - Android TV: TorBox API-key entry can submit directly from the TV keyboard/remote, while the Connect button remains DPAD reachable.
          - Android Mobile: TV QR login now manages camera lifecycle explicitly instead of relying on scanner auto-start behavior.
          - Android Mobile: scanner failures now offer Retry camera and a manual 6-character TV-code fallback.
          - Android Mobile: camera permission/feature lines are emitted cleanly into the generated Android manifest.
          - Preserves the beta.51 subtitle, PGS and active-picture aspect-ratio fixes without changing player behavior.

          No Windows or macOS packages are published in this release.
          EOF

          gh release create "$TAG"             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "Orvix v$VERSION Android Mobile + TV"             --notes-file /tmp/release-notes.md             --prerelease             "dist/mobile/Orvix-v$VERSION-Android-Mobile.apk"             "dist/mobile/Orvix-v$VERSION-Android-Mobile-arm64-v8a.apk"             "dist/mobile/Orvix-v$VERSION-Android-Mobile-armeabi-v7a.apk"             "dist/mobile/Orvix-v$VERSION-Android-Mobile-x86_64.apk"             "dist/tv/Orvix-v$VERSION-Android-TV.apk"
