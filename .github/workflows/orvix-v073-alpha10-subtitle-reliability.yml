          - Retries missing subtitle windows instead of permanently skipping failed batches.
          - Keeps English timing subtitles hidden whenever AI Sinhala is enabled in Settings.
          - Adds live AI translation from an embedded English text track when release-matched subtitle preparation is unavailable.
          - Applies the same subtitle behavior to Windows, macOS, Android mobile and Android TV.
          - Retains alpha.9 Android signing/P2P, TV focus/branding and macOS Keychain fixes." \
