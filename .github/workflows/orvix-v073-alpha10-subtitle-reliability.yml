name: Release Orvix v0.7.3-alpha.10 Subtitle Reliability

on:
  push:
    branches:
      - orvix-v0.7.3-alpha.10
    paths:
      - '.github/workflows/orvix-v073-alpha10-subtitle-reliability.yml'

permissions:
  contents: write

jobs:
  android-native:
    name: Prepare Android P2P engine
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned native stream-server builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/jniLibs/{armeabi-v7a,arm64-v8a,x86,x86_64} native/libs tmp

          download_extract() {
            abi="$1"
            file="$2"
            sha="$3"
            url="https://github.com/stremio-native/stremio-android/releases/download/v1.2.4/$file"
            curl --fail --location --retry 4 --retry-delay 2 "$url" -o "tmp/$file"
            echo "$sha  tmp/$file" | sha256sum -c -
            unzip -p "tmp/$file" "lib/$abi/libstream_server.so" > "native/jniLibs/$abi/libstream_server.so"
            unzip -p "tmp/$file" "lib/$abi/libc++_shared.so" > "native/jniLibs/$abi/libc++_shared.so"
            test -s "native/jniLibs/$abi/libstream_server.so"
            test -s "native/jniLibs/$abi/libc++_shared.so"
          }

          download_extract arm64-v8a \
            StremioMobile-v1.2.4-arm64-v8a-release.apk \
            3ffd96e6c6f0b23845f7ee6ab721d52ba1534055304959ed84c9589aac8bc97e

          download_extract armeabi-v7a \
            StremioMobile-v1.2.4-armeabi-v7a-release.apk \
            519ab54a8a57e93c5a2f2a70cced18673063cffcb88cfdcd0ec6c9a7e5f5570e

          download_extract x86 \
            StremioMobile-v1.2.4-x86-release.apk \
            201012b229914b533665f4c477140f174d7b933fdc27c1fae6a2fb3a1f232058

          download_extract x86_64 \
            StremioMobile-v1.2.4-x86_64-release.apk \
            bee94497864d46a3b7c1905848e161da03179ca4ff85c6808710cdd435cafc94

          curl --fail --location --retry 4 \
            "https://raw.githubusercontent.com/stremio-native/stremio-android/4bdef3b6be1186d9aa22acd8b3ec391c22f0e083/app/libs/rustls-platform-verifier-0.1.1.aar" \
            -o native/libs/rustls-platform-verifier-0.1.1.aar
          test -s native/libs/rustls-platform-verifier-0.1.1.aar

      - name: Inspect native libraries
        shell: bash
        run: |
          set -euo pipefail
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            echo "=== $abi ==="
            file "native/jniLibs/$abi/libstream_server.so"
            file "native/jniLibs/$abi/libc++_shared.so"
            readelf -d "native/jniLibs/$abi/libstream_server.so" | grep NEEDED
            readelf -d "native/jniLibs/$abi/libstream_server.so" | grep -q 'libc++_shared.so'
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android-native-engine
          path: native/
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Orvix Windows icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          @'
          from PIL import Image
          src = Image.open(r"assets/branding/orvix_icon.png").convert("RGBA")
          src.save(
              r"windows/runner/resources/app_icon.ico",
              format="ICO",
              sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)],
          )
          '@ | Set-Content -Encoding UTF8 make_windows_icon.py
          python make_windows_icon.py
          Remove-Item make_windows_icon.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Build Windows
        run: flutter build windows --release

      - name: Bundle local P2P engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseDir = 'build\windows\x64\runner\Release'
          $url = 'https://github.com/stremio-native/stream-server/releases/download/v0.1.8/stream-server-windows-amd64.exe'
          $dest = Join-Path $releaseDir 'orvix-stream-server.exe'
          Invoke-WebRequest -Uri $url -OutFile $dest
          $expected = '90B7A14B282A9E649FBA5ADB6112C2C191DBA884EC762F8650F45CCF06E17E09'
          $actual = (Get-FileHash $dest -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "stream-server checksum mismatch: $actual" }

          $licenseDir = Join-Path $releaseDir 'licenses\stream-server'
          New-Item -ItemType Directory -Force -Path $licenseDir | Out-Null
          Copy-Item 'licenses\stream-server\LICENSE' (Join-Path $licenseDir 'LICENSE.txt')
          Copy-Item 'licenses\stream-server\NOTICE.md' (Join-Path $licenseDir 'NOTICE.md')

      - name: Smoke test Windows P2P engine
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Resolve-Path 'build\windows\x64\runner\Release\orvix-stream-server.exe'
          $work = Join-Path $env:RUNNER_TEMP 'orvix-stream-server-smoke'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $proc = Start-Process -FilePath $exe -ArgumentList '--no-tray' -WorkingDirectory $work -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 90; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $r = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:11470/heartbeat' -TimeoutSec 2
                if ($r.StatusCode -ge 200 -and $r.StatusCode -lt 300) { $ready = $true; break }
              } catch {}
              if ($proc.HasExited) { throw "stream-server exited early with code $($proc.ExitCode)" }
            }
            if (-not $ready) { throw 'stream-server heartbeat did not become ready' }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
          }

      - name: Pack portable build
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath 'Orvix-v0.7.3-alpha.10-Windows-x64.zip' -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler was not found.' }
          & $iscc '/DMyAppVersion=0.7.3-alpha.10' 'installer\orvix.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            Orvix-v0.7.3-alpha.10-Windows-x64.zip
            installer-output/Orvix-Setup-v0.7.3-alpha.10-Windows-x64.exe

  android-mobile:
    runs-on: ubuntu-latest
    needs: android-native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.orvix --project-name orvix .

      - uses: actions/download-artifact@v4
        with:
          name: android-native-engine
          path: android-native

      - name: Configure Android mobile with native P2P
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow

          mkdir -p android/app/src/main/jniLibs android/app/libs
          cp -R android-native/jniLibs/. android/app/src/main/jniLibs/
          cp android-native/libs/rustls-platform-verifier-0.1.1.aar android/app/libs/
          python3 tools/configure_android_build.py

          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -s "android/app/src/main/jniLibs/$abi/libstream_server.so"
            test -s "android/app/src/main/jniLibs/$abi/libc++_shared.so"
          done
          grep -q 'orvix/torrent_engine' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt

      - name: Restore stable Android signing key
        env:
          ORVIX_ANDROID_KEYSTORE_B64: ${{ secrets.ORVIX_ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ORVIX_ANDROID_KEYSTORE_B64:-}" ]; then
            echo "::error::ORVIX_ANDROID_KEYSTORE_B64 repository secret is missing."
            exit 1
          fi
          printf '%s' "$ORVIX_ANDROID_KEYSTORE_B64" | base64 --decode > android/app/orvix-release.jks
          test -s android/app/orvix-release.jks
          keytool -list -keystore android/app/orvix-release.jks \
            -storepass 'OrvixAlpha-2026-Sign!' -alias orvix >/dev/null
          python3 tools/configure_android_signing.py

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android mobile APKs
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Verify P2P engine packaged
        shell: bash
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          unzip -l "$APK" | grep 'lib/arm64-v8a/libstream_server.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libc++_shared.so'
          unzip -l "$APK" | grep 'lib/armeabi-v7a/libstream_server.so'
          unzip -l "$APK" | grep 'lib/armeabi-v7a/libc++_shared.so'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/orvix-apksigner.txt
          grep -qi 'c86153a3a0d3f49192b37c6574e23c41716c2b9935fdbcf38d6902a3e60fa4ab' /tmp/orvix-apksigner.txt

      - name: Rename APKs
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk Orvix-v0.7.3-alpha.10-Android-Mobile.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Orvix-v0.7.3-alpha.10-Android-Mobile-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk Orvix-v0.7.3-alpha.10-Android-Mobile-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk Orvix-v0.7.3-alpha.10-Android-Mobile-x86_64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-mobile
          path: |
            Orvix-v0.7.3-alpha.10-Android-Mobile.apk
            Orvix-v0.7.3-alpha.10-Android-Mobile-arm64-v8a.apk
            Orvix-v0.7.3-alpha.10-Android-Mobile-armeabi-v7a.apk
            Orvix-v0.7.3-alpha.10-Android-Mobile-x86_64.apk

  android-tv:
    runs-on: ubuntu-latest
    needs: android-native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.orvix --project-name orvix .

      - uses: actions/download-artifact@v4
        with:
          name: android-native-engine
          path: android-native

      - name: Configure Android TV with native P2P
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow

          mkdir -p android/app/src/main/jniLibs android/app/libs
          cp -R android-native/jniLibs/. android/app/src/main/jniLibs/
          cp android-native/libs/rustls-platform-verifier-0.1.1.aar android/app/libs/
          python3 tools/configure_android_build.py --tv

          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            test -s "android/app/src/main/jniLibs/$abi/libstream_server.so"
            test -s "android/app/src/main/jniLibs/$abi/libc++_shared.so"
          done
          grep -q 'android.intent.category.LEANBACK_LAUNCHER' android/app/src/main/AndroidManifest.xml
          grep -q 'orvix/torrent_engine' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt

      - name: Restore stable Android signing key
        env:
          ORVIX_ANDROID_KEYSTORE_B64: ${{ secrets.ORVIX_ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ORVIX_ANDROID_KEYSTORE_B64:-}" ]; then
            echo "::error::ORVIX_ANDROID_KEYSTORE_B64 repository secret is missing."
            exit 1
          fi
          printf '%s' "$ORVIX_ANDROID_KEYSTORE_B64" | base64 --decode > android/app/orvix-release.jks
          test -s android/app/orvix-release.jks
          keytool -list -keystore android/app/orvix-release.jks \
            -storepass 'OrvixAlpha-2026-Sign!' -alias orvix >/dev/null
          python3 tools/configure_android_signing.py

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android TV APK
        run: flutter build apk --release

      - name: Verify P2P engine packaged
        shell: bash
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          unzip -l "$APK" | grep 'lib/arm64-v8a/libstream_server.so'
          unzip -l "$APK" | grep 'lib/arm64-v8a/libc++_shared.so'
          unzip -l "$APK" | grep 'lib/armeabi-v7a/libstream_server.so'
          unzip -l "$APK" | grep 'lib/armeabi-v7a/libc++_shared.so'
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/orvix-apksigner.txt
          grep -qi 'c86153a3a0d3f49192b37c6574e23c41716c2b9935fdbcf38d6902a3e60fa4ab' /tmp/orvix-apksigner.txt

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Orvix-v0.7.3-alpha.10-Android-TV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-tv
          path: Orvix-v0.7.3-alpha.10-Android-TV.apk

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Orvix branding assets
        run: |
          test -s assets/branding/orvix_icon.png
          test -s assets/branding/orvix_tv_banner.jpg

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable and generate macOS platform
        run: |
          flutter config --enable-macos-desktop
          flutter create --platforms=macos --org com.orvix --project-name orvix .

      - name: Configure macOS branding and networking
        run: |
          sed -i '' 's/PRODUCT_NAME = orvix/PRODUCT_NAME = Orvix/' macos/Runner/Configs/AppInfo.xcconfig

          ICON_DIR='macos/Runner/Assets.xcassets/AppIcon.appiconset'
          SRC='assets/branding/orvix_icon.png'
          sips -z 16 16 "$SRC" --out "$ICON_DIR/app_icon_16.png" >/dev/null
          sips -z 32 32 "$SRC" --out "$ICON_DIR/app_icon_32.png" >/dev/null
          sips -z 64 64 "$SRC" --out "$ICON_DIR/app_icon_64.png" >/dev/null
          sips -z 128 128 "$SRC" --out "$ICON_DIR/app_icon_128.png" >/dev/null
          sips -z 256 256 "$SRC" --out "$ICON_DIR/app_icon_256.png" >/dev/null
          sips -z 512 512 "$SRC" --out "$ICON_DIR/app_icon_512.png" >/dev/null
          sips -z 1024 1024 "$SRC" --out "$ICON_DIR/app_icon_1024.png" >/dev/null

          for f in macos/Runner/Release.entitlements macos/Runner/DebugProfile.entitlements; do
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.network.client bool true" "$f" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Set :com.apple.security.network.client true" "$f"
            /usr/libexec/PlistBuddy -c "Add :com.apple.security.network.server bool true" "$f" 2>/dev/null || \
              /usr/libexec/PlistBuddy -c "Set :com.apple.security.network.server true" "$f"
          done

      - name: Install macOS P2P dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install boost openssl@3 cmake pkg-config

          BOOST_PREFIX="$(brew --prefix boost)"
          OPENSSL_PREFIX="$(brew --prefix openssl@3)"
          LIBTORRENT_PREFIX="$RUNNER_TEMP/libtorrent-2.0.11"
          LIBTORRENT_TARBALL="$RUNNER_TEMP/libtorrent-rasterbar-2.0.11.tar.gz"

          curl -fL --retry 3 \
            https://github.com/arvidn/libtorrent/releases/download/v2.0.11/libtorrent-rasterbar-2.0.11.tar.gz \
            -o "$LIBTORRENT_TARBALL"
          echo "f0db58580f4f29ade6cc40fa4ba80e2c9a70c90265cd77332d3cdec37ecf1e6d  $LIBTORRENT_TARBALL" | shasum -a 256 -c -

          rm -rf "$RUNNER_TEMP/libtorrent-src" "$RUNNER_TEMP/libtorrent-build" "$LIBTORRENT_PREFIX"
          mkdir -p "$RUNNER_TEMP/libtorrent-src"
          tar -xzf "$LIBTORRENT_TARBALL" -C "$RUNNER_TEMP/libtorrent-src" --strip-components=1

          cmake -S "$RUNNER_TEMP/libtorrent-src" -B "$RUNNER_TEMP/libtorrent-build" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$LIBTORRENT_PREFIX" \
            -DBUILD_SHARED_LIBS=OFF \
            -Dpython-bindings=OFF \
            -Dexamples=OFF \
            -Dtests=OFF \
            -Dtools=OFF \
            -Dencryption=ON \
            -DCMAKE_PREFIX_PATH="$BOOST_PREFIX;$OPENSSL_PREFIX"
          cmake --build "$RUNNER_TEMP/libtorrent-build" --config Release --parallel 4
          cmake --install "$RUNNER_TEMP/libtorrent-build" --config Release

          test -f "$LIBTORRENT_PREFIX/lib/pkgconfig/libtorrent-rasterbar.pc"
          echo "PKG_CONFIG_PATH=$LIBTORRENT_PREFIX/lib/pkgconfig:$OPENSSL_PREFIX/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
          echo "LIBTORRENT_RASTERBAR_STATIC=1" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-I$BOOST_PREFIX/include -I$OPENSSL_PREFIX/include ${CXXFLAGS:-}" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$BOOST_PREFIX/include -I$OPENSSL_PREFIX/include ${CPPFLAGS:-}" >> "$GITHUB_ENV"
          echo "CPLUS_INCLUDE_PATH=$BOOST_PREFIX/include:$OPENSSL_PREFIX/include:${CPLUS_INCLUDE_PATH:-}" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$LIBTORRENT_PREFIX/lib -L$BOOST_PREFIX/lib -L$OPENSSL_PREFIX/lib ${LDFLAGS:-}" >> "$GITHUB_ENV"
      - name: Build macOS P2P engine
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.1.8 https://github.com/stremio-native/stream-server.git stream-server
          cd stream-server

          # Orvix uses the native server for direct torrent streaming. The
          # upstream desktop binary aborts startup on macOS when FFmpeg is not
          # installed, even though FFmpeg is not required for the direct stream
          # path Orvix uses. Keep the bundled engine self-contained by disabling
          # that startup-only FFmpeg requirement in headless (--no-tray) mode.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("server/src/main.rs")
          text = path.read_text()
          old = "        let mut cfg = stream_server::ServerConfig::binary_default();\n        cfg.use_tui = use_tui;\n"
          new = "        let mut cfg = stream_server::ServerConfig::binary_default();\n        cfg.setup_ffmpeg = false;\n        cfg.use_tui = use_tui;\n"
          start = text.find("    fn run_headless_mode(use_tui: bool)")
          if start < 0:
              raise SystemExit("run_headless_mode not found")
          tail = text[start:]
          if old not in tail:
              raise SystemExit("Expected headless ServerConfig block was not found")
          text = text[:start] + tail.replace(old, new, 1)
          path.write_text(text)
          PY

          cargo build --release --package server --bin server

      - name: Smoke test macOS P2P engine
        shell: bash
        run: |
          set -euo pipefail
          ENGINE="$PWD/stream-server/target/release/server"
          test -x "$ENGINE"
          WORK="$RUNNER_TEMP/orvix-stream-server-smoke"
          mkdir -p "$WORK"
          (cd "$WORK" && "$ENGINE" --no-tray >server.log 2>&1) &
          PID=$!
          cleanup() { kill "$PID" 2>/dev/null || true; }
          trap cleanup EXIT

          ready=0
          for i in $(seq 1 100); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:11470/heartbeat >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat "$WORK/server.log" || true
              exit 1
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            cat "$WORK/server.log" || true
            exit 1
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS app
        run: flutter build macos --release

      - name: Bundle P2P engine and create DMG
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "macOS .app not found" >&2
            exit 1
          fi

          mkdir -p "$APP/Contents/Resources/licenses/stream-server"
          cp stream-server/target/release/server "$APP/Contents/Resources/orvix-stream-server"
          chmod +x "$APP/Contents/Resources/orvix-stream-server"
          cp licenses/stream-server/LICENSE "$APP/Contents/Resources/licenses/stream-server/LICENSE.txt"
          cp licenses/stream-server/NOTICE.md "$APP/Contents/Resources/licenses/stream-server/NOTICE.md"

          codesign --force --deep --sign - "$APP"
          mkdir -p dmg-root
          cp -R "$APP" dmg-root/Orvix.app
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "Orvix" -srcfolder dmg-root -ov -format UDZO Orvix-v0.7.3-alpha.10-macOS.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Orvix-v0.7.3-alpha.10-macOS.dmg

  release:
    runs-on: ubuntu-latest
    needs: [windows, android-mobile, android-tv, macos]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.7.3-alpha.10 \
            --target '${{ github.sha }}' \
            --title 'Orvix v0.7.3-alpha.10 — Subtitle Reliability' \
            --prerelease \
            --notes "Orvix alpha.10 focuses on AI Sinhala subtitle reliability across all four platforms.

          - Fixes AI Sinhala disappearing after seeking or jumping ahead by translating around the new playback position.
