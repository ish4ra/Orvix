name: Package Orvix v0.5.6 Once

on:
  push:
    branches:
      - orvix-v0.5.6-smooth-ranking
    paths:
      - '.github/workflows/release-v056-once.yml'

permissions:
  contents: write

jobs:
  package-release:
    runs-on: windows-latest
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@v4
        with:
          ref: v0.5.6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preserve pinned Orvix icon hash
        shell: pwsh
        run: |
          $icon = 'windows\runner\resources\app_icon.ico'
          if (-not (Test-Path $icon)) { throw 'Pinned Orvix icon is missing.' }
          $hash = (Get-FileHash $icon -Algorithm SHA256).Hash
          "ORVIX_ICON_HASH=$hash" >> $env:GITHUB_ENV

      - name: Generate Windows runner
        shell: pwsh
        run: flutter create --platforms=windows --project-name orvix .

      - name: Restore exact pinned Orvix icon
        shell: pwsh
        run: |
          git checkout v0.5.6 -- windows/runner/resources/app_icon.ico
          $hash = (Get-FileHash 'windows\runner\resources\app_icon.ico' -Algorithm SHA256).Hash
          if ($hash -ne $env:ORVIX_ICON_HASH) { throw 'Orvix icon changed during runner generation.' }

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Pack portable build
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath 'Orvix-v0.5.6-Windows-x64.zip' -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler was not found.' }
          & $iscc '/DMyAppVersion=0.5.6' 'installer\orvix.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = 'Orvix-v0.5.6-Windows-x64.zip'
          $exe = 'installer-output/Orvix-Setup-v0.5.6-Windows-x64.exe'
          $notes = @'
          Orvix v0.5.6

          - Adds user-selectable source result counts: Top 25 / 50 / 100 / 200 / All.
          - Adds movie and series-aware source pinning with pinned Quick Play priority.
          - Adds Smooth playback ranking to surface lower-risk, commonly decodable sources with healthy seed counts; HEVC/x265 and practical 1080p/720p options are favored when enabled.
          - Keeps Compatibility as a separate hard-risk filter.
          - Includes the existing smart playback buffer/reconnect improvements and preserves the manually fixed Windows icon.
          '@
          gh release view v0.5.6 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload v0.5.6 $zip $exe --clobber
            gh release edit v0.5.6 --title 'Orvix v0.5.6' --notes $notes
          } else {
            gh release create v0.5.6 $zip $exe --target '5a345414168d93e239a51ee0df13b9713e6fb455' --title 'Orvix v0.5.6' --notes $notes
          }
