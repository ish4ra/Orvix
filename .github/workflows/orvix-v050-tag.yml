name: Tag Orvix v0.5.0

on:
  push:
    branches:
      - orvix-v0.5.0-release-helper
    paths:
      - '.github/workflows/orvix-v050-tag.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create validated release tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin refs/tags/v0.5.0 >/dev/null 2>&1; then
            echo "v0.5.0 already exists"
            exit 0
          fi
          git tag -a v0.5.0 b593fcef0ba5d111af0f6a7b840adfdff12cf88c -m "Orvix v0.5.0"
          git push origin refs/tags/v0.5.0
