name: Release Orvix v0.5.0 Once

on:
  push:
    branches:
      - orvix-v0.5.0-dev
    paths:
      - '.github/workflows/orvix-v050-release-once.yml'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: orvix-v0.5.0-dev
          fetch-depth: 0

      - name: Remove one-shot helper and create clean release commit
        id: clean
        shell: pwsh
        run: |
          git config user.name "Ishara Lakshan"
          git config user.email "ishara@tuta.io"
          git rm .github/workflows/orvix-v050-release-once.yml
          git commit -m "build: prepare clean Orvix v0.5.0 release"
          git push origin HEAD:orvix-v0.5.0-dev
          $sha = (git rev-parse HEAD).Trim()
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $line = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1
          if (-not $line) { throw 'Version not found in pubspec.yaml' }
          $version = (($line -replace '^version:\s*', '').Split('+')[0]).Trim()
          if ($version -ne '0.5.0') { throw "Expected Orvix 0.5.0, found $version" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner
        shell: pwsh
        run: flutter create --platforms=windows --project-name orvix .

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Orvix Windows icon
        run: dart run flutter_launcher_icons

      - name: Analyze app sources
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Build Windows release
        run: flutter build windows --release

      - name: Pack portable Windows build
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "Orvix-v$version-Windows-x64.zip" -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler was not found.' }
          & $iscc "/DMyAppVersion=$version" "installer\orvix.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: Orvix-v${{ steps.version.outputs.version }}-Windows-x64
          path: Orvix-v${{ steps.version.outputs.version }}-Windows-x64.zip

      - name: Upload setup EXE
        uses: actions/upload-artifact@v4
        with:
          name: Orvix-v${{ steps.version.outputs.version }}-Setup-Windows-x64
          path: installer-output/Orvix-Setup-v${{ steps.version.outputs.version }}-Windows-x64.exe

      - name: Publish Orvix v0.5.0 GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $zip = "Orvix-v$version-Windows-x64.zip"
          $exe = "installer-output/Orvix-Setup-v$version-Windows-x64.exe"
          $target = "${{ steps.clean.outputs.sha }}"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $zip $exe --clobber
          } else {
            gh release create $tag $zip $exe --target $target --title "Orvix $tag" --generate-notes
          }
