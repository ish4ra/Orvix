name: Prepare Pikora v0.4.0 Home and Library

on:
  push:
    branches:
      - v0.4-home-library
    paths:
      - '.github/workflows/prepare-v040.yml'
      - '.github/patches/patch_v040.py'

permissions:
  contents: write

jobs:
  patch-commit-validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v0.4-home-library

      - name: Apply v0.4.0 patch
        run: python .github/patches/patch_v040.py

      - name: Commit source before validation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare-v040.yml .github/patches/patch_v040.py
          git add lib pubspec.yaml CHANGELOG.md
          git commit -m "feat: v0.4.0 library and customizable home"
          git push origin HEAD:v0.4-home-library

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner
        shell: pwsh
        run: flutter create --platforms=windows --project-name pikora .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app sources
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Build Windows release
        run: flutter build windows --release
