name: Release Orvix v0.7.5-beta.7 — Stremio-style Android TV

on:
  push:
    branches:
      - orvix-v0.7.5-dev
    paths:
      - '.github/workflows/orvix-v075-beta7-tv-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: orvix-v075-beta7-tv-release
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Stremio-style TV path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Run Flutter tests
        run: flutter test

  android-tv:
    name: Build Android TV beta.7
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.orvix --project-name orvix .

      - name: Download pinned Stremio Android stream-server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/jniLibs/{arm64-v8a,armeabi-v7a} android/app/libs tmp

          curl --fail --location --retry 4 --retry-delay 2 \
            "https://github.com/stremio-native/stremio-android/releases/download/v1.2.4/StremioMobile-v1.2.4-arm64-v8a-release.apk" \
            -o tmp/stremio-arm64.apk
          echo "3ffd96e6c6f0b23845f7ee6ab721d52ba1534055304959ed84c9589aac8bc97e  tmp/stremio-arm64.apk" | sha256sum -c -
          unzip -p tmp/stremio-arm64.apk lib/arm64-v8a/libstream_server.so > android/app/src/main/jniLibs/arm64-v8a/libstream_server.so
          unzip -p tmp/stremio-arm64.apk lib/arm64-v8a/libc++_shared.so > android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so

          curl --fail --location --retry 4 --retry-delay 2 \
            "https://github.com/stremio-native/stremio-android/releases/download/v1.2.4/StremioMobile-v1.2.4-armeabi-v7a-release.apk" \
            -o tmp/stremio-armv7.apk
          echo "519ab54a8a57e93c5a2f2a70cced18673063cffcb88cfdcd0ec6c9a7e5f5570e  tmp/stremio-armv7.apk" | sha256sum -c -
          unzip -p tmp/stremio-armv7.apk lib/armeabi-v7a/libstream_server.so > android/app/src/main/jniLibs/armeabi-v7a/libstream_server.so
          unzip -p tmp/stremio-armv7.apk lib/armeabi-v7a/libc++_shared.so > android/app/src/main/jniLibs/armeabi-v7a/libc++_shared.so

          curl --fail --location --retry 4 --retry-delay 2 \
            "https://raw.githubusercontent.com/stremio-native/stremio-android/4bdef3b6be1186d9aa22acd8b3ec391c22f0e083/app/libs/rustls-platform-verifier-0.1.1.aar" \
            -o android/app/libs/rustls-platform-verifier-0.1.1.aar

          test -s android/app/src/main/jniLibs/arm64-v8a/libstream_server.so
          test -s android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so
          test -s android/app/src/main/jniLibs/armeabi-v7a/libstream_server.so
          test -s android/app/src/main/jniLibs/armeabi-v7a/libc++_shared.so
          test -s android/app/libs/rustls-platform-verifier-0.1.1.aar

      - name: Configure Android TV
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow
          python3 tools/configure_android_build.py --tv
          python3 tools/configure_android_mobile_compat.py

          grep -q 'android.intent.category.LEANBACK_LAUNCHER' android/app/src/main/AndroidManifest.xml
          grep -q 'android:screenOrientation="landscape"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:foregroundServiceType="mediaPlayback"' android/app/src/main/AndroidManifest.xml
          grep -q 'android:extractNativeLibs="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'orvix/torrent_engine' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt
          grep -q 'orvix/tv_native_player' android/app/src/main/kotlin/com/orvix/orvix/MainActivity.kt
          grep -q 'DefaultHttpDataSource' android/app/src/main/kotlin/com/orvix/orvix/TvNativePlayerActivity.kt
          grep -q 'setConnectTimeoutMs(30_000)' android/app/src/main/kotlin/com/orvix/orvix/TvNativePlayerActivity.kt
          grep -q 'setReadTimeoutMs(30_000)' android/app/src/main/kotlin/com/orvix/orvix/TvNativePlayerActivity.kt
          grep -q 'setEnableDecoderFallback(true)' android/app/src/main/kotlin/com/orvix/orvix/TvNativePlayerActivity.kt
          grep -q 'media3-exoplayer:1.10.1' android/app/build.gradle.kts
          grep -q 'media3-ui:1.10.1' android/app/build.gradle.kts

      - name: Configure release signing
        env:
          ORVIX_ANDROID_KEYSTORE_B64: ${{ secrets.ORVIX_ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ORVIX_ANDROID_KEYSTORE_B64:-}"
          printf '%s' "$ORVIX_ANDROID_KEYSTORE_B64" | base64 --decode > android/app/orvix-release.jks
          test -s android/app/orvix-release.jks
          python3 tools/configure_android_signing.py

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android TV APK
        run: flutter build apk --release --dart-define=ORVIX_TV=true

      - name: Verify Android TV APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" > /tmp/orvix-tv-apk-list.txt
          grep -q 'lib/arm64-v8a/libstream_server.so' /tmp/orvix-tv-apk-list.txt
          grep -q 'lib/arm64-v8a/libc++_shared.so' /tmp/orvix-tv-apk-list.txt
          grep -q 'lib/armeabi-v7a/libstream_server.so' /tmp/orvix-tv-apk-list.txt
          grep -q 'lib/armeabi-v7a/libc++_shared.so' /tmp/orvix-tv-apk-list.txt
          if grep -q 'libtorrserver.so' /tmp/orvix-tv-apk-list.txt; then
            echo 'TV APK unexpectedly contains obsolete TorrServer transport.' >&2
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Orvix-v0.7.5-beta.7-Android-TV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Orvix-v0.7.5-beta.7-Android-TV
          path: Orvix-v0.7.5-beta.7-Android-TV.apk
          if-no-files-found: error

      - name: Publish beta.7 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/beta7-notes.md <<'EOF'
          Orvix v0.7.5-beta.7 is an Android-TV-only playback architecture test based on the current Stremio Android path.

          - Restores Stremio's native stream-server v1.2.4 on localhost port 11470.
          - Uses the stremio-core-compatible /{infoHash}/create route and the canonical /{infoHash}/{fileIdx} playback URL.
          - Honors the addon's fileIdx first and allows -1 auto-selection when no file index is supplied.
          - Removes the beta.6 TorrServer path and Orvix's custom 5 MB P2P pre-buffer gate.
          - Replaces Flutter video_player handoff with a native Media3/ExoPlayer 1.10.1 Android TV activity using Stremio-equivalent HTTP datasource timeouts and decoder fallback.
          - Runs the local stream-server through a START_STICKY foreground media-playback service.
          - Back from playback returns to the source browser instead of the title details screen.
          - A playback error also returns to the source browser so another source can be selected immediately.
          - Free ordering now strongly favors viable, efficient quick-start encodes (roughly 350 MB to 1.5 GB) over huge remuxes once the swarm is healthy.

          CI proves build/signing/package wiring. Physical-TV runtime still needs verification on real hardware.
          EOF

          if gh release view v0.7.5-beta.7 >/dev/null 2>&1; then
            gh release upload v0.7.5-beta.7 --clobber Orvix-v0.7.5-beta.7-Android-TV.apk
            gh release edit v0.7.5-beta.7 \
              --title 'Orvix v0.7.5-beta.7 — Stremio-style Android TV' \
              --prerelease \
              --notes-file /tmp/beta7-notes.md
          else
            gh release create v0.7.5-beta.7 \
              --target "${{ github.sha }}" \
              --title 'Orvix v0.7.5-beta.7 — Stremio-style Android TV' \
              --prerelease \
              --notes-file /tmp/beta7-notes.md \
              Orvix-v0.7.5-beta.7-Android-TV.apk
          fi
