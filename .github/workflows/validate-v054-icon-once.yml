name: Validate Orvix v0.5.4 Icon Once

on:
  push:
    branches:
      - orvix-v0.5.4-icon-fix
    paths:
      - '.github/workflows/validate-v054-icon-once.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: orvix-v0.5.4-icon-fix
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preserve pinned icon hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash windows\runner\resources\app_icon.ico -Algorithm SHA256).Hash
          "ORVIX_ICON_HASH=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ((Get-Item windows\runner\resources\app_icon.ico).Length -lt 8000) { throw 'Pinned icon is unexpectedly small.' }

      - name: Generate Windows runner
        shell: pwsh
        run: flutter create --platforms=windows --project-name orvix .

      - name: Restore pinned supplied icon
        shell: pwsh
        run: |
          git checkout HEAD -- windows/runner/resources/app_icon.ico
          $hash = (Get-FileHash windows\runner\resources\app_icon.ico -Algorithm SHA256).Hash
          if ($hash -ne $env:ORVIX_ICON_HASH) { throw 'Pinned icon changed during runner generation.' }

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app sources
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Build Windows release
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler not found.' }
          & $iscc '/DMyAppVersion=0.5.4' 'installer\orvix.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Verify packaged files exist
        shell: pwsh
        run: |
          if (-not (Test-Path 'build\windows\x64\runner\Release\orvix.exe')) { throw 'orvix.exe missing.' }
          if (-not (Test-Path 'installer-output\Orvix-Setup-v0.5.4-Windows-x64.exe')) { throw 'installer missing.' }

      - name: Remove validation helper
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/validate-v054-icon-once.yml
          git commit -m "ci: remove one-time v0.5.4 icon validator"
          git push origin HEAD:orvix-v0.5.4-icon-fix
