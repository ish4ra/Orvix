name: Apply Orvix v0.5.5 Smart Buffer + Compatibility

on:
  push:
    branches:
      - orvix-v0.5.5-user-ico
    paths:
      - '.github/workflows/orvix-v055-smart-buffer-compat.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: orvix-v0.5.5-user-ico
          fetch-depth: 0

      - name: Apply patch
        run: python tools/patch_v055.py

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows runner
        run: flutter create --platforms=windows --project-name orvix .

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app sources
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Build Windows release
        run: flutter build windows --release

      - name: Commit validated update
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/orvix-v055-smart-buffer-compat.yml tools/patch_v055.py
          git add lib/services/playback_service.dart lib/services/source_provider_service.dart lib/screens/details_screen.dart lib/screens/player_screen.dart pubspec.yaml
          git commit -m "feat: smart buffering and compatibility filter"
          git push origin HEAD:orvix-v0.5.5-user-ico
