name: Release Orvix v0.7.4-alpha.01 Android Mobile Install Compatibility

on:
  push:
    branches:
      - orvix-v0.7.4-alpha.01
    paths:
      - '.github/workflows/orvix-v074-alpha01-android-mobile-only.yml'

permissions:
  contents: write

jobs:
  android-native:
    name: Prepare Android P2P engine
    runs-on: ubuntu-latest
    steps:
      - name: Download pinned native stream-server builds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native/jniLibs/{armeabi-v7a,arm64-v8a,x86,x86_64} native/libs tmp

          download_extract() {
            abi="$1"
            file="$2"
            sha="$3"
            url="https://github.com/stremio-native/stremio-android/releases/download/v1.2.4/$file"
            curl --fail --location --retry 4 --retry-delay 2 "$url" -o "tmp/$file"
            echo "$sha  tmp/$file" | sha256sum -c -
            unzip -p "tmp/$file" "lib/$abi/libstream_server.so" > "native/jniLibs/$abi/libstream_server.so"
            unzip -p "tmp/$file" "lib/$abi/libc++_shared.so" > "native/jniLibs/$abi/libc++_shared.so"
            test -s "native/jniLibs/$abi/libstream_server.so"
            test -s "native/jniLibs/$abi/libc++_shared.so"
          }

          download_extract arm64-v8a             StremioMobile-v1.2.4-arm64-v8a-release.apk             3ffd96e6c6f0b23845f7ee6ab721d52ba1534055304959ed84c9589aac8bc97e
          download_extract armeabi-v7a             StremioMobile-v1.2.4-armeabi-v7a-release.apk             519ab54a8a57e93c5a2f2a70cced18673063cffcb88cfdcd0ec6c9a7e5f5570e
          download_extract x86             StremioMobile-v1.2.4-x86-release.apk             201012b229914b533665f4c477140f174d7b933fdc27c1fae6a2fb3a1f232058
          download_extract x86_64             StremioMobile-v1.2.4-x86_64-release.apk             bee94497864d46a3b7c1905848e161da03179ca4ff85c6808710cdd435cafc94

          curl --fail --location --retry 4             "https://raw.githubusercontent.com/stremio-native/stremio-android/4bdef3b6be1186d9aa22acd8b3ec391c22f0e083/app/libs/rustls-platform-verifier-0.1.1.aar"             -o native/libs/rustls-platform-verifier-0.1.1.aar
          test -s native/libs/rustls-platform-verifier-0.1.1.aar

      - uses: actions/upload-artifact@v4
        with:
          name: android-native-engine
          path: native/
          if-no-files-found: error

  android-mobile:
    name: Android Mobile compatibility APK
    runs-on: ubuntu-latest
    needs: android-native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create --platforms=android --org com.orvix --project-name orvix .

      - uses: actions/download-artifact@v4
        with:
          name: android-native-engine
          path: android-native

      - name: Configure mobile P2P and compatibility packaging
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pillow

          mkdir -p android/app/src/main/jniLibs android/app/libs
          cp -R android-native/jniLibs/. android/app/src/main/jniLibs/
          cp android-native/libs/rustls-platform-verifier-0.1.1.aar android/app/libs/

          python3 tools/configure_android_build.py
          python3 tools/configure_android_mobile_compat.py

          grep -q 'android:extractNativeLibs="true"' android/app/src/main/AndroidManifest.xml
          grep -q 'minSdk = 23' android/app/build.gradle.kts
          grep -q 'useLegacyPackaging = true' android/app/build.gradle.kts

      - name: Restore stable Android signing key
        env:
          ORVIX_ANDROID_KEYSTORE_B64: ${{ secrets.ORVIX_ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ORVIX_ANDROID_KEYSTORE_B64" | base64 --decode > android/app/orvix-release.jks
          test -s android/app/orvix-release.jks
          keytool -list -keystore android/app/orvix-release.jks             -storepass 'OrvixAlpha-2026-Sign!' -alias orvix >/dev/null
          python3 tools/configure_android_signing.py

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-fatal-warnings --no-fatal-infos

      - name: Build universal compatibility APK
        run: flutter build apk --release

      - name: Verify install compatibility
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f \( -name aapt2 -o -name aapt \) | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"

          unzip -t "$APK" >/dev/null
          "$ZIPALIGN" -c -v 4 "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt

          grep -q "Verified using v1 scheme (JAR signing): true" /tmp/apksigner.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/apksigner.txt
          grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" /tmp/apksigner.txt
          grep -q "certificate SHA-256 digest: c86153a3a0d3f49192b37c6574e23c41716c2b9935fdbcf38d6902a3e60fa4ab" /tmp/apksigner.txt
          grep -q "sdkVersion:'23'" /tmp/badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/badging.txt

          unzip -l "$APK" | grep 'lib/arm64-v8a/libstream_server.so'
          unzip -l "$APK" | grep 'lib/armeabi-v7a/libstream_server.so'

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Orvix-v0.7.4-alpha.01-Android-Mobile-Compat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-mobile-compat
          path: Orvix-v0.7.4-alpha.01-Android-Mobile-Compat.apk

  release:
    runs-on: ubuntu-latest
    needs: android-mobile
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-mobile-compat
          path: dist

      - name: Publish Android-only hotfix prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          APK=dist/Orvix-v0.7.4-alpha.01-Android-Mobile-Compat.apk
          test -s "$APK"

          gh release create v0.7.4-alpha.01             --target '${{ github.sha }}'             --title 'Orvix v0.7.4-alpha.01 — Android Mobile Install Compatibility'             --prerelease             --notes "Android Mobile-only hotfix build. Windows and Android TV were intentionally not rebuilt.

          This compatibility APK uses the same persistent Orvix signing certificate, adds v1 + v2 + v3 APK signatures, lowers minSdk metadata to API 23, and uses legacy extracted native-library packaging for broader LineageOS/custom-ROM installer compatibility.

          Test this single universal APK first. If LineageOS still reports the package as invalid, the APK itself has already passed zip, alignment, signature, manifest and native-library checks in CI; the next useful data is the exact Package Manager failure code from adb install."             "$APK"

# retrigger after Android compatibility patch
