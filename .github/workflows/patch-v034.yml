name: Apply Pikora v0.3.4 Playback Alignment

on:
  push:
    branches:
      - v0.3-flutter
    paths:
      - '.github/workflows/patch-v034.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply playback patch
        run: python tool/patch_v034.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Pikora Build Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/pikpak_transfer_service.dart lib/services/playback_service.dart lib/screens/player_screen.dart pubspec.yaml CHANGELOG.md
          git rm .github/workflows/patch-v034.yml tool/patch_v034.py
          git commit -m "fix: align PikPak playback with Debrify"
          git push origin HEAD:v0.3-flutter
