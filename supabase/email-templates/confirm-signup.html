<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#08100a;color:#f3f6f3;font-family:Arial,Helvetica,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#08100a;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#0d120e;border:1px solid #263627;border-radius:18px;padding:28px;">
            <tr>
              <td>
                <div style="font-size:28px;font-weight:800;letter-spacing:-0.5px;color:#b7ff39;">Orvix</div>
                <h1 style="margin:24px 0 8px;font-size:24px;line-height:1.25;color:#ffffff;">Verify your email</h1>
                <p style="margin:0 0 22px;color:#c7d0c8;line-height:1.6;">Enter this 6-digit code in the Orvix app to finish creating your account.</p>
                <div style="padding:18px 20px;border-radius:14px;background:#151d16;border:1px solid #314b33;text-align:center;font-size:34px;letter-spacing:8px;font-weight:800;color:#b7ff39;">{{ .Token }}</div>
                <p style="margin:22px 0 0;color:#9da89e;font-size:13px;line-height:1.6;">If you did not create an Orvix account, you can safely ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
